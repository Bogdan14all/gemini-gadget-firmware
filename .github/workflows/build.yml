name: Build Gemini OS - Step 1 Touch Test

on:
  workflow_dispatch:

jobs:
  build-minimal:
    name: Build - Touch Feedback Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare V2 Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install LVGL 9.1
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino/libraries" ]; then
            cp -r Arduino/libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@9.1.0 2>/dev/null || true

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_USE_STDLIB_MALLOC LV_STDLIB_BUILTIN
          #define LV_MEM_SIZE_KILOBYTES 128
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20
          #define LV_USE_LABEL 1
          #define LV_USE_DEMO_WIDGETS 0
          #define LV_USE_DEMO_MUSIC 0
          #define LV_USE_DEMO_BENCHMARK 0
          #define LV_USE_DEMO_STRESS 0
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h
          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/src/lv_conf.h 2>/dev/null || true
          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/lv_conf.h 2>/dev/null || true
          cp ~/Arduino/libraries/lv_conf.h Arduino/examples/10_LVGL_V9_Test/lv_conf.h 2>/dev/null || true
          rm -rf ~/Arduino/libraries/lvgl/src/demos ~/Arduino/libraries/lvgl/demos 2>/dev/null || true

      - name: Patch Drivers & Generate Touch Test Sketch
        shell: bash
        run: |
          SKETCH_DIR="Arduino/examples/10_LVGL_V9_Test"

          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include "demos/lv_demos.h"|// #include "demos/lv_demos.h"|g' {} + 2>/dev/null || true
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|lv_demo_widgets();|// lv_demo_widgets();|g' {} + 2>/dev/null || true

          python3 - << 'PYEOF'
          import re, os
          sketch_dir = "Arduino/examples/10_LVGL_V9_Test"

          # 1. lcd_bl_pwm_bsp.c: fara ledc_stop
          for root, dirs, files in os.walk(sketch_dir):
              for file in files:
                  if file == "lcd_bl_pwm_bsp.c":
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          bl_c = f.read()
                      bl_c = re.sub(r'ledc_stop\s*\([^;]+\);', '// ledc_stop disabled', bl_c)
                      with open(p, "w", encoding="utf-8") as f:
                          f.write(bl_c)

          # 2. I2C init function
          i2c_h_path = f"{sketch_dir}/i2c_bsp.h"
          i2c_init_func = "bsp_i2c_init"
          if os.path.exists(i2c_h_path):
              with open(i2c_h_path, "r", encoding="utf-8", errors="ignore") as f:
                  h = f.read()
              for f_name, f_args in re.findall(
                  r'(?:esp_err_t|void|int|bool)\s+([a-zA-Z0-9_]+)\s*\(([^)]*)\)\s*;', h):
                  if "init" in f_name.lower() and "i2c" in f_name.lower() \
                     and f_args.strip() in ("", "void"):
                      i2c_init_func = f_name
                      break
          print(f"[OK] I2C init = {i2c_init_func}")

          # 3. lvgl_port.c: eliminam doar ESP_ERROR_CHECK fatale
          #    NU mai punem stub pe TouchInputReadCallback - il lasam original!
          port_path = f"{sketch_dir}/lvgl_port.c"
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              code = f.read()

          code = code.replace("LV_COLOR_FORMAT_GET_SIZE(LV_COLOR_FORMAT_RGB565)", "2")
          code = code.replace("lv_color_format_get_size(LV_COLOR_FORMAT_RGB565)", "2")

          # Fara ESP_ERROR_CHECK care pot aborta
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*i2c_master_get_bus_handle\s*\(\s*0\s*,\s*&tca9554_i2c_bus\s*\)\s*\)\s*;',
              'if (i2c_master_get_bus_handle(0, &tca9554_i2c_bus) != ESP_OK) { puts("[EXIO] bus 0 not ready"); tca9554_i2c_bus = NULL; } else { puts("[EXIO] bus 0 acquired!"); }',
              code)
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_new_i2c_tca9554\s*\([^;]+\)\s*\)\s*;',
              'if (tca9554_i2c_bus != NULL) { if (esp_io_expander_new_i2c_tca9554(tca9554_i2c_bus, ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander) == ESP_OK) { puts("[EXIO] TCA9554 ok"); } else { puts("[EXIO] TCA9554 fail"); io_expander = NULL; } } else { io_expander = NULL; }',
              code)
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_dir\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;',
              r'if (io_expander != NULL) { esp_io_expander_set_dir(io_expander, \g<1>); }',
              code)
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_level\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;',
              r'if (io_expander != NULL) { esp_io_expander_set_level(io_expander, \g<1>); }',
              code)

          # NU mai inlocuim TouchInputReadCallback - il lasam pe cel original
          # (comentat pentru claritate)
          # safe_touch = ...  # eliminat
          # pattern = ...     # eliminat
          # code = re.sub(pattern, safe_touch, ...)  # eliminat

          with open(port_path, "w", encoding="utf-8") as f:
              f.write(code)
          print("[OK] lvgl_port.c patched (touch callback PASTRAT original)")

          # 4. Inject lvgl_port_lock/unlock
          h_path = f"{sketch_dir}/lvgl_port.h"
          with open(h_path, "r", encoding="utf-8", errors="ignore") as f:
              h_content = f.read()
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              c_content = f.read()

          if "lvgl_port_lock" not in h_content:
              mux_var = None
              for pat in [r'SemaphoreHandle_t\s+(\w*[Mm]ux\w*)\s*[;=]',
                          r'SemaphoreHandle_t\s+(\w+)\s*[;=]']:
                  m = re.search(pat, c_content)
                  if m:
                      mux_var = m.group(1)
                      break
              if mux_var is None:
                  mux_var = "lvgl_port_mux"
                  c_content = re.sub(
                      r'(#include[^\n]+\n)(?![^\n]*#include)',
                      r'\1\nstatic SemaphoreHandle_t ' + mux_var + ' = NULL;\n',
                      c_content, count=1, flags=re.DOTALL)
                  c_content = re.sub(
                      r'(esp_err_t\s+lvgl_port_init\s*\([^)]*\)\s*\{)',
                      r'\1\n    ' + mux_var + ' = xSemaphoreCreateMutex();',
                      c_content, count=1)

              c_content += f"""

          bool lvgl_port_lock(uint32_t timeout_ms) {{
              if ({mux_var} == NULL) return false;
              return xSemaphoreTake({mux_var}, pdMS_TO_TICKS(timeout_ms)) == pdTRUE;
          }}
          void lvgl_port_unlock(void) {{
              if ({mux_var} != NULL) xSemaphoreGive({mux_var});
          }}
          """
              h_content += """
          #ifdef __cplusplus
          extern "C" {
          #endif
          bool lvgl_port_lock(uint32_t timeout_ms);
          void lvgl_port_unlock(void);
          #ifdef __cplusplus
          }
          #endif
          """
              with open(h_path, "w", encoding="utf-8") as f:
                  f.write(h_content)
              with open(port_path, "w", encoding="utf-8") as f:
                  f.write(c_content)
              print(f"[OK] lvgl_port_lock/unlock injected")

          # 5. Genereaza .ino cu touch feedback
          ino = [
              '#include <Arduino.h>',
              '#include <WiFi.h>',
              '',
              'extern "C" {',
              '#include "i2c_bsp.h"',
              '#include "lvgl_port.h"',
              '}',
              '#include <lvgl.h>',
              '',
              '#define BOOT_BTN 0',
              '#define PWR_BTN  16',
              '#define LCD_BL   42',
              '',
              'lv_obj_t *lbl_touch_xy    = NULL;',
              'lv_obj_t *lbl_touch_state = NULL;',
              'lv_obj_t *lbl_boot_state  = NULL;',
              'lv_obj_t *lbl_pwr_state   = NULL;',
              'lv_obj_t *touch_dot       = NULL;',
              '',
              'static void touch_event_cb(lv_event_t *e) {',
              '    lv_event_code_t code = lv_event_get_code(e);',
              '    lv_indev_t *indev = lv_indev_get_act();',
              '    if (!indev || !lbl_touch_xy || !lbl_touch_state) return;',
              '',
              '    lv_point_t p;',
              '    lv_indev_get_point(indev, &p);',
              '',
              '    char buf[40];',
              '    lv_snprintf(buf, sizeof(buf), "X:%d  Y:%d", p.x, p.y);',
              '    lv_label_set_text(lbl_touch_xy, buf);',
              '',
              '    if (touch_dot) {',
              '        lv_obj_set_pos(touch_dot, p.x - 15, p.y - 15);',
              '    }',
              '',
              '    if (code == LV_EVENT_PRESSED) {',
              '        lv_label_set_text(lbl_touch_state, "APASAT!");',
              '        lv_obj_set_style_text_color(lbl_touch_state, lv_color_hex(0xFF0000), 0);',
              '        if (touch_dot) lv_obj_set_style_bg_color(touch_dot, lv_color_hex(0xFF0000), 0);',
              '        Serial.printf("[TOUCH] PRESSED x=%d y=%d\\n", p.x, p.y);',
              '    } else if (code == LV_EVENT_RELEASED) {',
              '        lv_label_set_text(lbl_touch_state, "Eliberat");',
              '        lv_obj_set_style_text_color(lbl_touch_state, lv_color_hex(0x00AA00), 0);',
              '        if (touch_dot) lv_obj_set_style_bg_color(touch_dot, lv_color_hex(0x00AA00), 0);',
              '        Serial.printf("[TOUCH] RELEASED\\n");',
              '    } else if (code == LV_EVENT_PRESSING) {',
              '        lv_label_set_text(lbl_touch_state, "Apasat...");',
              '    }',
              '}',
              '',
              'void build_touch_ui() {',
              '    pinMode(LCD_BL, OUTPUT);',
              '    digitalWrite(LCD_BL, LOW);',
              '',
              '    lvgl_port_lock(1000);',
              '    lv_obj_t *scr = lv_screen_active();',
              '    if (!scr) scr = lv_scr_act();',
              '    if (!scr) { lvgl_port_unlock(); return; }',
              '',
              '    lv_obj_clean(scr);',
              '    lv_obj_set_style_bg_color(scr, lv_color_hex(0x38BDF8), 0);',
              '    lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, 0);',
              '',
              '    // Titlu',
              '    lv_obj_t *t = lv_label_create(scr);',
              '    lv_label_set_text(t, "Gemini OS");',
              '    lv_obj_set_style_text_color(t, lv_color_hex(0x000000), 0);',
              '    lv_obj_set_style_text_font(t, &lv_font_montserrat_20, 0);',
              '    lv_obj_align(t, LV_ALIGN_TOP_MID, 0, 30);',
              '',
              '    // Instructiune',
              '    lv_obj_t *hint = lv_label_create(scr);',
              '    lv_label_set_text(hint, "Atinge ecranul!");',
              '    lv_obj_set_style_text_color(hint, lv_color_hex(0x0F172A), 0);',
              '    lv_obj_set_style_text_font(hint, &lv_font_montserrat_14, 0);',
              '    lv_obj_align(hint, LV_ALIGN_TOP_MID, 0, 70);',
              '',
              '    // Coordonate',
              '    lbl_touch_xy = lv_label_create(scr);',
              '    lv_label_set_text(lbl_touch_xy, "X:--  Y:--");',
              '    lv_obj_set_style_text_color(lbl_touch_xy, lv_color_hex(0xFFFFFF), 0);',
              '    lv_obj_set_style_text_font(lbl_touch_xy, &lv_font_montserrat_18, 0);',
              '    lv_obj_align(lbl_touch_xy, LV_ALIGN_CENTER, 0, -40);',
              '',
              '    // Stare touch',
              '    lbl_touch_state = lv_label_create(scr);',
              '    lv_label_set_text(lbl_touch_state, "Eliberat");',
              '    lv_obj_set_style_text_color(lbl_touch_state, lv_color_hex(0x00AA00), 0);',
              '    lv_obj_set_style_text_font(lbl_touch_state, &lv_font_montserrat_16, 0);',
              '    lv_obj_align(lbl_touch_state, LV_ALIGN_CENTER, 0, -10);',
              '',
              '    // Butoane fizice',
              '    lbl_boot_state = lv_label_create(scr);',
              '    lv_label_set_text(lbl_boot_state, "BOOT: liber");',
              '    lv_obj_set_style_text_font(lbl_boot_state, &lv_font_montserrat_12, 0);',
              '    lv_obj_set_style_text_color(lbl_boot_state, lv_color_hex(0x000000), 0);',
              '    lv_obj_align(lbl_boot_state, LV_ALIGN_CENTER, 0, 30);',
              '',
              '    lbl_pwr_state = lv_label_create(scr);',
              '    lv_label_set_text(lbl_pwr_state, "PWR: liber");',
              '    lv_obj_set_style_text_font(lbl_pwr_state, &lv_font_montserrat_12, 0);',
              '    lv_obj_set_style_text_color(lbl_pwr_state, lv_color_hex(0x000000), 0);',
              '    lv_obj_align(lbl_pwr_state, LV_ALIGN_CENTER, 0, 50);',
              '',
              '    // Dot urmaritor',
              '    touch_dot = lv_obj_create(scr);',
              '    lv_obj_set_size(touch_dot, 30, 30);',
              '    lv_obj_set_style_radius(touch_dot, LV_RADIUS_CIRCLE, 0);',
              '    lv_obj_set_style_bg_color(touch_dot, lv_color_hex(0x00AA00), 0);',
              '    lv_obj_set_style_bg_opa(touch_dot, LV_OPA_80, 0);',
              '    lv_obj_set_style_border_width(touch_dot, 0, 0);',
              '    lv_obj_set_pos(touch_dot, 10, 10);',
              '',
              '    // Evenimente touch pe screen',
              '    lv_obj_add_event_cb(scr, touch_event_cb, LV_EVENT_PRESSED,  NULL);',
              '    lv_obj_add_event_cb(scr, touch_event_cb, LV_EVENT_PRESSING, NULL);',
              '    lv_obj_add_event_cb(scr, touch_event_cb, LV_EVENT_RELEASED, NULL);',
              '',
              '    lvgl_port_unlock();',
              '    Serial.println("[UI] Touch test UI built");',
              '}',
              '',
              'void setup() {',
              '    Serial.begin(115200);',
              '    delay(500);',
              '    Serial.println("\\n=== Gemini OS Touch Test ===");',
              '',
              '    pinMode(BOOT_BTN, INPUT_PULLUP);',
              '    pinMode(PWR_BTN, INPUT_PULLUP);',
              f'    {i2c_init_func}();',
              '    delay(50);',
              '    lvgl_port_init();',
              '    delay(300);',
              '',
              '    // Verifica daca exista indev pointer (touch)',
              '    lv_indev_t *indev = lv_indev_get_next(NULL);',
              '    int count = 0;',
              '    while (indev) {',
              '        count++;',
              '        indev = lv_indev_get_next(indev);',
              '    }',
              '    Serial.printf("[INDEV] %d input device(s) registered\\n", count);',
              '',
              '    build_touch_ui();',
              '    Serial.println("[READY] Atinge ecranul!");',
              '}',
              '',
              'void loop() {',
              '    static unsigned long last_btn = 0;',
              '    if (millis() - last_btn > 100) {',
              '        last_btn = millis();',
              '        if (lvgl_port_lock(50)) {',
              '            if (lbl_boot_state)',
              '                lv_label_set_text(lbl_boot_state,',
              '                    digitalRead(BOOT_BTN) == LOW ? "BOOT: APASAT" : "BOOT: liber");',
              '            if (lbl_pwr_state)',
              '                lv_label_set_text(lbl_pwr_state,',
              '                    digitalRead(PWR_BTN) == LOW ? "PWR: APASAT" : "PWR: liber");',
              '            lvgl_port_unlock();',
              '        }',
              '    }',
              '    delay(20);',
              '}',
              ''
          ]
          with open(f"{sketch_dir}/10_LVGL_V9_Test.ino", "w", encoding="utf-8") as f:
              f.write('\n'.join(ino))
          print("[OK] Touch test .ino generat")
          PYEOF

      - name: Compile Firmware
        run: |
          SKETCH_PATH="Arduino/examples/10_LVGL_V9_Test/10_LVGL_V9_Test.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge into Single .bin
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          echo "BL=$BOOTLOADER"
          echo "PT=$PARTITIONS"
          echo "APP=$APP_BIN"
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-os-full-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/gemini-os-full-0x0.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-touch-test
          path: package_bin/gemini-os-full-0x0.bin
          if-no-files-found: error
