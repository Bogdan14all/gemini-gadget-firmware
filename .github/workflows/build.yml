
name: Build Clean Gemini Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 Gemini Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Configure Gemini Engine and Side-by-Side UI
        shell: bash
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'revelion' }}
        run: |
          mkdir -p esp32/components/muse/src

          find esp32/ -name "led_status.c" -exec sed -i 's/#error.*SPI flash pin.*/\/\/ bypassed SPI flash pin/' {} + 2&gt;/dev/null || true

          cat &lt;&lt; 'EOF' &gt; esp32/components/muse/src/gemini_engine.c
          #include
