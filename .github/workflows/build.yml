name: Build Gemini OS - v7 Official Audio Driver

on:
  workflow_dispatch:

jobs:
  build:
    name: Build v7 (esp_codec_dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install LVGL 9.1
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino/libraries" ]; then
            cp -r Arduino/libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@9.1.0

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_USE_STDLIB_MALLOC LV_STDLIB_BUILTIN
          #define LV_MEM_SIZE_KILOBYTES 128
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_MONTSERRAT_28 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20
          #define LV_USE_LABEL 1
          #define LV_USE_BAR 1
          #define LV_USE_DEMO_WIDGETS 0
          #define LV_USE_DEMO_MUSIC 0
          #define LV_USE_DEMO_BENCHMARK 0
          #define LV_USE_DEMO_STRESS 0
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h
          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/lv_conf.h 2>/dev/null || true
          rm -rf ~/Arduino/libraries/lvgl/src/demos ~/Arduino/libraries/lvgl/demos 2>/dev/null || true

      - name: Prepare Audio Test Sketch
        shell: bash
        run: |
          # Copy official example to a working directory
          cp -r Examples/Arduino/08_Audio_Test ./audio_sketch
          cd audio_sketch

          # Remove the original .ino (we will replace it)
          rm -f 08_Audio_Test.ino

          # The example expects these includes from user_config.h etc.
          # We'll create a new .ino that calls the official init functions.
          cat > audio_sketch.ino << 'EOF'
#include "user_config.h"
#include "lvgl_port.h"
#include "esp_err.h"
#include "i2c_bsp.h"
#include "src/codec_board/codec_board.h"
#include "src/codec_board/codec_init.h"
#include "src/tca9554/esp_io_expander_tca9554.h"

esp_codec_dev_handle_t playback = NULL;
esp_codec_dev_handle_t record = NULL;
esp_io_expander_handle_t io_expander = NULL;

// UI
lv_obj_t *lbl_peak = NULL;
lv_obj_t *lbl_status = NULL;

// State for timer
volatile int g_peak = 0;

// Timer callback (runs in LVGL task)
void ui_timer_cb(lv_timer_t *t) {
    if (lbl_peak) {
        char buf[32];
        snprintf(buf, sizeof(buf), "Peak: %d", g_peak);
        lv_label_set_text(lbl_peak, buf);
        lv_obj_set_style_text_color(lbl_peak,
            g_peak > 0 ? lv_color_hex(0x22C55E) : lv_color_hex(0xEF4444), 0);
    }
    if (lbl_status) {
        lv_label_set_text(lbl_status, "Recording...");
    }
}

void build_ui() {
    lvgl_port_lock(1000);
    lv_obj_t *scr = lv_screen_active();
    if (!scr) scr = lv_scr_act();
    if (!scr) { lvgl_port_unlock(); return; }

    lv_obj_clean(scr);
    lv_obj_set_style_bg_color(scr, lv_color_hex(0x0F172A), 0);
    lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, 0);

    lv_obj_t *title = lv_label_create(scr);
    lv_label_set_text(title, "v7 Official Audio");
    lv_obj_set_style_text_color(title, lv_color_hex(0x38BDF8), 0);
    lv_obj_set_style_text_font(title, &lv_font_montserrat_20, 0);
    lv_obj_align(title, LV_ALIGN_TOP_MID, 0, 20);

    lbl_status = lv_label_create(scr);
    lv_label_set_text(lbl_status, "Initializing...");
    lv_obj_set_style_text_color(lbl_status, lv_color_hex(0x94A3B8), 0);
    lv_obj_set_style_text_font(lbl_status, &lv_font_montserrat_14, 0);
    lv_obj_align(lbl_status, LV_ALIGN_CENTER, 0, -40);

    lbl_peak = lv_label_create(scr);
    lv_label_set_text(lbl_peak, "Peak: 0");
    lv_obj_set_style_text_color(lbl_peak, lv_color_hex(0xEF4444), 0);
    lv_obj_set_style_text_font(lbl_peak, &lv_font_montserrat_28, 0);
    lv_obj_align(lbl_peak, LV_ALIGN_CENTER, 0, 0);

    lvgl_port_unlock();

    // Create timer (runs in LVGL task, thread-safe)
    lv_timer_create(ui_timer_cb, 200, NULL);
    Serial.println("[UI] Built + timer");
}

void tca9554_init_official(void) {
    i2c_master_bus_handle_t tca9554_i2c_bus_ = NULL;
    ESP_ERROR_CHECK(i2c_master_get_bus_handle(0, &tca9554_i2c_bus_));
    esp_io_expander_new_i2c_tca9554(tca9554_i2c_bus_,
        ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander);
    esp_io_expander_set_dir(io_expander, IO_EXPANDER_PIN_NUM_7, IO_EXPANDER_OUTPUT);
    esp_io_expander_set_level(io_expander, IO_EXPANDER_PIN_NUM_7, 1);
}

void audio_init_official(void) {
    set_codec_board_type("S3_LCD_3_49");
    codec_init_cfg_t codec_cfg = {
        .in_mode = CODEC_I2S_MODE_TDM,
        .out_mode = CODEC_I2S_MODE_TDM,
        .in_use_tdm = false,
        .reuse_dev = false,
    };
    ESP_ERROR_CHECK(init_codec(&codec_cfg));
    playback = get_playback_handle();
    record = get_record_handle();
}

void audio_play_init_official(void) {
    esp_codec_dev_set_out_vol(playback, 100.0);
    esp_codec_dev_set_in_gain(record, 35.0);
    esp_codec_dev_sample_info_t fs = {};
    fs.sample_rate = 24000;
    fs.channel = 2;
    fs.bits_per_sample = 16;
    esp_codec_dev_open(playback, &fs);
    esp_codec_dev_open(record, &fs);
}

void setup() {
    Serial.begin(115200);
    delay(500);
    Serial.println("\n[BOOT] BUILD v7-official-audio");

    // Initialize I2C (from BSP)
    bsp_i2c_init();
    delay(50);

    // Initialize LVGL
    lvgl_port_init();
    delay(300);
    build_ui();

    // Initialize TCA9554 (official way)
    tca9554_init_official();

    // Initialize audio codecs via esp_codec_dev
    audio_init_official();
    audio_play_init_official();

    Serial.println("[AUDIO] Ready - speak now!");
    lbl_status_set("Recording...");
}

void lbl_status_set(const char* s) {
    if (lbl_status) {
        // Not thread-safe here, but we are in setup, before timer starts
        // Actually timer is already created. Use direct call? Better use lv_async_call? But we can just set text.
        // Since we are still in setup, and LVGL task is running, we should use lock.
        lvgl_port_lock(100);
        lv_label_set_text(lbl_status, s);
        lvgl_port_unlock();
    }
}

void loop() {
    // Read audio via esp_codec_dev
    static int16_t buf[1024];
    int err = esp_codec_dev_read(record, buf, sizeof(buf));
    if (err == ESP_OK) {
        int samples = sizeof(buf) / sizeof(int16_t);
        int32_t peak = 0;
        for (int i = 0; i < samples; i++) {
            int32_t v = buf[i];
            if (v < 0) v = -v;
            if (v > peak) peak = v;
        }
        g_peak = (int)peak;
        Serial.printf("[MIC] peak=%d\n", (int)peak);
    } else {
        Serial.printf("[MIC] read error: %d\n", err);
    }
    delay(100);
}
EOF

      - name: Compile Firmware
        run: |
          SKETCH_PATH="audio_sketch/audio_sketch.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge into Single .bin
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-v7-official-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/gemini-v7-official-0x0.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-v7-official
          path: package_bin/gemini-v7-official-0x0.bin
          if-no-files-found: error
