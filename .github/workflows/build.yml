name: Build Gemini OS - v52 Cloud Proxy

on:
  workflow_dispatch:

jobs:
  build:
    name: Build v52 Cloud Proxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare ESP32-S3-Touch-LCD-3.49
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries (LVGL 8.3.11 + ArduinoJson)
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino_Libraries" ]; then
            cp -r Arduino_Libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@8.3.11
          arduino-cli lib install "ArduinoJson"@7.0.4

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_COLOR_16_SWAP 1
          #define LV_MEM_CUSTOM 0
          #define LV_MEM_SIZE (128U * 1024U)
          #define LV_TICK_CUSTOM 0
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_MONTSERRAT_28 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20
          #define LV_USE_DEMO_WIDGETS 0
          #define LV_USE_DEMO_MUSIC 0
          #define LV_USE_DEMO_BENCHMARK 0
          #define LV_USE_DEMO_STRESS 0
          #define LV_USE_LOG 0
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h

      - name: Copy 08_Audio_Test as base & Patch
        shell: bash
        run: |
          rm -rf sketch
          cp -r Examples/Arduino/08_Audio_Test sketch
          cd sketch
          
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include "demos/lv_demos.h"|// #include "demos/lv_demos.h"|g' {} + 2>/dev/null || true
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|lv_demo_widgets();|// lv_demo_widgets();|g' {} + 2>/dev/null || true
          rm -f 08_Audio_Test.ino

          python3 - << 'PYEOF'
          import re, os, glob

          sketch_dir = "."
          port_path = f"{sketch_dir}/lvgl_port.c"
          h_path = f"{sketch_dir}/lvgl_port.h"

          with open(h_path, "r", encoding="utf-8", errors="ignore") as f:
              h_content = f.read()
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              c_content = f.read()

          if "lvgl_port_lock" not in h_content:
              if "example_lvgl_lock" in c_content:
                  c_content += """
          bool lvgl_port_lock(uint32_t timeout_ms) { return example_lvgl_lock(timeout_ms); }
          void lvgl_port_unlock(void) { example_lvgl_unlock(); }
          """
              else:
                  mux_var = "lvgl_port_mux"
                  c_content = re.sub(
                      r'(#include[^\n]+\n)(?![^\n]*#include)',
                      r'\1\nstatic SemaphoreHandle_t ' + mux_var + ' = NULL;\n',
                      c_content, count=1, flags=re.DOTALL)
                  c_content = re.sub(
                      r'(esp_err_t\s+lvgl_port_init\s*\([^)]*\)\s*\{)',
                      r'\1\n    ' + mux_var + ' = xSemaphoreCreateMutex();',
                      c_content, count=1)
                  c_content += f"""
          bool lvgl_port_lock(uint32_t timeout_ms) {{
              if ({mux_var} == NULL) return false;
              return xSemaphoreTake({mux_var}, pdMS_TO_TICKS(timeout_ms)) == pdTRUE;
          }}
          void lvgl_port_unlock(void) {{
              if ({mux_var} != NULL) xSemaphoreGive({mux_var});
          }}
          """
              h_content += """
          #ifdef __cplusplus
          extern "C" {
          #endif
          bool lvgl_port_lock(uint32_t timeout_ms);
          void lvgl_port_unlock(void);
          #ifdef __cplusplus
          }
          #endif
          """
              with open(h_path, "w", encoding="utf-8") as f:
                  f.write(h_content)
              with open(port_path, "w", encoding="utf-8") as f:
                  f.write(c_content)

          i2c_init_func = "bsp_i2c_init"
          for hh in glob.glob(f"{sketch_dir}/*.h"):
              with open(hh, "r", encoding="utf-8", errors="ignore") as f:
                  h = f.read()
              for f_name, f_args in re.findall(r'(?:esp_err_t|void|int|bool)\s+([a-zA-Z0-9_]+)\s*\(([^)]*)\)\s*;', h):
                  if "i2c" in f_name.lower() and "init" in f_name.lower() and f_args.strip() in ("", "void"):
                      i2c_init_func = f_name
                      break

          with open("i2c_func.txt", "w") as f:
              f.write(i2c_init_func)
          PYEOF

      - name: Write sketch.ino
        shell: bash
        run: |
          I2C_FUNC=$(cat sketch/i2c_func.txt)
          python3 - << PYEOF
          import textwrap

          i2c_init = "$I2C_FUNC"

          code = textwrap.dedent(r'''
          #include <Arduino.h>
          #include <WiFi.h>
          #include <HTTPClient.h>
          #include <WiFiClientSecure.h>
          #include <ArduinoJson.h>

          extern "C" {
          #include "lvgl_port.h"
          #include "i2c_bsp.h"
          }

          const char* WIFI_SSID = "TP-Link_2.4G_9318_Guest";
          const char* WIFI_PASS = "revelion";
          
          // ⚠️ ÎNLOCUIEȘTE CU URL-UL TĂU DE LA RENDER
          const char* CLOUD_URL = "https://gemini-proxy-xxxx.onrender.com/chat";

          lv_obj_t *lbl_status = NULL;
          lv_obj_t *lbl_sent = NULL;
          lv_obj_t *lbl_received = NULL;

          void send_request() {
              lvgl_port_lock(100);
              lv_label_set_text(lbl_status, "Se trimite la Cloud...");
              lvgl_port_unlock();

              String prompt = "Salut! Spune-mi o gluma scurta.";
              lvgl_port_lock(100);
              lv_label_set_text(lbl_sent, prompt.c_str());
              lvgl_port_unlock();

              WiFiClientSecure client;
              client.setInsecure(); // Acceptăm certificatul SSL pentru test

              HTTPClient http;
              http.begin(client, CLOUD_URL);
              http.setTimeout(30000); // 30 secunde, Render poate fi lent la "trezire"
              http.addHeader("Content-Type", "application/json");

              JsonDocument doc;
              doc["text"] = prompt;
              String json_payload;
              serializeJson(doc, json_payload);

              int httpResponseCode = http.POST(json_payload);

              lvgl_port_lock(100);
              if (httpResponseCode > 0) {
                  String response = http.getString();
                  JsonDocument respDoc;
                  deserializeJson(respDoc, response);
                  const char* text = respDoc["text"];
                  
                  lv_label_set_text(lbl_status, "Succes!");
                  if (text) lv_label_set_text(lbl_received, text);
                  else lv_label_set_text(lbl_received, "Eroare la parsare.");
              } else {
                  lv_label_set_text(lbl_status, "Eroare Cloud");
                  String err = "Cod: " + String(httpResponseCode);
                  lv_label_set_text(lbl_received, err.c_str());
              }
              lvgl_port_unlock();
              http.end();
          }

          void build_ui() {
              lvgl_port_lock(1000);
              lv_obj_t *scr = lv_scr_act();
              lv_obj_clean(scr);
              lv_obj_set_style_bg_color(scr, lv_color_hex(0x0F172A), 0);
              lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, 0);

              lv_obj_t *title = lv_label_create(scr);
              lv_label_set_text(title, "Cloud Chat");
              lv_obj_set_style_text_color(title, lv_color_hex(0x38BDF8), 0);
              lv_obj_set_style_text_font(title, &lv_font_montserrat_20, 0);
              lv_obj_align(title, LV_ALIGN_TOP_MID, 0, 20);

              lbl_status = lv_label_create(scr);
              lv_label_set_text(lbl_status, "Initializing...");
              lv_obj_set_style_text_color(lbl_status, lv_color_hex(0x94A3B8), 0);
              lv_obj_set_style_text_font(lbl_status, &lv_font_montserrat_14, 0);
              lv_obj_align(lbl_status, LV_ALIGN_TOP_MID, 0, 60);

              lv_obj_t *lbl_sent_title = lv_label_create(scr);
              lv_label_set_text(lbl_sent_title, "Trimis:");
              lv_obj_set_style_text_color(lbl_sent_title, lv_color_hex(0x22C55E), 0);
              lv_obj_set_style_text_font(lbl_sent_title, &lv_font_montserrat_16, 0);
              lv_obj_align(lbl_sent_title, LV_ALIGN_TOP_LEFT, 10, 100);

              lbl_sent = lv_label_create(scr);
              lv_label_set_text(lbl_sent, "...");
              lv_obj_set_style_text_color(lbl_sent, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_font(lbl_sent, &lv_font_montserrat_14, 0);
              lv_obj_set_width(lbl_sent, 150);
              lv_label_set_long_mode(lbl_sent, LV_LABEL_LONG_WRAP);
              lv_obj_align(lbl_sent, LV_ALIGN_TOP_LEFT, 10, 130);

              lv_obj_t *lbl_recv_title = lv_label_create(scr);
              lv_label_set_text(lbl_recv_title, "Primit:");
              lv_obj_set_style_text_color(lbl_recv_title, lv_color_hex(0x38BDF8), 0);
              lv_obj_set_style_text_font(lbl_recv_title, &lv_font_montserrat_16, 0);
              lv_obj_align(lbl_recv_title, LV_ALIGN_TOP_LEFT, 10, 250);

              lbl_received = lv_label_create(scr);
              lv_label_set_text(lbl_received, "Asteptam...");
              lv_obj_set_style_text_color(lbl_received, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_font(lbl_received, &lv_font_montserrat_14, 0);
              lv_obj_set_width(lbl_received, 150);
              lv_label_set_long_mode(lbl_received, LV_LABEL_LONG_WRAP);
              lv_obj_align(lbl_received, LV_ALIGN_TOP_LEFT, 10, 280);

              lvgl_port_unlock();
              Serial.println("[UI] Built");
          }

          void setup() {
              Serial.begin(115200);
              delay(500);
              Serial.println("\n[BOOT] v52-Cloud-Proxy");

              I2C_INIT_CALL
              delay(50);

              lvgl_port_init();
              delay(300);
              build_ui();

              WiFi.mode(WIFI_STA);
              WiFi.begin(WIFI_SSID, WIFI_PASS);
              Serial.println("[WiFi] Connecting...");

              int tries = 0;
              while (WiFi.status() != WL_CONNECTED && tries < 30) {
                  delay(500);
                  Serial.print(".");
                  tries++;
              }
              Serial.println();
              if (WiFi.status() == WL_CONNECTED) {
                  Serial.printf("[WiFi] IP: %s\n", WiFi.localIP().toString().c_str());
                  send_request();
              }
          }

          void loop() {
              delay(1000);
          }
          ''')

          code = code.replace("I2C_INIT_CALL", f"{i2c_init}();")

          with open("sketch/sketch.ino", "w", encoding="utf-8") as f:
              f.write(code.lstrip())
          print("[OK] sketch.ino written")
          PYEOF

      - name: Compile
        run: |
          SKETCH_PATH="sketch/sketch.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-v52-cloud-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/gemini-v52-cloud-0x0.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gemini-v52-cloud
          path: package_bin/gemini-v52-cloud-0x0.bin
          if-no-files-found: error
