name: Build Meta Muse Firmware

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Target Board'
        required: true
        default: 'waveshare-s3-349'

jobs:
  build:
    name: Build Waveshare 3.49 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Meta Muse Gadget SDK
        uses: actions/checkout@v4
        with:
          repository: facebookincubator/muse-gadget-sdk
          submodules: recursive

      - name: Add Waveshare 3.49 Board Overlay
        shell: bash
        run: |
          cat << 'EOF' > esp32/devices/sdkconfig.muse-waveshare-s3-349
          # Waveshare ESP32-S3-Touch-LCD-3.49 V2
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_HOMEHUB_BUTTON_GPIO=0
          CONFIG_HOMEHUB_LED_BACKEND_NONE=y
          EOF

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32
          idf.py -B build-waveshare-349 \
            -DIDF_TARGET=esp32s3 \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-349" \
            build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: muse-waveshare-349-binaries
          path: |
            esp32/build-waveshare-349/**/*.bin
            esp32/build-waveshare-349/**/flasher_args.json
