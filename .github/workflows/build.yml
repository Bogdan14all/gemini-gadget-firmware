name: Build Meta Muse Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Directly Refactor UI Code for 640x172 Resolution
        shell: bash
        run: |
          python3 -c '
          import os, re

          print("Starting native UI layout refactoring for 640x172...")

          for root, _, files in os.walk("esp32"):
              for file in files:
                  if file.endswith((".c", ".cpp", ".h")):
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          s = f.read()

                      orig = s

                      # 1. Refactor Keyboard: Lock height to 80px, align bottom, strip padding
                      def patch_kb(m):
                          var = m.group(1)
                          return (
                              f"{m.group(0)}\n"
                              f"    if ({var}) {{\n"
                              f"        lv_obj_set_height({var}, 80);\n"
                              f"        lv_obj_align({var}, LV_ALIGN_BOTTOM_MID, 0, 0);\n"
                              f"        lv_obj_set_style_pad_all({var}, 1, 0);\n"
                              f"        lv_obj_set_style_pad_gap({var}, 1, 0);\n"
                              f"        lv_obj_set_style_text_font({var}, &lv_font_montserrat_10, 0);\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"(?:lv_obj_t\s*\*\s*)?(\b[a-zA-Z0-9_>.-]+\b)\s*=\s*lv_keyboard_create\([^;]+\);",
                          patch_kb,
                          s
                      )

                      # 2. Refactor Menu & List Buttons (Settings, Wi-Fi networks): 32px height, tight padding
                      def patch_list_btn(m):
                          var = m.group(1)
                          return (
                              f"{m.group(0)}\n"
                              f"    if ({var}) {{\n"
                              f"        lv_obj_set_height({var}, 32);\n"
                              f"        lv_obj_set_style_pad_ver({var}, 2, 0);\n"
                              f"        lv_obj_set_style_pad_hor({var}, 8, 0);\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"(?:lv_obj_t\s*\*\s*)?(\b[a-zA-Z0-9_>.-]+\b)\s*=\s*lv_list_add_btn\([^;]+\);",
                          patch_list_btn,
                          s
                      )

                      # 3. Compress oversized container padding and row gaps to fit 172px screen height
                      s = re.sub(r"(lv_style_set_pad_(?:top|bottom|ver|all)\s*\([^,]+,\s*)(?:1[0-9]|2[0-9]|[7-9])(\s*\))", r"\g<1>3\2", s)
                      s = re.sub(r"(lv_obj_set_style_pad_(?:top|bottom|ver|all)\s*\([^,]+,\s*)(?:1[0-9]|2[0-9]|[7-9])(\s*,)", r"\g<1>3\2", s)
                      s = re.sub(r"(lv_style_set_pad_row\s*\([^,]+,\s*)(?:1[0-9]|2[0-9]|[7-9])(\s*\))", r"\g<1>3\2", s)
                      s = re.sub(r"(lv_obj_set_style_pad_row\s*\([^,]+,\s*)(?:1[0-9]|2[0-9]|[7-9])(\s*,)", r"\g<1>3\2", s)

                      # 4. Remap oversized headers and labels down to compact Montserrat 12
                      s = re.sub(r"&lv_font_montserrat_(?:16|18|20|22|24|28)", r"&lv_font_montserrat_12", s)

                      if s != orig:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(s)
                          print("Refactored layout in:", p)
          '

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32
          
          # Enable smaller font tables in the build so the refactored code links cleanly
          echo "CONFIG_LV_FONT_MONTSERRAT_10=y" >> sdkconfig.defaults
          echo "CONFIG_LV_FONT_MONTSERRAT_12=y" >> sdkconfig.defaults
          
          OVERLAY=$(find devices/ -type f -name "*349*" | head -n 1)
          DEFAULTS="sdkconfig.defaults"
          [ -f "devices/sdkconfig.muse" ] && DEFAULTS="$DEFAULTS;devices/sdkconfig.muse"
          [ -n "$OVERLAY" ] && DEFAULTS="$DEFAULTS;$OVERLAY"
          
          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS="$DEFAULTS" build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: muse-waveshare-v2-binaries
          path: |
            esp32/build-waveshare/**/*.bin
            esp32/build-waveshare/**/flasher_args.json
