name: Build Meta Muse Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Directly Refactor UI Code for Horizontal Split
        shell: bash
        run: |
          python3 -c '
          import os, re

          print("Refactoring UI: reparenting to screen, splitting 210px left / 415px right...")

          for root, _, files in os.walk("esp32"):
              for file in files:
                  if file.endswith((".c", ".cpp", ".h")):
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          s = f.read()

                      orig = s

                      # 1. Reparent both widgets to lv_scr_act(), breaking them out of flex containers
                      def patch_kb_ta(m):
                          kb = m.group(1).strip()
                          ta = m.group(2).strip()
                          return (
                              f"lv_keyboard_set_textarea({kb}, {ta});\n"
                              f"    if ({kb}) {{\n"
                              f"        lv_obj_set_parent({kb}, lv_scr_act());\n"
                              f"        lv_obj_set_size({kb}, 415, 172);\n"
                              f"        lv_obj_align({kb}, LV_ALIGN_RIGHT_MID, 0, 0);\n"
                              f"        lv_obj_set_style_pad_all({kb}, 1, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_row({kb}, 2, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_column({kb}, 2, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_all({kb}, 2, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_pad_row({kb}, 1, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_pad_column({kb}, 1, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_text_font({kb}, &lv_font_montserrat_12, LV_PART_ITEMS);\n"
                              f"        lv_obj_move_foreground({kb});\n"
                              f"    }}\n"
                              f"    if ({ta}) {{\n"
                              f"        lv_obj_set_parent({ta}, lv_scr_act());\n"
                              f"        lv_obj_set_size({ta}, 210, 150);\n"
                              f"        lv_obj_align({ta}, LV_ALIGN_LEFT_MID, 5, 0);\n"
                              f"        lv_obj_set_style_pad_all({ta}, 4, 0);\n"
                              f"        lv_obj_set_style_text_font({ta}, &lv_font_montserrat_12, 0);\n"
                              f"        lv_textarea_set_password_mode({ta}, false);\n"
                              f"        lv_textarea_set_one_line({ta}, false);\n"
                              f"        lv_obj_move_foreground({ta});\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"lv_keyboard_set_textarea\s*\(\s*([^,]+)\s*,\s*([^)]+)\s*\);",
                          patch_kb_ta,
                          s
                      )

                      # 2. Neutralize any hardcoded subsequent keyboard sizing calls
                      s = re.sub(
                          r"lv_obj_set_size\s*\(\s*([^,;]*(?:kb|keyboard)[^,;]*)\s*,[^;]+;",
                          r"lv_obj_set_size(\1, 415, 172);\n    lv_obj_align(\1, LV_ALIGN_RIGHT_MID, 0, 0);",
                          s,
                          flags=re.IGNORECASE
                      )
                      s = re.sub(
                          r"lv_obj_set_height\s*\(\s*([^,;]*(?:kb|keyboard)[^,;]*)\s*,[^;]+;",
                          r"lv_obj_set_size(\1, 415, 172);\n    lv_obj_align(\1, LV_ALIGN_RIGHT_MID, 0, 0);",
                          s,
                          flags=re.IGNORECASE
                      )

                      # 3. Delete relative alignment linking textarea to keyboard
                      s = re.sub(
                          r"lv_obj_align_to\s*\(\s*([^,;]*(?:ta|textarea)[^,;]*)\s*,\s*[^,;]*(?:kb|keyboard)[^,;]*\s*,[^;]+;",
                          "",
                          s,
                          flags=re.IGNORECASE
                      )

                      # 4. Turn off password masking so characters are readable
                      s = re.sub(r"lv_textarea_set_password_mode\s*\(\s*([^,]+)\s*,\s*true\s*\);", r"lv_textarea_set_password_mode(\1, false);", s)

                      # 5. Prevent 320px containers from constraining width
                      s = re.sub(
                          r"lv_obj_set_size\s*\(\s*([^,;]*(?:cont|container|box|modal|dialog)[^,;]*)\s*,\s*320\s*,\s*172\s*\);",
                          r"lv_obj_set_size(\1, 210, 172);\n    lv_obj_align(\1, LV_ALIGN_LEFT_MID, 0, 0);",
                          s,
                          flags=re.IGNORECASE
                      )

                      # 6. Clamp list/settings buttons to 32px height
                      def patch_list_btn(m):
                          var = m.group(1).strip()
                          return (
                              f"{m.group(0)}\n"
                              f"    if ({var}) {{\n"
                              f"        lv_obj_set_height({var}, 32);\n"
                              f"        lv_obj_set_style_pad_ver({var}, 2, 0);\n"
                              f"        lv_obj_set_style_pad_hor({var}, 8, 0);\n"
                              f"        lv_obj_set_style_text_font({var}, &lv_font_montserrat_12, 0);\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"(?:lv_obj_t\s*\*\s*)?([a-zA-Z0-9_>.-]+)\s*=\s*lv_list_add_btn\s*\([^;]+\);",
                          patch_list_btn,
                          s
                      )

                      if s != orig:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(s)
                          print("Refactored layout in:", p)
          '

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32

          echo "CONFIG_LV_FONT_MONTSERRAT_10=y" >> sdkconfig.defaults
          echo "CONFIG_LV_FONT_MONTSERRAT_12=y" >> sdkconfig.defaults

          OVERLAY=$(find devices/ -type f -name "*349*" | head -n 1)
          DEFAULTS="sdkconfig.defaults"
          [ -f "devices/sdkconfig.muse" ] && DEFAULTS="$DEFAULTS;devices/sdkconfig.muse"
          [ -n "$OVERLAY" ] && DEFAULTS="$DEFAULTS;$OVERLAY"

          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS="$DEFAULTS" build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: muse-waveshare-v2-binaries
          path: |
            esp32/build-waveshare/**/*.bin
            esp32/build-waveshare/**/flasher_args.json
