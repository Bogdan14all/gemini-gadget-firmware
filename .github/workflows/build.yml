
name: Build Waveshare V2 Gemini Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Display Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Waveshare V2 Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14

      - name: Install Project Libraries
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino/libraries" ]; then
            cp -r Arduino/libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@9.1.0 || true
          arduino-cli lib install "ArduinoJson"@6.21.4

      - name: Locate and Compile Display/LVGL Demo
        run: |
          SKETCH_PATH=$(find Arduino -type f -name "*.ino" | grep -Ei "10_LVGL|lcd|display|demo" | head -n 1)
          echo "Compilare sketch identificat: $SKETCH_PATH"

          # FQBN standard fara PartitionScheme explicit (foloseste automat schema default interna a placii)
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi"
          echo "Utilizare FQBN: $FQBN"

          arduino-cli compile --fqbn "$FQBN" \
            --output-dir build_output \
            "$SKETCH_PATH"

      - name: Package Firmware Binaries
        run: |
          mkdir -p package_bin
          cp build_output/*.bin package_bin/ 2>/dev/null || true
          cp build_output/*.bootloader.bin package_bin/bootloader.bin 2>/dev/null || true
          cp build_output/*.partitions.bin package_bin/partitions.bin 2>/dev/null || true

          cat << 'EOF' > package_bin/flasher_args.json
          {
              "write_flash_args" : [ "--flash-mode", "dio",
                                     "--flash-size", "16MB",
                                     "--flash-freq", "80m" ],
              "flash_settings" : {
                  "flash_mode": "dio",
                  "flash_size": "16MB",
                  "flash_freq": "80m"
              },
              "flash_files" : {
                  "0x0" : "bootloader.bin",
                  "0x8000" : "partitions.bin"
              }
          }
          EOF

      - name: Upload Clean Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare-v2-gemini
          path: package_bin/
          if-no-files-found: error
