name: Build Gemini OS - The Complete UI Experience

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Ultimate Gemini OS (Tabs, Settings, AI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare Official Base
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool & Arduino CLI
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Dependencies & Configure LVGL for OS Features
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          arduino-cli lib install "lvgl"@8.3.11
          arduino-cli lib install "WebSockets"@2.5.2
          arduino-cli lib install "ArduinoJson"@7.0.4

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_COLOR_16_SWAP 1
          #define LV_MEM_CUSTOM 0
          #define LV_MEM_SIZE (128U * 1024U)
          #define LV_TICK_CUSTOM 0
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_14
          #define LV_USE_KEYBOARD 1
          #define LV_USE_TEXTAREA 1
          #define LV_USE_TABVIEW 1
          #define LV_USE_SLIDER 1
          #define LV_USE_BAR 1
          #define LV_USE_LIST 1
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h

      - name: Prepare Workspace & Extract I2C Init
        shell: bash
        run: |
          rm -rf sketch
          cp -r Examples/Arduino/08_Audio_Test sketch
          cd sketch
          rm -f 08_Audio_Test.ino
          
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include "demos/lv_demos.h"|//|g' {} + || true
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|lv_demo_widgets();|//|g' {} + || true

          grep -hoE '(bsp_i2c_init|i2c_master_init|i2c_master_Init)\s*\(' *.h *.c | head -n 1 | sed 's/(//' | tr -d ' ' > i2c_func.txt || echo "bsp_i2c_init" > i2c_func.txt

      - name: Create secrets.h
        shell: bash
        run: |
          echo "#pragma once" > sketch/secrets.h
          echo "#define SECRET_GEMINI_API_KEY \"${{ secrets.GEMINI_API_KEY }}\"" >> sketch/secrets.h
          echo "#define SECRET_WIFI_SSID \"${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}\"" >> sketch/secrets.h
          echo "#define SECRET_WIFI_PASS \"${{ secrets.WIFI_PASSWORD || 'revelion' }}\"" >> sketch/secrets.h

      - name: Write Unified OS Sketch (Tabview Architecture)
        shell: bash
        run: |
          I2C_FUNC=$(cat sketch/i2c_func.txt)
          cat << 'PYEOF' > generator.py
          import sys
          i2c_init = sys.argv[1]
          code = f"""
          #include <Arduino.h>
          #include <WiFi.h>
          #include <time.h>
          #include <WebSocketsClient.h>
          #include <ArduinoJson.h>
          #include <base64.h>
          #include "secrets.h"

          extern "C" {{
          #include "lvgl_port.h"
          #include "i2c_bsp.h"
          #include "src/codec_board/codec_board.h"
          #include "src/codec_board/codec_init.h"
          #include "src/tca9554/esp_io_expander_tca9554.h"
          }}
          #include <lvgl.h>

          #define BOOT_BTN 0

          esp_codec_dev_handle_t playback = NULL;
          esp_codec_dev_handle_t record = NULL;
          esp_io_expander_handle_t io_expander = NULL;
          WebSocketsClient ws;

          // OS State Variables
          volatile bool is_recording = false;
          bool ws_ready = false;
          int g_mic_peak = 0;
          static int16_t buf_in_stereo[1024];
          static int16_t buf_mono_16k[341];

          // UI Pointers
          lv_obj_t *tv_main;
          lv_obj_t *ta_chat_out;
          lv_obj_t *ta_chat_in;
          lv_obj_t *kb_main;
          lv_obj_t *lbl_sys_info;
          lv_obj_t *slider_vol;

          void hw_init() {{
              {i2c_init}();
              delay(50);
              
              i2c_master_bus_handle_t bus;
              i2c_master_get_bus_handle(0, &bus);
              esp_io_expander_new_i2c_tca9554(bus, ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander);
              esp_io_expander_set_dir(io_expander, IO_EXPANDER_PIN_NUM_7, IO_EXPANDER_OUTPUT);
              esp_io_expander_set_level(io_expander, IO_EXPANDER_PIN_NUM_7, 1);

              set_codec_board_type((char*)"S3_LCD_3_49");
              codec_init_cfg_t cfg = {{
                  .in_mode = CODEC_I2S_MODE_TDM,
                  .out_mode = CODEC_I2S_MODE_TDM,
                  .in_use_tdm = false,
                  .reuse_dev = false,
              }};
              init_codec(&cfg);
              playback = get_playback_handle();
              record   = get_record_handle();
              
              esp_codec_dev_set_out_vol(playback, 80.0);
              esp_codec_dev_set_in_gain(record, 40.0);
              esp_codec_dev_sample_info_t fs = {{ .bits_per_sample = 16, .channel = 2, .sample_rate = 24000 }};
              esp_codec_dev_open(playback, &fs);
              esp_codec_dev_open(record, &fs);

              lvgl_port_init();
          }}

          static void kb_event_cb(lv_event_t * e) {{
              if(lv_event_get_code(e) == LV_EVENT_READY) {{
                  const char* txt = lv_textarea_get_text(ta_chat_in);
                  if (strlen(txt) > 0) {{
                      // Trimitere via WS
                      if (ws_ready) {{
                          JsonDocument doc;
                          doc["clientContent"]["turns"][0]["role"] = "user";
                          doc["clientContent"]["turns"][0]["parts"][0]["text"] = txt;
                          doc["clientContent"]["turnComplete"] = true;
                          String out; serializeJson(doc, out);
                          ws.sendTXT(out);
                      }}
                      // Adaugare la istoric chat
                      lv_textarea_add_text(ta_chat_out, "Eu: ");
                      lv_textarea_add_text(ta_chat_out, txt);
                      lv_textarea_add_text(ta_chat_out, "\\n");
                      lv_textarea_set_text(ta_chat_in, ""); // clear
                  }}
              }}
          }}

          static void vol_slider_cb(lv_event_t * e) {{
              lv_obj_t * slider = lv_event_get_target(e);
              int vol = lv_slider_get_value(slider);
              esp_codec_dev_set_out_vol(playback, (float)vol);
          }}

          void os_ui_build() {{
              example_lvgl_lock(1000);
              
              // 1. Baza Sistemului de Ferestre (Tabview stanga, Latime Tab: 100px)
              tv_main = lv_tabview_create(lv_scr_act(), LV_DIR_LEFT, 100);
              lv_obj_set_style_bg_color(tv_main, lv_color_hex(0x0F172A), 0);
              
              lv_obj_t * tab_chat = lv_tabview_add_tab(tv_main, "Chat AI");
              lv_obj_t * tab_set  = lv_tabview_add_tab(tv_main, "Setari");
              lv_obj_t * tab_sys  = lv_tabview_add_tab(tv_main, "Sistem");

              // --- TAB 1: Chat AI (W:540 x H:172) ---
              // Output History (Stanga Sus) - Nu se suprapune cu nimic
              ta_chat_out = lv_textarea_create(tab_chat);
              lv_obj_set_size(ta_chat_out, 200, 100);
              lv_obj_set_pos(ta_chat_out, 0, 0);
              lv_textarea_set_text(ta_chat_out, "Gemini OS conectat.\\nTine BOOT pt voce.\\n");
              
              // Input Area (Stanga Jos) - Sub istoric
              ta_chat_in = lv_textarea_create(tab_chat);
              lv_obj_set_size(ta_chat_in, 200, 50);
              lv_obj_set_pos(ta_chat_in, 0, 110);
              lv_textarea_set_placeholder_text(ta_chat_in, "Scrie mesaj...");
              
              // Tastatura (Dreapta, W:320px) - Langa text box, niciun overlapping!
              kb_main = lv_keyboard_create(tab_chat);
              lv_obj_set_size(kb_main, 320, 160);
              lv_obj_set_pos(kb_main, 210, 0);
              lv_keyboard_set_textarea(kb_main, ta_chat_in);
              lv_obj_add_event_cb(kb_main, kb_event_cb, LV_EVENT_ALL, NULL);

              // --- TAB 2: Setari ---
              lv_obj_t * lbl_vol = lv_label_create(tab_set);
              lv_label_set_text(lbl_vol, "Volum Difuzor I2S:");
              lv_obj_set_pos(lbl_vol, 10, 10);
              
              slider_vol = lv_slider_create(tab_set);
              lv_obj_set_size(slider_vol, 200, 20);
              lv_obj_set_pos(slider_vol, 10, 40);
              lv_slider_set_range(slider_vol, 0, 100);
              lv_slider_set_value(slider_vol, 80, LV_ANIM_OFF);
              lv_obj_add_event_cb(slider_vol, vol_slider_cb, LV_EVENT_VALUE_CHANGED, NULL);

              // --- TAB 3: Sistem ---
              lbl_sys_info = lv_label_create(tab_sys);
              lv_obj_set_pos(lbl_sys_info, 10, 10);
              lv_label_set_text(lbl_sys_info, "Calculare resurse...");

              example_lvgl_unlock();
          }}

          void wsEvent(WStype_t type, uint8_t* payload, size_t len) {{
              if (type == WStype_CONNECTED) {{
                  JsonDocument doc;
                  doc["setup"]["model"] = "models/gemini-2.0-flash-exp";
                  String out; serializeJson(doc, out);
                  ws.sendTXT(out);
              }} else if (type == WStype_TEXT) {{
                  JsonDocument doc;
                  if (!deserializeJson(doc, payload, len)) {{
                      if (doc["setupComplete"].is<JsonObject>()) ws_ready = true;
                      
                      const char* txt = doc["serverContent"]["modelTurn"]["parts"][0]["text"];
                      if(txt) {{
                          example_lvgl_lock(100);
                          lv_textarea_add_text(ta_chat_out, "AI: ");
                          lv_textarea_add_text(ta_chat_out, txt);
                          lv_textarea_add_text(ta_chat_out, "\\n");
                          example_lvgl_unlock();
                      }}
                  }}
              }}
          }}

          void setup() {{
              Serial.begin(115200);
              pinMode(BOOT_BTN, INPUT_PULLUP);
              
              hw_init();
              os_ui_build();

              WiFi.mode(WIFI_STA);
              WiFi.begin(SECRET_WIFI_SSID, SECRET_WIFI_PASS);
              configTzTime("EET-2EEST,M3.5.0/3,M10.5.0/4", "pool.ntp.org", "time.google.com");
              
              String path = "/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + String(SECRET_GEMINI_API_KEY);
              ws.beginSSL("generativelanguage.googleapis.com", 443, path.c_str());
              ws.onEvent(wsEvent);
          }}

          void loop() {{
              ws.loop();

              // UI Info Updater Task (1 HZ)
              static unsigned long last_ui = 0;
              if (millis() - last_ui > 1000) {{
                  last_ui = millis();
                  example_lvgl_lock(100);
                  
                  struct tm ti;
                  char time_str[16] = "--:--";
                  if (getLocalTime(&ti, 10)) strftime(time_str, sizeof(time_str), "%H:%M", &ti);
                  
                  char info[256];
                  snprintf(info, sizeof(info), "Ceas: %s\\nWiFi: %s\\nIP: %s\\nRAM Liber: %d KB\\nStare WS: %s",
                           time_str,
                           (WiFi.status() == WL_CONNECTED) ? "Conectat" : "Deconectat",
                           WiFi.localIP().toString().c_str(),
                           esp_get_free_heap_size() / 1024,
                           ws_ready ? "ONLINE" : "Asteptare");
                  
                  if(lbl_sys_info) lv_label_set_text(lbl_sys_info, info);
                  example_lvgl_unlock();
              }}

              // PTT (Push to Talk) via Hardware BOOT Button
              bool hw_boot = (digitalRead(BOOT_BTN) == LOW);
              if (hw_boot && !is_recording) {{
                  is_recording = true;
              }} else if (!hw_boot && is_recording) {{
                  is_recording = false;
                  if (ws_ready) ws.sendTXT("{{\\"clientContent\\": {{\\"turnComplete\\": true}}}}");
              }}

              if (is_recording && ws_ready) {{
                  if (esp_codec_dev_read(record, buf_in_stereo, sizeof(buf_in_stereo)) == ESP_OK) {{
                      int frames = (sizeof(buf_in_stereo)/sizeof(int16_t)) / 2;
                      int out_count = frames * 2 / 3;
                      for (int i = 0; i < out_count; i++) buf_mono_16k[i] = buf_in_stereo[((i * 3) / 2) * 2];

                      String b64_str = base64::encode((uint8_t*)buf_mono_16k, out_count * sizeof(int16_t));
                      if (b64_str.length() > 0) {{
                          JsonDocument doc;
                          doc["realtimeInput"]["mediaChunks"][0]["mimeType"] = "audio/pcm;rate=16000";
                          doc["realtimeInput"]["mediaChunks"][0]["data"] = b64_str;
                          String out; serializeJson(doc, out);
                          ws.sendTXT(out);
                      }}
                  }}
              }}

              delay(10);
          }}
          """
          with open("sketch/sketch.ino", "w", encoding="utf-8") as f:
              f.write(code.lstrip())
          PYEOF
          python3 generator.py "$I2C_FUNC"

      - name: Compile Firmware
        run: |
          SKETCH_PATH="sketch/sketch.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge Partitions
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-os-complete.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-complete
          path: package_bin/gemini-os-complete.bin
          if-no-files-found: error
