name: Build Gemini OS - v65 Working REST AI Assistant

on:
  workflow_dispatch:

jobs:
  build:
    name: Build v65
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare ESP32-S3-Touch-LCD-3.49
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Libraries (LVGL 8.3.11 & ArduinoJson 7)
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino_Libraries" ]; then
            cp -r Arduino_Libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@8.3.11
          arduino-cli lib install "ArduinoJson"@7.0.4

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H

          #define LV_COLOR_DEPTH 16
          #define LV_COLOR_16_SWAP 1
          #define LV_MEM_CUSTOM 0
          #define LV_MEM_SIZE (128U * 1024U)

          #define LV_TICK_CUSTOM 0

          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_MONTSERRAT_28 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20

          #define LV_USE_TEXTAREA 1
          #define LV_USE_KEYBOARD 1
          #define LV_USE_BAR 1
          #define LV_USE_LABEL 1
          #define LV_USE_BTN 1

          #define LV_USE_DEMO_WIDGETS 0
          #define LV_USE_DEMO_MUSIC 0
          #define LV_USE_DEMO_BENCHMARK 0
          #define LV_USE_DEMO_STRESS 0

          #define LV_USE_LOG 0
          #define LV_USE_ASSERT_NULL 0
          #define LV_USE_ASSERT_MALLOC 0
          #define LV_USE_ASSERT_STYLE 0
          #define LV_USE_ASSERT_MEM_INTEGRITY 0
          #define LV_USE_ASSERT_OBJ 0

          #endif
          EOF
          sed -i 's/^[ 	]*//' ~/Arduino/libraries/lv_conf.h

      - name: Inject Working Gemini OS v65 REST AI Sketch
        shell: bash
        run: |
          SKETCH_PATH="Examples/Arduino/08_Audio_Test/08_Audio_Test.ino"
          cat << 'SKETCH_EOF' > "$SKETCH_PATH"
#include <Arduino.h>
#include <WiFi.h>
#include <HTTPClient.h>
#include <WiFiClientSecure.h>
#include <ArduinoJson.h>
#include <driver/i2s_std.h>
#include <driver/i2c_master.h>

extern "C" {
#include "i2c_bsp.h"
#include "lvgl_port.h"
}
#include <lvgl.h>

#define LCD_BL    42
#define BOOT_BTN  0
#define PWR_BTN   16

const char* wifi_ssid = "WIFI_NAME_HERE";
const char* wifi_pass = "WIFI_PASS_HERE";
const char* user_key  = "PASTE_KEY_HERE";

lv_obj_t *lbl_title      = NULL;
lv_obj_t *lbl_status     = NULL;
lv_obj_t *txt_response   = NULL;
lv_obj_t *btn_talk       = NULL;
lv_obj_t *lbl_btn_talk   = NULL;

char g_status_msg[64] = "Pregatit - Apasa TRIMITE";
char g_response_text[1024] = "Aici va aparea raspunsul de la Gemini...";

static void ui_update_cb(void *arg) {
    if (lbl_status) lv_label_set_text(lbl_status, g_status_msg);
    if (txt_response) lv_textarea_set_text(txt_response, g_response_text);
}

void query_gemini_rest() {
    snprintf(g_status_msg, sizeof(g_status_msg), "Trimit cerere...");
    lv_async_call(ui_update_cb, NULL);

    WiFiClientSecure client;
    client.setInsecure();

    HTTPClient http;
    String host = "generativelanguage.googleapis.com";
    String path = "/v1beta/models/gemini-2.0-flash:generateContent?key=";
    String url  = "https://" + host + path + user_key;

    if (http.begin(client, url)) {
        http.addHeader("Content-Type", "application/json");

        String body = "{\"contents\":[{\"parts\":[{\"text\":\"Salut! Spune un mesaj scurt de 2 propozitii pentru un asistent ESP32.\"}]}]}";

        int code = http.POST(body);
        if (code == HTTP_CODE_OK) {
            String payload = http.getString();
            JsonDocument doc;
            DeserializationError err = deserializeJson(doc, payload);
            if (!err) {
                const char* text = doc["candidates"][0]["content"]["parts"][0]["text"];
                if (text) {
                    snprintf(g_response_text, sizeof(g_response_text), "%s", text);
                    snprintf(g_status_msg, sizeof(g_status_msg), "Raspuns primit!");
                }
            } else {
                snprintf(g_status_msg, sizeof(g_status_msg), "Eroare parse JSON");
            }
        } else {
            snprintf(g_status_msg, sizeof(g_status_msg), "HTTP Error: %d", code);
        }
        http.end();
    } else {
        snprintf(g_status_msg, sizeof(g_status_msg), "Conexiune esuata");
    }
    lv_async_call(ui_update_cb, NULL);
}

static void btn_talk_cb(lv_event_t *e) {
    lv_event_code_t code = lv_event_get_code(e);
    if (code == LV_EVENT_CLICKED) {
        query_gemini_rest();
    }
}

void build_ui() {
    pinMode(LCD_BL, OUTPUT);
    digitalWrite(LCD_BL, LOW);

    lvgl_port_lock(1000);
    lv_obj_t *scr = lv_scr_act();
    lv_obj_clean(scr);
    lv_obj_set_style_bg_color(scr, lv_color_hex(0x0F172A), 0);

    lbl_title = lv_label_create(scr);
    lv_label_set_text(lbl_title, "Gemini OS AI");
    lv_obj_set_style_text_color(lbl_title, lv_color_hex(0x38BDF8), 0);
    lv_obj_set_style_text_font(lbl_title, &lv_font_montserrat_20, 0);
    lv_obj_align(lbl_title, LV_ALIGN_TOP_MID, 0, 10);

    lbl_status = lv_label_create(scr);
    lv_label_set_text(lbl_status, g_status_msg);
    lv_obj_set_style_text_color(lbl_status, lv_color_hex(0x94A3B8), 0);
    lv_obj_set_style_text_font(lbl_status, &lv_font_montserrat_14, 0);
    lv_obj_align(lbl_status, LV_ALIGN_TOP_MID, 0, 40);

    txt_response = lv_textarea_create(scr);
    lv_obj_set_size(txt_response, 155, 420);
    lv_obj_align(txt_response, LV_ALIGN_TOP_MID, 0, 70);
    lv_textarea_set_text(txt_response, g_response_text);
    lv_obj_set_style_bg_color(txt_response, lv_color_hex(0x1E293B), 0);
    lv_obj_set_style_text_color(txt_response, lv_color_hex(0xFFFFFF), 0);
    lv_obj_set_style_text_font(txt_response, &lv_font_montserrat_14, 0);

    btn_talk = lv_btn_create(scr);
    lv_obj_set_size(btn_talk, 140, 50);
    lv_obj_align(btn_talk, LV_ALIGN_BOTTOM_MID, 0, -20);
    lv_obj_set_style_bg_color(btn_talk, lv_color_hex(0x0284C7), 0);
    lv_obj_add_event_cb(btn_talk, btn_talk_cb, LV_EVENT_CLICKED, NULL);

    lbl_btn_talk = lv_label_create(btn_talk);
    lv_label_set_text(lbl_btn_talk, "TRIMITE");
    lv_obj_set_style_text_font(lbl_btn_talk, &lv_font_montserrat_16, 0);
    lv_obj_center(lbl_btn_talk);

    lvgl_port_unlock();
}

void setup() {
    Serial.begin(115200);
    delay(500);
    Serial.println("\n[BOOT] Gemini OS v65 REST Client");

    pinMode(BOOT_BTN, INPUT_PULLUP);
    pinMode(PWR_BTN, INPUT_PULLUP);

    bsp_i2c_init();
    delay(50);
    lvgl_port_init();
    delay(300);
    build_ui();

    WiFi.mode(WIFI_STA);
    WiFi.begin(wifi_ssid, wifi_pass);
}

void loop() {
    static unsigned long last_wifi = 0;
    if (millis() - last_wifi > 2000) {
        last_wifi = millis();
        if (WiFi.status() == WL_CONNECTED) {
            snprintf(g_status_msg, sizeof(g_status_msg), "Wi-Fi Conectat!");
        } else {
            snprintf(g_status_msg, sizeof(g_status_msg), "Conectare Wi-Fi...");
        }
        lv_async_call(ui_update_cb, NULL);
    }
    vTaskDelay(pdMS_TO_TICKS(50));
}

SKETCH_EOF

      - name: Compile Gemini OS v65 REST AI Client
        run: |
          SKETCH_PATH="Examples/Arduino/08_Audio_Test/08_Audio_Test.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge into Single .bin
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-v65-rest-ai-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/gemini-v65-rest-ai-0x0.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-v65-rest-ai
          path: package_bin/gemini-v65-rest-ai-0x0.bin
          if-no-files-found: error
