name: Build Meta Muse Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Deep Patch UI Scale & Keyboard
        shell: bash
        run: |
          python3 -c '
          import os, re
          for root, _, files in os.walk("esp32"):
              for file in files:
                  if file.endswith((".c", ".cpp", ".h")):
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8") as f: s = f.read()
                          # Reduce DPI by ~30% for buttons and padding
                          s = re.sub(r"#define LV_DPI_DEF\s+\d+", "#define LV_DPI_DEF 90", s)
                          # Catch any keyboard assignment and force height to 85px
                          s = re.sub(
                              r"([a-zA-Z0-9_>.-]+)\s*=\s*lv_keyboard_create\(([^)]+)\);",
                              r"\1 = lv_keyboard_create(\2);\n    lv_obj_set_height(\1, 85);\n    lv_obj_align(\1, LV_ALIGN_BOTTOM_MID, 0, 0);",
                              s
                          )
                          with open(p, "w", encoding="utf-8") as f: f.write(s)
                      except: pass
          '

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32
          OVERLAY=$(find devices/ -type f -name "*349*" | head -n 1)
          DEFAULTS="sdkconfig.defaults"
          [ -f "devices/sdkconfig.muse" ] && DEFAULTS="$DEFAULTS;devices/sdkconfig.muse"
          [ -n "$OVERLAY" ] && DEFAULTS="$DEFAULTS;$OVERLAY"
          
          # Force smaller base fonts directly into config
          echo "CONFIG_LV_FONT_DEFAULT_MONTSERRAT_10=y" >> "$DEFAULTS"
          echo "CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=n" >> "$DEFAULTS"
          echo "CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=n" >> "$DEFAULTS"
          
          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS="$DEFAULTS" build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: muse-waveshare-v2-binaries
          path: |
            esp32/build-waveshare/**/*.bin
            esp32/build-waveshare/**/flasher_args.json
