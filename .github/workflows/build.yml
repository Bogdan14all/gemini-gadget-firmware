name: Compile ESP32-S3-Touch-LCD-3.49-V2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: "1.x"

      - name: Configure Arduino CLI for ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 core and libraries
        run: |
          # Instalează nucleul ESP32 (versiunea 3.x este recomandată pentru S3)
          arduino-cli core install esp32:esp32
          # Instalează biblioteca grafică necesară pentru display
          arduino-cli lib install "GFX Library for Arduino"

      - name: Compile sketch
        run: |
          # Compilează pentru placa specifică Waveshare ESP32-S3
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi --output-dir build ./src
