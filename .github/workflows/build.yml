name: Build Meta Muse Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Inspect Port Instructions
        shell: bash
        run: |
          echo "=== README.waveshare-s3-lcd-349.md ==="
          cat README.waveshare-s3-lcd-349.md || true
          echo "=== Available device configurations ==="
          ls -la esp32/devices/ || true

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32
          # Build target using repository defaults
          idf.py -B build-waveshare build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: muse-waveshare-v2-binaries
          path: |
            esp32/build-waveshare/**/*.bin
            esp32/build-waveshare/**/flasher_args.json
