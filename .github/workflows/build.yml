name: Build Meta Muse Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Refactor UI Layout and Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32

          # 1. Enable Montserrat 10 and 12 fonts
          for cfg in sdkconfig.defaults devices/sdkconfig.muse; do
            if [ -f "$cfg" ]; then
              echo "CONFIG_LV_FONT_MONTSERRAT_10=y" >> "$cfg"
              echo "CONFIG_LV_FONT_MONTSERRAT_12=y" >> "$cfg"
            fi
          done

          # 2. Reconfigure project dependencies
          OVERLAY=$(find devices/ -type f -name "*349*" | head -n 1)
          DEFAULTS="sdkconfig.defaults"
          [ -f "devices/sdkconfig.muse" ] && DEFAULTS="$DEFAULTS;devices/sdkconfig.muse"
          [ -n "$OVERLAY" ] && DEFAULTS="$DEFAULTS;$OVERLAY"

          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS="$DEFAULTS" reconfigure

          # 3. Patch application sources
          cat << 'EOF' > patch_ui.py
          import os, re

          print("=== Applying Retract Key, Visible Password & Layout Optimizations ===")
          patched_count = 0

          cb_code = """
static void LV_ATTRIBUTE_UNUSED _muse_kb_unhide_cb(lv_event_t * e) {
    lv_obj_t * kb = (lv_obj_t *)lv_event_get_user_data(e);
    if (kb && lv_obj_has_flag(kb, LV_OBJ_FLAG_HIDDEN)) {
        lv_obj_clear_flag(kb, LV_OBJ_FLAG_HIDDEN);
        lv_obj_move_foreground(kb);
    }
}
"""

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("managed_components", "build-waveshare", "build", ".git")]

              for file in files:
                  if not file.endswith((".c", ".cpp")):
                      continue

                  p = os.path.join(root, file)
                  try:
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          s = f.read()
                      orig = s

                      # 1. Inject unhide callback after the last include statement
                      if "lv_keyboard_set_textarea" in s and "_muse_kb_unhide_cb" not in s:
                          last_inc = s.rfind("#include")
                          if last_inc != -1:
                              end_line = s.find("\n", last_inc)
                              s = s[:end_line] + "\n" + cb_code + s[end_line:]

                      # 2. Fix Retract Key: Hide the keyboard instead of deleting parent container
                      s = re.sub(
                          r"lv_obj_del\s*\(\s*lv_obj_get_parent\s*\(\s*([^)]+)\s*\)\s*\);",
                          r"do { if(\1) { lv_obj_add_flag(\1, LV_OBJ_FLAG_HIDDEN); } } while(0);",
                          s
                      )

                      # 3. Permanently disable password asterisks across all screens
                      s = re.sub(
                          r"lv_textarea_set_password_mode\s*\(\s*([^,;]+)\s*,\s*[^)]+\s*\);",
                          r"lv_textarea_set_password_mode(\1, false);",
                          s
                      )

                      # 4. Clamp list and menu buttons to 32px height
                      def patch_list_btn(m):
                          v = m.group(1).strip()
                          return (
                              f"{m.group(0)}\n"
                              f"    if ({v}) {{\n"
                              f"        lv_obj_set_height({v}, 32);\n"
                              f"        lv_obj_set_style_pad_ver({v}, 2, 0);\n"
                              f"        lv_obj_set_style_pad_hor({v}, 8, 0);\n"
                              f"        lv_obj_set_style_text_font({v}, &lv_font_montserrat_12, 0);\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"(?:lv_obj_t\s*\*\s*)?([a-zA-Z0-9_>.-]+)\s*=\s*lv_list_add_btn\s*\([^;]+\);",
                          patch_list_btn,
                          s
                      )

                      # 5. Compress padding and row gaps to 2px
                      s = re.sub(r"(lv_style_set_pad_(?:top|bottom|ver|all)\s*\([^,]+,\s*)(?:1[0-9]\vert{}2[0-9]\vert{}[7-9])(\s*\))", r"\g<1>2\2", s)
                      s = re.sub(r"(lv_obj_set_style_pad_(?:top|bottom|ver|all)\s*\([^,]+,\s*)(?:1[0-9]|2[0-9]|[7-9])(\s*,)", r"\g<1>2\2", s)
                      s = re.sub(r"(lv_style_set_pad_row\s*\([^,]+,\s*)(?:1[0-9]\vert{}2[0-9]\vert{}[7-9])(\s*\))", r"\g<1>2\2", s)
                      s = re.sub(r"(lv_obj_set_style_pad_row\s*\([^,]+,\s*)(?:1[0-9]|2[0-9]|[7-9])(\s*,)", r"\g<1>2\2", s)
                      s = re.sub(r"&lv_font_montserrat_(?:14|16|18|20|22|24|28)", r"&lv_font_montserrat_12", s)

                      # 6. Reparent & align: 205x140 left (Text Area), 415x172 right (Keyboard)
                      def patch_kb_ta(m):
                          kb = m.group(1).strip()
                          ta = m.group(2).strip()
                          return (
                              f"lv_keyboard_set_textarea({kb}, {ta});\n"
                              f"    if ({kb}) {{\n"
                              f"        lv_obj_set_parent({kb}, lv_scr_act());\n"
                              f"        lv_obj_set_size({kb}, 415, 172);\n"
                              f"        lv_obj_align({kb}, LV_ALIGN_RIGHT_MID, 0, 0);\n"
                              f"        lv_obj_set_style_pad_all({kb}, 1, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_row({kb}, 1, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_column({kb}, 1, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_all({kb}, 2, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_pad_row({kb}, 1, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_pad_column({kb}, 1, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_text_font({kb}, &lv_font_montserrat_12, LV_PART_ITEMS);\n"
                              f"        lv_obj_move_foreground({kb});\n"
                              f"    }}\n"
                              f"    if ({ta}) {{\n"
                              f"        lv_obj_set_parent({ta}, lv_scr_act());\n"
                              f"        lv_obj_set_size({ta}, 205, 140);\n"
                              f"        lv_obj_align({ta}, LV_ALIGN_LEFT_MID, 10, 0);\n"
                              f"        lv_obj_set_style_pad_all({ta}, 4, 0);\n"
                              f"        lv_obj_set_style_text_font({ta}, &lv_font_montserrat_12, 0);\n"
                              f"        lv_textarea_set_password_mode({ta}, false);\n"
                              f"        lv_textarea_set_one_line({ta}, false);\n"
                              f"        lv_obj_add_event_cb({ta}, _muse_kb_unhide_cb, LV_EVENT_CLICKED, {kb});\n"
                              f"        lv_obj_move_foreground({ta});\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"lv_keyboard_set_textarea\s*\(\s*([a-zA-Z0-9_>.-]+)\s*,\s*([a-zA-Z0-9_>.-]+)\s*\);",
                          patch_kb_ta,
                          s
                      )

                      # 7. Standalone Text Area initialization
                      def patch_ta_create(m):
                          var = m.group(1).strip()
                          return (
                              f"{m.group(0)}\n"
                              f"    if ({var}) {{\n"
                              f"        lv_obj_set_parent({var}, lv_scr_act());\n"
                              f"        lv_obj_set_size({var}, 205, 140);\n"
                              f"        lv_obj_align({var}, LV_ALIGN_LEFT_MID, 10, 0);\n"
                              f"        lv_obj_set_style_pad_all({var}, 4, 0);\n"
                              f"        lv_obj_set_style_text_font({var}, &lv_font_montserrat_12, 0);\n"
                              f"        lv_textarea_set_password_mode({var}, false);\n"
                              f"        lv_textarea_set_one_line({var}, false);\n"
                              f"        lv_obj_move_foreground({var});\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"(?:lv_obj_t\s*\*\s*)?([a-zA-Z0-9_>.-]+)\s*=\s*lv_textarea_create\s*\([^;]+\);",
                          patch_ta_create,
                          s
                      )

                      # 8. Standalone Keyboard initialization
                      def patch_kb_create(m):
                          var = m.group(1).strip()
                          return (
                              f"{m.group(0)}\n"
                              f"    if ({var}) {{\n"
                              f"        lv_obj_set_parent({var}, lv_scr_act());\n"
                              f"        lv_obj_set_size({var}, 415, 172);\n"
                              f"        lv_obj_align({var}, LV_ALIGN_RIGHT_MID, 0, 0);\n"
                              f"        lv_obj_set_style_pad_all({var}, 1, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_row({var}, 1, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_column({var}, 1, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_all({var}, 2, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_pad_row({var}, 1, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_pad_column({var}, 1, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_text_font({var}, &lv_font_montserrat_12, LV_PART_ITEMS);\n"
                              f"        lv_obj_move_foreground({var});\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"(?:lv_obj_t\s*\*\s*)?([a-zA-Z0-9_>.-]+)\s*=\s*lv_keyboard_create\s*\([^;]+\);",
                          patch_kb_create,
                          s
                      )

                      # 9. Override conflicting size and alignment calls
                      s = re.sub(
                          r"lv_obj_set_size\s*\(\s*([^,;]*(?:kb|keyboard)[^,;]*)\s*,[^;]+;",
                          r"lv_obj_set_size(\1, 415, 172);\n    lv_obj_align(\1, LV_ALIGN_RIGHT_MID, 0, 0);",
                          s,
                          flags=re.IGNORECASE
                      )
                      s = re.sub(
                          r"lv_obj_set_height\s*\(\s*([^,;]*(?:kb|keyboard)[^,;]*)\s*,[^;]+;",
                          r"lv_obj_set_size(\1, 415, 172);\n    lv_obj_align(\1, LV_ALIGN_RIGHT_MID, 0, 0);",
                          s,
                          flags=re.IGNORECASE
                      )
                      s = re.sub(
                          r"lv_obj_align_to\s*\(\s*([^,;]*(?:ta|textarea)[^,;]*)\s*,\s*[^,;]*(?:kb|keyboard)[^,;]*\s*,[^;]+;",
                          "",
                          s,
                          flags=re.IGNORECASE
                      )

                      if s != orig:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(s)
                          print(f"Patched: {p}")
                          patched_count += 1
                  except Exception:
                      pass

          print(f"=== Complete. Total files patched: {patched_count} ===")
          EOF

          python3 patch_ui.py

          # 4. Build final binaries
          idf.py -B build-waveshare -DIDF_TARGET
