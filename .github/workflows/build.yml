name: Setup Clean Gemini Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    name: Import Eatin, Purge iFlytek and Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout User Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Clean Source, Optimized Side-by-Side UI &amp; Gemini Engine
        shell: bash
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'revelion' }}
        run: |
          rm -rf esp32 temp_upstream
          echo "Clonare structura curata Waveshare 3.49..."
          git clone --depth 1 --recursive https://github.com/Eatin/muse-gadget-waveshare-349.git temp_upstream
          cp -a temp_upstream/* .
          rm -rf temp_upstream

          mkdir -p esp32/components/muse/src

          find esp32/ -name "led_status.c" -exec sed -i 's/#error.*SPI flash pin.*/\/\/ bypassed SPI flash pin/' {} + 2&gt;/dev/null || true

          # 1. Rescrierea completa si determinista a tastaturii in muse_keypad.c:
          # Pe ecranul de 640x172 px (lat dar foarte scund), asezarea stanga-dreapta (Side-by-Side)
          # garanteaza ca input box-ul NU este acoperit si are inaltime generoasa pentru text si cursor.
          # Stanga: Casuta de text 215 x 164 px (X=6, Y=4)
          # Dreapta: Tastatura completa 405 x 164 px (X=227, Y=4)
          cat &lt;&lt; 'EOF' &gt; esp32/components/muse/src/muse_keypad.c
          #include "muse_keypad.h"
          #include "esp_log.h"
          #include
