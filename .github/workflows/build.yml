name: Build Gemini OS - v31 Gemini Live (REST/WS Fix)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build v31 Gemini Live
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare ESP32-S3-Touch-LCD-3.49
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries (LVGL 8.3.11 + WebSockets + ArduinoJson)
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino_Libraries" ]; then
            cp -r Arduino_Libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@8.3.11
          arduino-cli lib install "WebSockets"@2.5.2
          arduino-cli lib install "ArduinoJson"@7.0.4

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_COLOR_16_SWAP 1
          #define LV_MEM_CUSTOM 0
          #define LV_MEM_SIZE (128U * 1024U)
          #define LV_TICK_CUSTOM 0
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_MONTSERRAT_28 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20
          #define LV_USE_DEMO_WIDGETS 0
          #define LV_USE_DEMO_MUSIC 0
          #define LV_USE_DEMO_BENCHMARK 0
          #define LV_USE_DEMO_STRESS 0
          #define LV_USE_LOG 0
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h

      - name: Copy 08_Audio_Test as base & Patch
        shell: bash
        run: |
          rm -rf sketch
          cp -r Examples/Arduino/08_Audio_Test sketch
          cd sketch
          
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include "demos/lv_demos.h"|// #include "demos/lv_demos.h"|g' {} + 2>/dev/null || true
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|lv_demo_widgets();|// lv_demo_widgets();|g' {} + 2>/dev/null || true
          rm -f 08_Audio_Test.ino

          python3 - << 'PYEOF'
          import re, os, glob

          sketch_dir = "."
          port_path = f"{sketch_dir}/lvgl_port.c"
          h_path = f"{sketch_dir}/lvgl_port.h"

          with open(h_path, "r", encoding="utf-8", errors="ignore") as f:
              h_content = f.read()
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              c_content = f.read()

          if "lvgl_port_lock" not in h_content:
              if "example_lvgl_lock" in c_content:
                  c_content += """
          bool lvgl_port_lock(uint32_t timeout_ms) { return example_lvgl_lock(timeout_ms); }
          void lvgl_port_unlock(void) { example_lvgl_unlock(); }
          """
              else:
                  mux_var = "lvgl_port_mux"
                  c_content = re.sub(
                      r'(#include[^\n]+\n)(?![^\n]*#include)',
                      r'\1\nstatic SemaphoreHandle_t ' + mux_var + ' = NULL;\n',
                      c_content, count=1, flags=re.DOTALL)
                  c_content = re.sub(
                      r'(esp_err_t\s+lvgl_port_init\s*\([^)]*\)\s*\{)',
                      r'\1\n    ' + mux_var + ' = xSemaphoreCreateMutex();',
                      c_content, count=1)
                  c_content += f"""
          bool lvgl_port_lock(uint32_t timeout_ms) {{
              if ({mux_var} == NULL) return false;
              return xSemaphoreTake({mux_var}, pdMS_TO_TICKS(timeout_ms)) == pdTRUE;
          }}
          void lvgl_port_unlock(void) {{
              if ({mux_var} != NULL) xSemaphoreGive({mux_var});
          }}
          """
              h_content += """
          #ifdef __cplusplus
          extern "C" {
          #endif
          bool lvgl_port_lock(uint32_t timeout_ms);
          void lvgl_port_unlock(void);
          #ifdef __cplusplus
          }
          #endif
          """
              with open(h_path, "w", encoding="utf-8") as f:
                  f.write(h_content)
              with open(port_path, "w", encoding="utf-8") as f:
                  f.write(c_content)

          i2c_init_func = "bsp_i2c_init"
          for hh in glob.glob(f"{sketch_dir}/*.h"):
              with open(hh, "r", encoding="utf-8", errors="ignore") as f:
                  h = f.read()
              for f_name, f_args in re.findall(r'(?:esp_err_t|void|int|bool)\s+([a-zA-Z0-9_]+)\s*\(([^)]*)\)\s*;', h):
                  if "i2c" in f_name.lower() and "init" in f_name.lower() and f_args.strip() in ("", "void"):
                      i2c_init_func = f_name
                      break

          with open("i2c_func.txt", "w") as f:
              f.write(i2c_init_func)
          PYEOF

      - name: Create secrets.h from GitHub Secrets
        shell: bash
        run: |
          echo "#pragma once" > sketch/secrets.h
          echo "#define SECRET_GEMINI_API_KEY \"${{ secrets.GEMINI_API_KEY }}\"" >> sketch/secrets.h

      - name: Write sketch.ino (FIXED JSON SETUP)
        shell: bash
        run: |
          cat << 'EOF' > sketch/sketch.ino
          #include <Arduino.h>
          #include <WiFi.h>
          #include <WebSocketsClient.h>
          #include <ArduinoJson.h>
          #include <base64.h>
          #include "mbedtls/base64.h"

          #include "secrets.h"

          extern "C" {
          #include "lvgl_port.h"
          #include "i2c_bsp.h"
          #include "src/codec_board/codec_board.h"
          #include "src/codec_board/codec_init.h"
          #include "src/tca9554/esp_io_expander_tca9554.h"
          }

          const char* WIFI_SSID = "TP-Link_2.4G_9318_Guest";
          const char* WIFI_PASS = "revelion";
          const char* GEMINI_API_KEY = SECRET_GEMINI_API_KEY;

          esp_codec_dev_handle_t playback = NULL;
          esp_codec_dev_handle_t record = NULL;
          esp_io_expander_handle_t io_expander = NULL;
          WebSocketsClient ws;

          volatile int g_state = 0; // 0=init, 1=wifi, 2=wait_setup, 3=live
          volatile int g_rx_kb = 0;
          volatile int g_tx_kb = 0;
          volatile int g_peak  = 0;

          lv_obj_t *lbl_state = NULL;
          lv_obj_t *lbl_rx    = NULL;
          lv_obj_t *lbl_tx    = NULL;
          lv_obj_t *lbl_peak  = NULL;

          static int16_t buf_in_stereo[1024];
          static int16_t buf_mono_24k[512];
          static int16_t buf_mono_16k[341];
          static int16_t buf_out_stereo[256];
          static uint8_t buf_rx_raw[16384];

          void tca9554_init_local() {
              i2c_master_bus_handle_t bus;
              ESP_ERROR_CHECK(i2c_master_get_bus_handle(0, &bus));
              esp_io_expander_new_i2c_tca9554(bus, ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander);
              esp_io_expander_set_dir(io_expander, IO_EXPANDER_PIN_NUM_7, IO_EXPANDER_OUTPUT);
              esp_io_expander_set_level(io_expander, IO_EXPANDER_PIN_NUM_7, 1);
              Serial.println("[TCA] Codec reset released");
          }

          void audio_init_local() {
              set_codec_board_type((char*)"S3_LCD_3_49");
              codec_init_cfg_t cfg = {
                  .in_mode = CODEC_I2S_MODE_TDM,
                  .out_mode = CODEC_I2S_MODE_TDM,
                  .in_use_tdm = false,
                  .reuse_dev = false,
              };
              ESP_ERROR_CHECK(init_codec(&cfg));
              playback = get_playback_handle();
              record   = get_record_handle();
              Serial.println("[AUDIO] Codec initialized");
          }

          void audio_open_local() {
              esp_codec_dev_set_out_vol(playback, 100.0);
              esp_codec_dev_set_in_gain(record, 35.0);
              esp_codec_dev_sample_info_t fs = {};
              fs.sample_rate = 24000;
              fs.channel = 2;
              fs.bits_per_sample = 16;
              esp_codec_dev_open(playback, &fs);
              esp_codec_dev_open(record, &fs);
              Serial.println("[AUDIO] Opened @24kHz stereo");
          }

          void wsEvent(WStype_t type, uint8_t* payload, size_t len) {
              switch (type) {
                  case WStype_CONNECTED: {
                      Serial.println("[WS] CONNECTED");
                      g_state = 2;
                      
                      // Delay scurt pentru a permite serverului să proceseze conexiunea SSL
                      delay(500);

                      JsonDocument doc;
                      JsonObject setupObj = doc["setup"].to<JsonObject>();
                      setupObj["model"] = "models/gemini-2.0-flash-exp";
                      
                      JsonArray respMod = setupObj["generationConfig"]["responseModalities"].to<JsonArray>();
                      respMod.add("AUDIO");
                      
                      // Simplificăm configurarea vocală pentru a evita erori de sintaxă respinse de server
                      setupObj["generationConfig"]["speechConfig"]["voiceConfig"]["prebuiltVoiceConfig"]["voiceName"] = "Puck";

                      // Adăugăm role: user la systemInstruction, altfel schema este invalidă
                      JsonObject sysInst = setupObj["systemInstruction"].to<JsonObject>();
                      sysInst["role"] = "user";
                      JsonArray parts = sysInst["parts"].to<JsonArray>();
                      JsonObject p = parts.add<JsonObject>();
                      p["text"] = "Raspunde mereu foarte scurt in limba romana, fara diacritice, doar cateva cuvinte.";

                      String out;
                      serializeJson(doc, out);
                      ws.sendTXT(out);
                      Serial.printf("[WS] Setup sent: %s\n", out.c_str());
                      break;
                  }
                  case WStype_DISCONNECTED:
                      Serial.printf("[WS] DISCONNECTED\n");
                      g_state = 1;
                      break;

                  case WStype_TEXT: {
                      if (strstr((char*)payload, "setupComplete") != NULL) {
                          Serial.println("[WS] >>> SETUP COMPLETE! Suntem LIVE! <<<");
                          g_state = 3;
                          break;
                      }

                      if (strstr((char*)payload, "\"inlineData\"") != NULL) {
                          JsonDocument rxDoc;
                          DeserializationError err = deserializeJson(rxDoc, payload, len);
                          if (!err) {
                              JsonArray parts = rxDoc["serverContent"]["modelTurn"]["parts"].as<JsonArray>();
                              for (JsonObject pt : parts) {
                                  const char* b64_data = pt["inlineData"]["data"];
                                  if (b64_data) {
                                      size_t b64_len = strlen(b64_data);
                                      size_t olen = 0;
                                      if (mbedtls_base64_decode(buf_rx_raw, sizeof(buf_rx_raw), &olen, (const unsigned char*)b64_data, b64_len) == 0 && olen > 0) {
                                          int mono_count = olen / 2;
                                          int16_t *src = (int16_t*)buf_rx_raw;
                                          for (int off = 0; off < mono_count; off += 128) {
                                              int n = mono_count - off;
                                              if (n > 128) n = 128;
                                              for (int i = 0; i < n; i++) {
                                                  buf_out_stereo[i * 2]     = src[off + i];
                                                  buf_out_stereo[i * 2 + 1] = src[off + i];
                                              }
                                              esp_codec_dev_write(playback, buf_out_stereo, n * 4);
                                          }
                                          g_rx_kb += olen / 1024;
                                      }
                                  }
                              }
                          }
                      }
                      break;
                  }
                  case WStype_ERROR:
                      Serial.printf("[WS] ERROR: %.*s\n", (int)len, payload);
                      break;

                  default:
                      break;
              }
          }

          void ui_timer_cb(lv_timer_t *t) {
              if (lbl_state) {
                  const char* s = "?";
                  switch (g_state) {
                      case 0: s = "Init"; break;
                      case 1: s = "WiFi/WS..."; break;
                      case 2: s = "Waiting Setup"; break;
                      case 3: s = "LIVE!"; break;
                  }
                  lv_label_set_text(lbl_state, s);
                  lv_obj_set_style_text_color(lbl_state,
                      g_state == 3 ? lv_color_hex(0x22C55E) : lv_color_hex(0xFFFFFF), 0);
              }
              if (lbl_rx) {
                  char b[32]; snprintf(b, sizeof(b), "RX: %d KB", g_rx_kb);
                  lv_label_set_text(lbl_rx, b);
              }
              if (lbl_tx) {
                  char b[32]; snprintf(b, sizeof(b), "TX: %d KB", g_tx_kb);
                  lv_label_set_text(lbl_tx, b);
              }
              if (lbl_peak) {
                  char b[32]; snprintf(b, sizeof(b), "Peak: %d", g_peak);
                  lv_label_set_text(lbl_peak, b);
              }
          }

          void build_ui() {
              lvgl_port_lock(1000);
              lv_obj_t *scr = lv_scr_act();
              lv_obj_clean(scr);
              lv_obj_set_style_bg_color(scr, lv_color_hex(0x0F172A), 0);
              lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, 0);

              lv_obj_t *title = lv_label_create(scr);
              lv_label_set_text(title, "Gemini Live");
              lv_obj_set_style_text_color(title, lv_color_hex(0x38BDF8), 0);
              lv_obj_set_style_text_font(title, &lv_font_montserrat_20, 0);
              lv_obj_align(title, LV_ALIGN_TOP_MID, 0, 30);

              lbl_state = lv_label_create(scr);
              lv_label_set_text(lbl_state, "Init");
              lv_obj_set_style_text_color(lbl_state, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_font(lbl_state, &lv_font_montserrat_28, 0);
              lv_obj_align(lbl_state, LV_ALIGN_CENTER, 0, -60);

              lbl_peak = lv_label_create(scr);
              lv_label_set_text(lbl_peak, "Peak: 0");
              lv_obj_set_style_text_color(lbl_peak, lv_color_hex(0x94A3B8), 0);
              lv_obj_set_style_text_font(lbl_peak, &lv_font_montserrat_16, 0);
              lv_obj_align(lbl_peak, LV_ALIGN_CENTER, 0, 0);

              lbl_rx = lv_label_create(scr);
              lv_label_set_text(lbl_rx, "RX: 0 KB");
              lv_obj_set_style_text_color(lbl_rx, lv_color_hex(0x22C55E), 0);
              lv_obj_set_style_text_font(lbl_rx, &lv_font_montserrat_14, 0);
              lv_obj_align(lbl_rx, LV_ALIGN_CENTER, 0, 50);

              lbl_tx = lv_label_create(scr);
              lv_label_set_text(lbl_tx, "TX: 0 KB");
              lv_obj_set_style_text_color(lbl_tx, lv_color_hex(0x38BDF8), 0);
              lv_obj_set_style_text_font(lbl_tx, &lv_font_montserrat_14, 0);
              lv_obj_align(lbl_tx, LV_ALIGN_CENTER, 0, 80);

              lvgl_port_unlock();
              lv_timer_create(ui_timer_cb, 500, NULL);
              Serial.println("[UI] Built");
          }

          void setup() {
              Serial.begin(115200);
              delay(500);
              Serial.println("\n[BOOT] v31-gemini-live-rest-ws-fix");

              I2C_INIT_CALL;
              delay(50);

              lvgl_port_init();
              delay(300);
              build_ui();

              tca9554_init_local();
              delay(100);
              audio_init_local();
              delay(100);
              audio_open_local();
              delay(100);

              g_state = 1;
              WiFi.mode(WIFI_STA);
              WiFi.begin(WIFI_SSID, WIFI_PASS);
              Serial.println("[WiFi] Connecting...");

              int tries = 0;
              while (WiFi.status() != WL_CONNECTED && tries < 30) {
                  delay(500);
                  Serial.print(".");
                  tries++;
              }
              Serial.println();
              if (WiFi.status() != WL_CONNECTED) {
                  Serial.println("[WiFi] FAILED");
                  return;
              }
              Serial.printf("[WiFi] IP: %s\n", WiFi.localIP().toString().c_str());

              String path = "/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + String(GEMINI_API_KEY);
              ws.beginSSL("generativelanguage.googleapis.com", 443, path.c_str());
              ws.onEvent(wsEvent);
              ws.setReconnectInterval(10000);
              Serial.println("[WS] Connecting...");
          }

          void loop() {
              ws.loop();

              // Transmitem audio NUMAI daca am primit confirmarea de LIVE!
              if (g_state == 3) {
                  int r = esp_codec_dev_read(record, buf_in_stereo, sizeof(buf_in_stereo));
                  if (r == ESP_OK) {
                      int frames = (sizeof(buf_in_stereo)/sizeof(int16_t)) / 2;
                      int32_t peak = 0;
                      for (int i = 0; i < frames; i++) {
                          int16_t s = buf_in_stereo[i*2];
                          int32_t a = s < 0 ? -s : s;
                          if (a > peak) peak = a;
                          buf_mono_24k[i] = s;
                      }
                      g_peak = (int)peak;

                      int out_count = frames * 2 / 3;
                      for (int i = 0; i < out_count; i++) {
                          int src = (i * 3) / 2;
                          if (src >= frames) src = frames - 1;
                          buf_mono_16k[i] = buf_mono_24k[src];
                      }

                      String b64_str = base64::encode((uint8_t*)buf_mono_16k, out_count * sizeof(int16_t));
                      if (b64_str.length() > 0) {
                          JsonDocument doc;
                          JsonObject realtimeInput = doc["realtimeInput"].to<JsonObject>();
                          JsonArray mediaChunks = realtimeInput["mediaChunks"].to<JsonArray>();
                          JsonObject chunk = mediaChunks.add<JsonObject>();
                          chunk["mimeType"] = "audio/pcm;rate=16000";
                          chunk["data"] = b64_str;

                          String out;
                          serializeJson(doc, out);
                          ws.sendTXT(out);
                          g_tx_kb += (out_count * 2) / 1024;
                      }
                  }
              }

              delay(5); // Redus polling-ul usor pentru a menaja CPU-ul.
          }
          EOF

          I2C_FUNC=$(cat sketch/i2c_func.txt)
          sed -i "s/I2C_INIT_CALL;/${I2C_FUNC}();/" sketch/sketch.ino
          echo "[OK] sketch.ino configurat cu $I2C_FUNC"

      - name: Compile
        run: |
          SKETCH_PATH="sketch/sketch.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-v31-live-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/gemini-v31-live-0x0.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gemini-v31-live
          path: package_bin/gemini-v31-live-0x0.bin
          if-no-files-found: error
