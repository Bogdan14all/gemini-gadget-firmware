name: Build Meta Muse Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32
          
          OVERLAY=$(find devices/ -type f -name "*349*" | head -n 1)
          DEFAULTS="sdkconfig.defaults"
          [ -f "devices/sdkconfig.muse" ] && DEFAULTS="$DEFAULTS;devices/sdkconfig.muse"
          [ -n "$OVERLAY" ] && DEFAULTS="$DEFAULTS;$OVERLAY"
          
          # Inject scaling directly into overlay and defaults so they cannot be overridden
          for cfg in sdkconfig.defaults "$OVERLAY" devices/sdkconfig.muse; do
            if [ -f "$cfg" ]; then
              echo "CONFIG_LV_FONT_DEFAULT_MONTSERRAT_10=y" >> "$cfg"
              echo "CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=n" >> "$cfg"
              echo "CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=n" >> "$cfg"
              echo "CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=n" >> "$cfg"
              echo "CONFIG_LV_DPI_DEF=75" >> "$cfg"
            fi
          done
          
          # Fetch components first so all UI and LVGL source files exist on disk
          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS="$DEFAULTS" reconfigure
          
          # Scale down global DPI and lock the keyboard height
          python3 -c '
          import os, re
          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith((".c", ".cpp", ".h")):
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f: s = f.read()
                          orig = s
                          s = re.sub(r"#\s*define\s+LV_DPI_DEF\s+\d+", "#define LV_DPI_DEF 75", s)
                          if "lv_keyboard_create" in s:
                              s = re.sub(
                                  r"([a-zA-Z0-9_>.-]+)\s*=\s*lv_keyboard_create\(([^)]+)\);",
                                  r"\1 = lv_keyboard_create(\2);\n    lv_obj_set_height(\1, 85);\n    lv_obj_align(\1, LV_ALIGN_BOTTOM_MID, 0, 0);\n    lv_obj_set_style_pad_all(\1, 0, 0);",
                                  s
                              )
                          if s != orig:
                              with open(p, "w", encoding="utf-8") as f: f.write(s)
                              print("Patched:", p)
                      except Exception: pass
          '
          
          idf.py -B build-waveshare build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: muse-waveshare-v2-binaries
          path: |
            esp32/build-waveshare/**/*.bin
            esp32/build-waveshare/**/flasher_args.json
