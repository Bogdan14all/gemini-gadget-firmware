name: Build Gemini OS - Mic Only Test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Mic Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare V2 Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install LVGL 9.1
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino/libraries" ]; then
            cp -r Arduino/libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@9.1.0

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_USE_STDLIB_MALLOC LV_STDLIB_BUILTIN
          #define LV_MEM_SIZE_KILOBYTES 128
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20
          #define LV_USE_LABEL 1
          #define LV_USE_BAR 1
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h
          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/lv_conf.h 2>/dev/null || true
          cp ~/Arduino/libraries/lv_conf.h Arduino/examples/10_LVGL_V9_Test/lv_conf.h 2>/dev/null || true
          rm -rf ~/Arduino/libraries/lvgl/src/demos ~/Arduino/libraries/lvgl/demos 2>/dev/null || true

      - name: Generate Mic Test Sketch
        shell: bash
        run: |
          SKETCH_DIR="Arduino/examples/10_LVGL_V9_Test"

          # Eliminam referintele la demo-uri
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include "demos/lv_demos.h"|// #include "demos/lv_demos.h"|g' {} + 2>/dev/null || true
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include <demos/lv_demos.h>|// #include <demos/lv_demos.h>|g' {} + 2>/dev/null || true
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|lv_demo_widgets();|// lv_demo_widgets();|g' {} + 2>/dev/null || true

          python3 - << 'PYEOF'
          import re, os, textwrap, glob

          sketch_dir = "Arduino/examples/10_LVGL_V9_Test"

          # Patch lvgl_port.c
          port_path = f"{sketch_dir}/lvgl_port.c"
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              code = f.read()

          # Rezolvam LV_COLOR_FORMAT_GET_SIZE
          code = code.replace("LV_COLOR_FORMAT_GET_SIZE(LV_COLOR_FORMAT_RGB565)", "2")
          code = code.replace("lv_color_format_get_size(LV_COLOR_FORMAT_RGB565)", "2")
          # Comentam apelul demo
          code = code.replace("lv_demo_widgets();", "// lv_demo_widgets();")
          
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*i2c_master_get_bus_handle\s*\(\s*0\s*,\s*&tca9554_i2c_bus\s*\)\s*\)\s*;',
              'if (i2c_master_get_bus_handle(0, &tca9554_i2c_bus) != ESP_OK) { puts("[EXIO] bus 0 not ready"); tca9554_i2c_bus = NULL; } else { puts("[EXIO] bus 0 acquired!"); }',
              code)
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_new_i2c_tca9554\s*\([^;]+\)\s*\)\s*;',
              'if (tca9554_i2c_bus != NULL) { if (esp_io_expander_new_i2c_tca9554(tca9554_i2c_bus, ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander) == ESP_OK) { puts("[EXIO] TCA9554 ok"); } else { puts("[EXIO] TCA9554 fail"); io_expander = NULL; } } else { io_expander = NULL; }',
              code)
          code = re.sub(r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_dir\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;', r'if (io_expander != NULL) { esp_io_expander_set_dir(io_expander, \g<1>); }', code)
          code = re.sub(r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_level\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;', r'if (io_expander != NULL) { esp_io_expander_set_level(io_expander, \g<1>); }', code)
          
          with open(port_path, "w", encoding="utf-8") as f:
              f.write(code)

          # Inject lock/unlock in lvgl_port
          h_path = f"{sketch_dir}/lvgl_port.h"
          with open(h_path, "r", encoding="utf-8", errors="ignore") as f:
              h_content = f.read()
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              c_content = f.read()

          if "lvgl_port_lock" not in h_content:
              mux_var = "lvgl_port_mux"
              c_content = re.sub(
                  r'(#include[^\n]+\n)(?![^\n]*#include)',
                  r'\1\nstatic SemaphoreHandle_t ' + mux_var + ' = NULL;\n',
                  c_content, count=1, flags=re.DOTALL)
              c_content = re.sub(
                  r'(esp_err_t\s+lvgl_port_init\s*\([^)]*\)\s*\{)',
                  r'\1\n    ' + mux_var + ' = xSemaphoreCreateMutex();',
                  c_content, count=1)
              c_content += f"""

          bool lvgl_port_lock(uint32_t timeout_ms) {{
              if ({mux_var} == NULL) return false;
              return xSemaphoreTake({mux_var}, pdMS_TO_TICKS(timeout_ms)) == pdTRUE;
          }}
          void lvgl_port_unlock(void) {{
              if ({mux_var} != NULL) xSemaphoreGive({mux_var});
          }}
          """
              h_content += """
          #ifdef __cplusplus
          extern "C" {
          #endif
          bool lvgl_port_lock(uint32_t timeout_ms);
          void lvgl_port_unlock(void);
          #ifdef __cplusplus
          }
          #endif
          """
              with open(h_path, "w", encoding="utf-8") as f:
                  f.write(h_content)
              with open(port_path, "w", encoding="utf-8") as f:
                  f.write(c_content)

          # Detect I2C init
          i2c_init_func = "bsp_i2c_init"
          for h_path in glob.glob(f"{sketch_dir}/*.h"):
              with open(h_path, "r", encoding="utf-8", errors="ignore") as f:
                  h = f.read()
              for f_name, f_args in re.findall(
                  r'(?:esp_err_t|void|int|bool)\s+([a-zA-Z0-9_]+)\s*\(([^)]*)\)\s*;', h):
                  if "i2c" in f_name.lower() and "init" in f_name.lower() \
                     and f_args.strip() in ("", "void"):
                      i2c_init_func = f_name
                      break

          ino = textwrap.dedent(r'''
          #include <Arduino.h>
          #include <driver/i2s_std.h>
          #include <driver/i2s_tdm.h>
          #include <driver/i2c_master.h>

          extern "C" {
          #include "i2c_bsp.h"
          #include "lvgl_port.h"
          }

          #define I2S_MCLK  7
          #define I2S_WS    46
          #define I2S_BCLK  15
          #define I2S_DIN   6
          #define I2S_DOUT  45

          #define SAMPLE_RATE_MIC 16000

          i2s_chan_handle_t rx_handle = NULL;
          i2c_master_bus_handle_t i2c_bus = NULL;

          bool i2c_write_reg(uint8_t addr, uint8_t reg, uint8_t val) {
              if (!i2c_bus) return false;
              i2c_master_dev_handle_t dev = NULL;
              i2c_device_config_t cfg = {};
              cfg.dev_addr_length = I2C_ADDR_BIT_LEN_7;
              cfg.device_address = addr;
              cfg.scl_speed_hz = 100000;
              if (i2c_master_bus_add_device(i2c_bus, &cfg, &dev) != ESP_OK) return false;
              uint8_t buf[2] = { reg, val };
              esp_err_t ret = i2c_master_transmit(dev, buf, 2, 100);
              i2c_master_bus_rm_device(dev);
              return ret == ESP_OK;
          }

          void codec_init() {
              // TCA9554
              i2c_write_reg(0x20, 0x03, 0x00); delay(10);
              i2c_write_reg(0x20, 0x01, 0xFF); delay(50);
              
              // ES8311 (pornim MCLK corect)
              i2c_write_reg(0x18, 0x00, 0x1F); delay(20);
              i2c_write_reg(0x18, 0x00, 0x00);

              // ES7210 (ADC)
              i2c_write_reg(0x40, 0x00, 0xFF); delay(20);
              i2c_write_reg(0x40, 0x00, 0x41); // Reset + power up
              i2c_write_reg(0x40, 0x01, 0x1F); // Clock on
              i2c_write_reg(0x40, 0x02, 0x00); // Mute off
              i2c_write_reg(0x40, 0x08, 0x10); // 16-bit
              i2c_write_reg(0x40, 0x09, 0x30);
              i2c_write_reg(0x40, 0x0A, 0x30);
              i2c_write_reg(0x40, 0x11, 0x60); // Mic bias
              i2c_write_reg(0x40, 0x12, 0xFF); // Gain max
              i2c_write_reg(0x40, 0x13, 0xFF); // Gain max
          }

          bool i2s_init_tdm() {
              i2s_chan_config_t chan_cfg = I2S_CHANNEL_DEFAULT_CONFIG(I2S_NUM_0, I2S_ROLE_MASTER);
              if (i2s_new_channel(&chan_cfg, NULL, &rx_handle) != ESP_OK) return false;

              i2s_tdm_config_t tdm_cfg = {
                  .clk_cfg = I2S_TDM_CLK_DEFAULT_CONFIG(SAMPLE_RATE_MIC),
                  .slot_cfg = I2S_TDM_PHILIPS_SLOT_DEFAULT_CONFIG(
                      I2S_DATA_BIT_WIDTH_16BIT, I2S_SLOT_MODE_STEREO,
                      (i2s_tdm_slot_mask_t)(I2S_TDM_SLOT0 | I2S_TDM_SLOT1 | I2S_TDM_SLOT2 | I2S_TDM_SLOT3)
                  ),
                  .gpio_cfg = {
                      .mclk = (gpio_num_t)I2S_MCLK,
                      .bclk = (gpio_num_t)I2S_BCLK,
                      .ws   = (gpio_num_t)I2S_WS,
                      .dout = (gpio_num_t)I2S_DOUT,
                      .din  = (gpio_num_t)I2S_DIN,
                      .invert_flags = { .mclk_inv = false, .bclk_inv = false, .ws_inv = false }
                  }
              };
              tdm_cfg.clk_cfg.mclk_multiple = I2S_MCLK_MULTIPLE_256;

              if (i2s_channel_init_tdm_mode(rx_handle, &tdm_cfg) != ESP_OK) return false;
              if (i2s_channel_enable(rx_handle) != ESP_OK) return false;
              return true;
          }

          void setup() {
              Serial.begin(115200);
              delay(500);
              Serial.println("\n=== Microfon Test (TDM Mode) ===");

              I2C_INIT_CALL
              delay(50);

              lvgl_port_init();
              delay(100);

              if (i2c_master_get_bus_handle(0, &i2c_bus) != ESP_OK) {
                  Serial.println("I2C fail");
                  return;
              }

              codec_init();
              delay(100);

              if (!i2s_init_tdm()) {
                  Serial.println("I2S TDM init fail");
                  return;
              }

              Serial.println("I2S TDM OK. Vorbeste acum!");
          }

          void loop() {
              static int16_t mic_buf[512];
              size_t bytes_read = 0;
              esp_err_t err = i2s_channel_read(rx_handle, mic_buf, sizeof(mic_buf), &bytes_read, 1000);
              
              if (err == ESP_OK && bytes_read > 0) {
                  int samples = bytes_read / sizeof(int16_t);
                  int32_t peak = 0;
                  for (int i = 0; i < samples; i++) {
                      int32_t v = mic_buf[i];
                      if (v < 0) v = -v;
                      if (v > peak) peak = v;
                  }
                  
                  Serial.printf("Peak: %5d | Ch1: %6d | Ch2: %6d | Ch3: %6d | Ch4: %6d\n", 
                                peak, mic_buf[0], mic_buf[1], mic_buf[2], mic_buf[3]);
              }
              delay(100);
          }
          ''').lstrip()

          ino = ino.replace("I2C_INIT_CALL", f"{i2c_init_func}();")

          with open(f"{sketch_dir}/10_LVGL_V9_Test.ino", "w", encoding="utf-8") as f:
              f.write(ino)
          print("[OK] Mic Test .ino generat")
          PYEOF

      - name: Compile Firmware
        run: |
          SKETCH_PATH="Arduino/examples/10_LVGL_V9_Test/10_LVGL_V9_Test.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge into Single .bin
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/mic-test-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/mic-test-0x0.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mic-test-firmware
          path: package_bin/mic-test-0x0.bin
          if-no-files-found: error
