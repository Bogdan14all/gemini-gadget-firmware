name: Build Meta Muse Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Refactor Keyboard & Layout Geometry
        shell: bash
        run: |
          python3 -c '
          import os, re

          print("Applying strict 640x172 geometry constraints...")

          for root, _, files in os.walk("esp32"):
              for file in files:
                  if file.endswith((".c", ".cpp", ".h")):
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          s = f.read()

                      orig = s

                      # 1. Inject dynamic keyboard geometry at creation
                      def patch_kb(m):
                          var = m.group(1).strip()
                          return (
                              f"{m.group(0)}\n"
                              f"    if ({var}) {{\n"
                              f"        lv_obj_set_size({var}, 640, 130);\n"
                              f"        lv_obj_align({var}, LV_ALIGN_BOTTOM_MID, 0, 0);\n"
                              f"        lv_obj_set_style_pad_all({var}, 0, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_top({var}, 2, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_bottom({var}, 2, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_row({var}, 2, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_column({var}, 2, LV_PART_MAIN);\n"
                              f"        lv_obj_set_style_pad_ver({var}, 1, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_pad_hor({var}, 2, LV_PART_ITEMS);\n"
                              f"        lv_obj_set_style_text_font({var}, &lv_font_montserrat_10, LV_PART_ITEMS);\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"(?:lv_obj_t\s*\*\s*)?(\b[a-zA-Z0-9_>.-]+\b)\s*=\s*lv_keyboard_create\([^;]+\);",
                          patch_kb,
                          s
                      )

                      # 2. Neutralize secondary resizing calls that expand the keyboard
                      s = re.sub(
                          r"lv_obj_set_size\(\s*([a-zA-Z0-9_>.-]*(?:kb|keyboard)[a-zA-Z0-9_>.-]*)\s*,\s*[^;]+;\s*",
                          r"lv_obj_set_size(\1, 640, 130);\n    lv_obj_align(\1, LV_ALIGN_BOTTOM_MID, 0, 0);\n",
                          s,
                          flags=re.IGNORECASE
                      )
                      s = re.sub(
                          r"lv_obj_set_height\(\s*([a-zA-Z0-9_>.-]*(?:kb|keyboard)[a-zA-Z0-9_>.-]*)\s*,\s*[^;]+;\s*",
                          r"lv_obj_set_height(\1, 130);\n    lv_obj_align(\1, LV_ALIGN_BOTTOM_MID, 0, 0);\n",
                          s,
                          flags=re.IGNORECASE
                      )

                      # 3. Reserve text input area at the top & reveal password text
                      def patch_ta(m):
                          var = m.group(1).strip()
                          return (
                              f"{m.group(0)}\n"
                              f"    if ({var}) {{\n"
                              f"        lv_obj_set_size({var}, 608, 34);\n"
                              f"        lv_obj_align({var}, LV_ALIGN_TOP_MID, 0, 4);\n"
                              f"        lv_obj_set_style_pad_ver({var}, 2, 0);\n"
                              f"        lv_obj_set_style_text_font({var}, &lv_font_montserrat_12, 0);\n"
                              f"        lv_textarea_set_password_mode({var}, false);\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"(?:lv_obj_t\s*\*\s*)?(\b[a-zA-Z0-9_>.-]+\b)\s*=\s*lv_textarea_create\([^;]+\);",
                          patch_ta,
                          s
                      )
                      s = re.sub(r"lv_textarea_set_password_mode\s*\(\s*([^,]+)\s*,\s*true\s*\);", r"lv_textarea_set_password_mode(\1, false);", s)

                      # 4. Limit list and settings buttons to 30px
                      def patch_list_btn(m):
                          var = m.group(1).strip()
                          return (
                              f"{m.group(0)}\n"
                              f"    if ({var}) {{\n"
                              f"        lv_obj_set_height({var}, 30);\n"
                              f"        lv_obj_set_style_pad_ver({var}, 2, 0);\n"
                              f"        lv_obj_set_style_text_font({var}, &lv_font_montserrat_12, 0);\n"
                              f"    }}"
                          )
                      s = re.sub(
                          r"(?:lv_obj_t\s*\*\s*)?(\b[a-zA-Z0-9_>.-]+\b)\s*=\s*lv_list_add_btn\([^;]+\);",
                          patch_list_btn,
                          s
                      )

                      if s != orig:
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(s)
                          print("Patched layout in:", p)
          '

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32

          echo "CONFIG_LV_FONT_MONTSERRAT_10=y" >> sdkconfig.defaults
          echo "CONFIG_LV_FONT_MONTSERRAT_12=y" >> sdkconfig.defaults

          OVERLAY=$(find devices/ -type f -name "*349*" | head -n 1)
          DEFAULTS="sdkconfig.defaults"
          [ -f "devices/sdkconfig.muse" ] && DEFAULTS="$DEFAULTS;devices/sdkconfig.muse"
          [ -n "$OVERLAY" ] && DEFAULTS="$DEFAULTS;$OVERLAY"

          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS="$DEFAULTS" build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: muse-waveshare-v2-binaries
          path: |
            esp32/build-waveshare/**/*.bin
            esp32/build-waveshare/**/flasher_args.json
