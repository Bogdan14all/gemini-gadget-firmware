name: Build Gemini OS - v10 Official Audio (patched)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build v10 (Official Audio Example)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare ESP32-S3-Touch-LCD-3.49
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install LVGL 9.1
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino_Libraries" ]; then
            cp -r Arduino_Libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@9.1.0

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_USE_STDLIB_MALLOC LV_STDLIB_BUILTIN
          #define LV_MEM_SIZE_KILOBYTES 128
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_MONTSERRAT_28 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20
          #define LV_USE_LABEL 1
          #define LV_USE_BAR 1
          #define LV_USE_DEMO_WIDGETS 0
          #define LV_USE_DEMO_MUSIC 0
          #define LV_USE_DEMO_BENCHMARK 0
          #define LV_USE_DEMO_STRESS 0
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h
          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/lv_conf.h 2>/dev/null || true
          rm -rf ~/Arduino/libraries/lvgl/src/demos ~/Arduino/libraries/lvgl/demos 2>/dev/null || true

      - name: Copy official audio example
        shell: bash
        run: |
          rm -rf sketch
          cp -r Examples/Arduino/08_Audio_Test sketch
          echo "[OK] Copied official example"
          ls -la sketch | head -20

      - name: Patch LVGL demo references and API incompatibilities
        shell: bash
        run: |
          cd sketch
          echo "=== Patching .c/.h/.ino files ==="
          find . -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include "demos/lv_demos.h"|// #include "demos/lv_demos.h"|g' {} + 2>/dev/null || true
          find . -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include <demos/lv_demos.h>|// #include <demos/lv_demos.h>|g' {} + 2>/dev/null || true
          find . -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|lv_demo_widgets();|// lv_demo_widgets();|g' {} + 2>/dev/null || true
          find . -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|LV_COLOR_FORMAT_GET_SIZE(LV_COLOR_FORMAT_RGB565)|2|g' {} + 2>/dev/null || true
          find . -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|lv_color_format_get_size(LV_COLOR_FORMAT_RGB565)|2|g' {} + 2>/dev/null || true
          echo "=== Patch done ==="

          # Asiguram ca lv_conf.h este prezent in sketch
          cp ~/Arduino/libraries/lv_conf.h ./lv_conf.h

      - name: Replace .ino with minimal UI + official audio calls
        shell: bash
        run: |
          cd sketch
          rm -f 08_Audio_Test.ino

          cat > sketch.ino << 'EOF'
          #include "user_config.h"
          #include "lvgl_port.h"
          #include "i2c_bsp.h"
          #include "src/codec_board/codec_board.h"
          #include "src/codec_board/codec_init.h"
          #include "src/tca9554/esp_io_expander_tca9554.h"

          esp_codec_dev_handle_t playback = NULL;
          esp_codec_dev_handle_t record = NULL;
          esp_io_expander_handle_t io_expander = NULL;

          lv_obj_t *lbl_peak = NULL;
          lv_obj_t *lbl_rx   = NULL;

          volatile int g_peak = 0;
          volatile int g_ok = 0;
          volatile int g_total = 0;

          void tca9554_init(void) {
              i2c_master_bus_handle_t bus = NULL;
              ESP_ERROR_CHECK(i2c_master_get_bus_handle(0, &bus));
              esp_io_expander_new_i2c_tca9554(bus, ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander);
              esp_io_expander_set_dir(io_expander, IO_EXPANDER_PIN_NUM_7, IO_EXPANDER_OUTPUT);
              esp_io_expander_set_level(io_expander, IO_EXPANDER_PIN_NUM_7, 1);
          }

          void audio_init(void) {
              set_codec_board_type("S3_LCD_3_49");
              codec_init_cfg_t cfg = {
                  .in_mode = CODEC_I2S_MODE_TDM,
                  .out_mode = CODEC_I2S_MODE_TDM,
                  .in_use_tdm = false,
                  .reuse_dev = false,
              };
              ESP_ERROR_CHECK(init_codec(&cfg));
              playback = get_playback_handle();
              record = get_record_handle();
          }

          void audio_play_init(void) {
              esp_codec_dev_set_out_vol(playback, 100.0);
              esp_codec_dev_set_in_gain(record, 35.0);
              esp_codec_dev_sample_info_t fs = {};
              fs.sample_rate = 24000;
              fs.channel = 2;
              fs.bits_per_sample = 16;
              esp_codec_dev_open(playback, &fs);
              esp_codec_dev_open(record, &fs);
          }

          void ui_timer_cb(lv_timer_t *t) {
              int p = g_peak, ok = g_ok, tot = g_total;
              if (lbl_peak) {
                  char buf[48];
                  snprintf(buf, sizeof(buf), "Peak: %d %s", p, p > 0 ? "DATA!" : "(zeros)");
                  lv_label_set_text(lbl_peak, buf);
                  lv_obj_set_style_text_color(lbl_peak,
                      p > 0 ? lv_color_hex(0x22C55E) : lv_color_hex(0xEF4444), 0);
              }
              if (lbl_rx) {
                  char buf[32];
                  snprintf(buf, sizeof(buf), "RX: %d/%d", ok, tot);
                  lv_label_set_text(lbl_rx, buf);
              }
          }

          void build_ui() {
              lvgl_port_lock(1000);
              lv_obj_t *scr = lv_screen_active();
              if (!scr) scr = lv_scr_act();
              if (!scr) { lvgl_port_unlock(); return; }

              lv_obj_clean(scr);
              lv_obj_set_style_bg_color(scr, lv_color_hex(0x0F172A), 0);
              lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, 0);

              lv_obj_t *title = lv_label_create(scr);
              lv_label_set_text(title, "v10 Official Audio");
              lv_obj_set_style_text_color(title, lv_color_hex(0x38BDF8), 0);
              lv_obj_set_style_text_font(title, &lv_font_montserrat_20, 0);
              lv_obj_align(title, LV_ALIGN_TOP_MID, 0, 20);

              lbl_peak = lv_label_create(scr);
              lv_label_set_text(lbl_peak, "Peak: 0 (zeros)");
              lv_obj_set_style_text_color(lbl_peak, lv_color_hex(0xEF4444), 0);
              lv_obj_set_style_text_font(lbl_peak, &lv_font_montserrat_28, 0);
              lv_obj_align(lbl_peak, LV_ALIGN_CENTER, 0, -20);

              lbl_rx = lv_label_create(scr);
              lv_label_set_text(lbl_rx, "RX: 0/0");
              lv_obj_set_style_text_color(lbl_rx, lv_color_hex(0x94A3B8), 0);
              lv_obj_set_style_text_font(lbl_rx, &lv_font_montserrat_14, 0);
              lv_obj_align(lbl_rx, LV_ALIGN_CENTER, 0, 20);

              lvgl_port_unlock();

              lv_timer_create(ui_timer_cb, 500, NULL);
              Serial.println("[UI] Built + timer");
          }

          void setup() {
              Serial.begin(115200);
              delay(500);
              Serial.println("\n[BOOT] v10-official-audio");

              bsp_i2c_init();
              delay(50);

              lvgl_port_init();
              delay(300);
              build_ui();

              tca9554_init();
              audio_init();
              audio_play_init();

              Serial.println("[AUDIO] Ready - speak now!");
          }

          void loop() {
              if (record) {
                  static int16_t buf[1024];
                  int r = esp_codec_dev_read(record, buf, sizeof(buf));
                  g_total++;
                  if (r == ESP_OK) {
                      int32_t peak = 0;
                      for (int i = 0; i < (int)(sizeof(buf)/sizeof(int16_t)); i++) {
                          int32_t v = buf[i];
                          if (v < 0) v = -v;
                          if (v > peak) peak = v;
                      }
                      g_peak = (int)peak;
                      if (peak > 0) g_ok++;

                      static int32_t last = -1;
                      if (peak != last) {
                          last = peak;
                          Serial.printf("[MIC] peak=%d ok=%d/%d\n", (int)peak, g_ok, g_total);
                      }
                  } else {
                      Serial.printf("[MIC] err=%d\n", r);
                  }
              }
              delay(100);
          }
          EOF

          echo "[OK] Sketch replaced"

      - name: Compile
        run: |
          SKETCH_PATH="sketch/sketch.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge into Single .bin
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-v10-official-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/gemini-v10-official-0x0.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-v10-official
          path: package_bin/gemini-v10-official-0x0.bin
          if-no-files-found: error
