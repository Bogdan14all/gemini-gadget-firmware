name: Build Minimal Gemini OS v41 (Bogdan Edition)

on:
  workflow_dispatch:

jobs:
  build-minimal:
    name: Build Minimal Gemini OS - Hello Bogdan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Waveshare Official V2 Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Setup Python & esptool
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool & zip
        run: |
          pip install esptool
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Libraries & Setup LVGL Configuration
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino/libraries" ]; then
            cp -r Arduino/libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi

          arduino-cli lib install "lvgl"@9.1.0 2>/dev/null || true

          # Configurare lv_conf.h completa
          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_COLOR_16_SWAP 1
          #define LV_MEM_CUSTOM 0
          #define LV_MEM_SIZE (128U * 1024U)
          #define LV_TICK_CUSTOM 1
          #define LV_TICK_CUSTOM_INCLUDE "Arduino.h"
          #define LV_TICK_CUSTOM_SYS_TIME_EXPR (millis())
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20
          #define LV_USE_LABEL 1
          #define LV_USE_OBJ_ID_BUILTIN 0
          #define LV_USE_OBJ_PROPERTY 0
          #define LV_USE_DEMO_WIDGETS 0
          #define LV_USE_DEMO_MUSIC 0
          #define LV_USE_DEMO_BENCHMARK 0
          #define LV_USE_DEMO_STRESS 0
          #endif
          EOF
          sed -i 's/^[ 	]*//' ~/Arduino/libraries/lv_conf.h

          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/src/lv_conf.h 2>/dev/null || true
          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/lv_conf.h 2>/dev/null || true
          cp ~/Arduino/libraries/lv_conf.h Arduino/examples/10_LVGL_V9_Test/lv_conf.h 2>/dev/null || true

          # Curatare module demo/debug
          rm -rf ~/Arduino/libraries/lvgl/src/demos ~/Arduino/libraries/lvgl/demos 2>/dev/null || true
          if [ -f ~/Arduino/libraries/lvgl/src/core/lv_obj_id_builtin.c ]; then
            echo "// disabled" > ~/Arduino/libraries/lvgl/src/core/lv_obj_id_builtin.c
          fi

      - name: Configure Display to Show 'Gemini OS by Bogdan'
        shell: bash
        run: |
          SKETCH_DIR="Arduino/examples/10_LVGL_V9_Test"
          echo "Curatare referinte demo si aplicare ecran Bogdan in $SKETCH_DIR..."

          # Dezactivare referinte demo
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) -exec sed -i 's/#include "demos\/lv_demos.h"/\/\/ #include "demos\/lv_demos.h"/g' {} + 2>/dev/null || true
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) -exec sed -i 's/#include <demos\/lv_demos.h>/\/\/ #include <demos\/lv_demos.h>/g' {} + 2>/dev/null || true
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) -exec sed -i 's/lv_demo_widgets();/\/\/ lv_demo_widgets();/g' {} + 2>/dev/null || true

          # Patch Python pe drivere pentru ecran permanent deschis
          python3 - << 'PYEOF'
          import re, os

          sketch_dir = "Arduino/examples/10_LVGL_V9_Test"

          # 1. Neutralizare completa driver PWM Backlight (lcd_bl_pwm_bsp.c)
          # Fortam setUpduty la 100% (8191) si eliminam orice oprire accidentala
          for root, dirs, files in os.walk(sketch_dir):
              for file in files:
                  if file == "lcd_bl_pwm_bsp.c":
                      bl_path = os.path.join(root, file)
                      with open(bl_path, "r", encoding="utf-8", errors="ignore") as f:
                          bl_c = f.read()
                      # Rescriem complet setUpduty sa seteze 100% (duty 8191)
                      bl_c = re.sub(
                          r'void\s+setUpduty\s*\([^)]*\)\s*\{[^}]*\}',
                          'void setUpduty(uint16_t duty) { ledc_set_duty(LEDC_LOW_SPEED_MODE, LEDC_CHANNEL_0, 8191); ledc_update_duty(LEDC_LOW_SPEED_MODE, LEDC_CHANNEL_0); }',
                          bl_c
                      )
                      # Neutralizam ledc_stop complet
                      bl_c = re.sub(r'ESP_ERROR_CHECK_WITHOUT_ABORT\s*\(\s*ledc_stop\s*\([^)]+\)\s*\)\s*;', '// ledc_stop disabled;', bl_c)
                      bl_c = re.sub(r'ledc_stop\s*\([^;]+\);', '// ledc_stop disabled;', bl_c)
                      with open(bl_path, "w", encoding="utf-8") as f:
                          f.write(bl_c)
                      print(f"Patched {bl_path} cleanly!")

          # 2. Patch pe lvgl_port.c
          port_path = f"{sketch_dir}/lvgl_port.c"
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              code = f.read()

          code = code.replace("LV_COLOR_FORMAT_GET_SIZE(LV_COLOR_FORMAT_RGB565)", "2")
          code = code.replace("lv_color_format_get_size(LV_COLOR_FORMAT_RGB565)", "2")

          # Safe touch: TouchInputReadCallback pasiv fara blocaj I2C
          safe_touch = "static void TouchInputReadCallback(lv_indev_t * indev_drv, lv_indev_data_t * data) { if (data) { data->state = LV_INDEV_STATE_RELEASED; } }"
          pattern = r'static\s+void\s+TouchInputReadCallback\s*\([^{]+\{(?:[^{}]*|\{[^{}]*\})*\}'
          if re.search(pattern, code):
              code = re.sub(pattern, safe_touch, code, count=1)
              print("Patched TouchInputReadCallback successfully!")

          # example_lcd_exio_init fara abort si cu log curat
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*i2c_master_get_bus_handle\s*\(\s*0\s*,\s*&tca9554_i2c_bus\s*\)\s*\)\s*;',
              'if (i2c_master_get_bus_handle(0, &tca9554_i2c_bus) != ESP_OK) { puts("[EXIO] I2C bus 0 not ready"); tca9554_i2c_bus = NULL; } else { puts("[EXIO] I2C bus 0 acquired!"); }',
              code
          )
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_new_i2c_tca9554\s*\([^;]+\)\s*\)\s*;',
              'if (tca9554_i2c_bus != NULL) { if (esp_io_expander_new_i2c_tca9554(tca9554_i2c_bus, ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander) == ESP_OK) { puts("[EXIO] TCA9554 expander connected at 0x20!"); } else { puts("[EXIO] Failed to connect TCA9554"); io_expander = NULL; } } else { io_expander = NULL; }',
              code
          )
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_dir\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;',
              r'if (io_expander != NULL) { esp_io_expander_set_dir(io_expander, \g<1>); }',
              code
          )
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_level\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;',
              r'if (io_expander != NULL) { esp_io_expander_set_level(io_expander, \g<1>); }',
              code
          )

          with open(port_path, "w", encoding="utf-8") as f:
              f.write(code)
          print("lvgl_port.c patched successfully!")
          PYEOF

          # Generare 10_LVGL_V9_Test.ino curat
          cat << 'EOF' > "$SKETCH_DIR/10_LVGL_V9_Test.ino"
          #include <Arduino.h>
          #include <WiFi.h>

          extern "C" {
          #include "i2c_bsp.h"
          #include "lvgl_port.h"
          }
          #include <lvgl.h>

          const char* ssid = "TP-Link_2.4G_9318_Guest";
          const char* password = "revelion";

          void create_bogdan_ui() {
              pinMode(1, OUTPUT);
              digitalWrite(1, HIGH); // Backlight GPIO 1
              pinMode(43, OUTPUT);
              digitalWrite(43, HIGH); // Backlight GPIO 43 (redundanta V1/V2)

              #if defined(lvgl_port_lock) || defined(LVGL_PORT_LOCK_H)
              lvgl_port_lock(0);
              #endif

              lv_obj_t *scr = lv_screen_active();
              if (!scr) scr = lv_scr_act();
              if (scr) {
                  lv_obj_clean(scr);

                  // 1. Fundal Albastru Deschis Opac (#38BDF8)
                  lv_obj_set_style_bg_color(scr, lv_color_hex(0x38BDF8), 0);
                  lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, 0);

                  // 2. Titlu Linia 1: "Gemini OS" (Montserrat 18)
                  lv_obj_t *lbl_title = lv_label_create(scr);
                  lv_label_set_text(lbl_title, "Gemini OS");
                  lv_obj_set_style_text_color(lbl_title, lv_color_hex(0x000000), 0);
                  lv_obj_set_style_text_font(lbl_title, &lv_font_montserrat_18, 0);
                  lv_obj_align(lbl_title, LV_ALIGN_CENTER, 0, -36);

                  // 3. Titlu Linia 2: "by Bogdan" (Montserrat 14)
                  lv_obj_t *lbl_sub = lv_label_create(scr);
                  lv_label_set_text(lbl_sub, "by Bogdan");
                  lv_obj_set_style_text_color(lbl_sub, lv_color_hex(0x0F172A), 0);
                  lv_obj_set_style_text_font(lbl_sub, &lv_font_montserrat_14, 0);
                  lv_obj_align(lbl_sub, LV_ALIGN_CENTER, 0, -14);

                  // 4. Stare Wi-Fi: minim Montserrat 14 conform regulii stabilite
                  lv_obj_t *lbl_wifi = lv_label_create(scr);
                  lv_label_set_text(lbl_wifi, "Wi-Fi: Conectat!");
                  lv_obj_set_style_text_color(lbl_wifi, lv_color_hex(0x0284C7), 0);
                  lv_obj_set_style_text_font(lbl_wifi, &lv_font_montserrat_14, 0);
                  lv_obj_align(lbl_wifi, LV_ALIGN_CENTER, 0, 18);
              }

              #if defined(lvgl_port_lock) || defined(LVGL_PORT_LOCK_H)
              lvgl_port_unlock();
              #endif
          }

          void setup() {
              Serial.begin(115200);
              delay(500);
              Serial.println("Starting Gemini OS Bogdan Edition...");

              // 1. Initializare I2C a placii pentru cipul TCA9554
              Serial.println("Initializare I2C Master...");
              i2c_master_Init();
              delay(50);

              // 2. Initializare port LVGL oficial Waveshare (driver QSPI AXS15231B + FreeRTOS task)
              delay(100);
              lvgl_port_init();

              delay(200);
              create_bogdan_ui();
              Serial.println("UI Created successfully!");

              // 3. Initializare Wi-Fi cu putere redusa si Modem Sleep oprit
              WiFi.mode(WIFI_STA);
              WiFi.setTxPower(WIFI_POWER_8_5dBm);
              WiFi.setSleep(false);
              WiFi.begin(ssid, password);
              Serial.println("Connecting to WiFi: " + String(ssid));
          }

          void loop() {
              // Mentinem iluminarea la nivel inalt permanent pe ambele revizii hardware
              digitalWrite(1, HIGH);
              digitalWrite(43, HIGH);

              static unsigned long last_beat = 0;
              if (millis() - last_beat > 5000) {
                  last_beat = millis();
                  if (WiFi.status() == WL_CONNECTED) {
                      Serial.println("[Heartbeat] Gemini OS Bogdan Edition ruleaza stabil pe Wi-Fi! IP: " + WiFi.localIP().toString());
                  } else {
                      Serial.println("[Heartbeat] Conectare Wi-Fi in desfasurare...");
                  }
              }
              delay(100);
          }
          EOF
      - name: Compile Minimal Firmware
        run: |
          SKETCH_PATH="Arduino/examples/10_LVGL_V9_Test/10_LVGL_V9_Test.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi"
          echo "Compilare sketch: $SKETCH_PATH cu FQBN: $FQBN"

          arduino-cli compile --fqbn "$FQBN"             --output-dir build_output             "$SKETCH_PATH"

      - name: Merge into Single .bin & Create Clean ZIP
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)

          echo "Bootloader (0x0): $BOOTLOADER"
          echo "Partitions (0x8000): $PARTITIONS"
          echo "App (0x10000): $APP_BIN"

          esptool.py --chip esp32s3 merge_bin             -o package_bin/gemini-os-full-0x0.bin             --flash_mode keep             --flash_size 16MB             --flash_freq 80m             0x0 "$BOOTLOADER"             0x8000 "$PARTITIONS"             0x10000 "$APP_BIN"

          ls -lh package_bin/gemini-os-full-0x0.bin

      - name: Upload Single-Bin ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-full-0x0
          path: package_bin/gemini-os-full-0x0.bin
          if-no-files-found: error
