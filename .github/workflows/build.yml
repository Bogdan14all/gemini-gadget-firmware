name: Build Gemini OS - v9 (v4.1 + audio)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build v9
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare V2
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install LVGL 9.1
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino/libraries" ]; then
            cp -r Arduino/libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@9.1.0

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_USE_STDLIB_MALLOC LV_STDLIB_BUILTIN
          #define LV_MEM_SIZE_KILOBYTES 128
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_MONTSERRAT_28 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20
          #define LV_USE_LABEL 1
          #define LV_USE_BAR 1
          #define LV_USE_DEMO_WIDGETS 0
          #define LV_USE_DEMO_MUSIC 0
          #define LV_USE_DEMO_BENCHMARK 0
          #define LV_USE_DEMO_STRESS 0
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h
          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/lv_conf.h 2>/dev/null || true
          cp ~/Arduino/libraries/lv_conf.h Arduino/examples/10_LVGL_V9_Test/lv_conf.h 2>/dev/null || true
          rm -rf ~/Arduino/libraries/lvgl/src/demos ~/Arduino/libraries/lvgl/demos 2>/dev/null || true

      - name: Patch Drivers & Generate Sketch
        shell: bash
        run: |
          SKETCH_DIR="Arduino/examples/10_LVGL_V9_Test"

          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include "demos/lv_demos.h"|// #include "demos/lv_demos.h"|g' {} + 2>/dev/null || true
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include <demos/lv_demos.h>|// #include <demos/lv_demos.h>|g' {} + 2>/dev/null || true
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|lv_demo_widgets();|// lv_demo_widgets();|g' {} + 2>/dev/null || true

          python3 - << 'PYEOF'
          import re, os, textwrap, glob

          sketch_dir = "Arduino/examples/10_LVGL_V9_Test"

          port_path = f"{sketch_dir}/lvgl_port.c"
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              code = f.read()

          code = code.replace("LV_COLOR_FORMAT_GET_SIZE(LV_COLOR_FORMAT_RGB565)", "2")
          code = code.replace("lv_color_format_get_size(LV_COLOR_FORMAT_RGB565)", "2")
          code = code.replace("lv_demo_widgets();", "// lv_demo_widgets();")

          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*i2c_master_get_bus_handle\s*\(\s*0\s*,\s*&tca9554_i2c_bus\s*\)\s*\)\s*;',
              'if (i2c_master_get_bus_handle(0, &tca9554_i2c_bus) != ESP_OK) { puts("[EXIO] bus 0 not ready"); tca9554_i2c_bus = NULL; } else { puts("[EXIO] bus 0 acquired!"); }',
              code)
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_new_i2c_tca9554\s*\([^;]+\)\s*\)\s*;',
              'if (tca9554_i2c_bus != NULL) { if (esp_io_expander_new_i2c_tca9554(tca9554_i2c_bus, ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander) == ESP_OK) { puts("[EXIO] TCA9554 ok"); } else { puts("[EXIO] TCA9554 fail"); io_expander = NULL; } } else { io_expander = NULL; }',
              code)
          code = re.sub(r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_dir\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;', r'if (io_expander != NULL) { esp_io_expander_set_dir(io_expander, \g<1>); }', code)
          code = re.sub(r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_level\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;', r'if (io_expander != NULL) { esp_io_expander_set_level(io_expander, \g<1>); }', code)

          with open(port_path, "w", encoding="utf-8") as f:
              f.write(code)

          h_path = f"{sketch_dir}/lvgl_port.h"
          with open(h_path, "r", encoding="utf-8", errors="ignore") as f:
              h_content = f.read()
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              c_content = f.read()

          if "lvgl_port_lock" not in h_content:
              mux_var = "lvgl_port_mux"
              c_content = re.sub(
                  r'(#include[^\n]+\n)(?![^\n]*#include)',
                  r'\1\nstatic SemaphoreHandle_t ' + mux_var + ' = NULL;\n',
                  c_content, count=1, flags=re.DOTALL)
              c_content = re.sub(
                  r'(esp_err_t\s+lvgl_port_init\s*\([^)]*\)\s*\{)',
                  r'\1\n    ' + mux_var + ' = xSemaphoreCreateMutex();',
                  c_content, count=1)
              c_content += f"""

          bool lvgl_port_lock(uint32_t timeout_ms) {{
              if ({mux_var} == NULL) return false;
              return xSemaphoreTake({mux_var}, pdMS_TO_TICKS(timeout_ms)) == pdTRUE;
          }}
          void lvgl_port_unlock(void) {{
              if ({mux_var} != NULL) xSemaphoreGive({mux_var});
          }}
          """
              h_content += """
          #ifdef __cplusplus
          extern "C" {
          #endif
          bool lvgl_port_lock(uint32_t timeout_ms);
          void lvgl_port_unlock(void);
          #ifdef __cplusplus
          }
          #endif
          """
              with open(h_path, "w", encoding="utf-8") as f:
                  f.write(h_content)
              with open(port_path, "w", encoding="utf-8") as f:
                  f.write(c_content)

          i2c_init_func = "bsp_i2c_init"
          for hh in glob.glob(f"{sketch_dir}/*.h"):
              with open(hh, "r", encoding="utf-8", errors="ignore") as f:
                  h = f.read()
              for f_name, f_args in re.findall(
                  r'(?:esp_err_t|void|int|bool)\s+([a-zA-Z0-9_]+)\s*\(([^)]*)\)\s*;', h):
                  if "i2c" in f_name.lower() and "init" in f_name.lower() \
                     and f_args.strip() in ("", "void"):
                      i2c_init_func = f_name
                      break

          ino = textwrap.dedent(r'''
          #include <Arduino.h>
          #include <WiFi.h>
          #include <time.h>
          #include <WiFiClient.h>
          #include <driver/i2s_tdm.h>
          #include <driver/i2c_master.h>

          extern "C" {
          #include "i2c_bsp.h"
          #include "lvgl_port.h"
          }
          #include <lvgl.h>

          #define LCD_BL    42
          #define BOOT_BTN  0
          #define PWR_BTN   16

          #define I2S_MCLK  7
          #define I2S_WS    46
          #define I2S_BCLK  15
          #define I2S_DIN   6
          #define I2S_DOUT  45

          #define SAMPLE_RATE 24000

          const char* ssid     = "TP-Link_2.4G_9318_Guest";
          const char* password = "revelion";

          i2s_chan_handle_t rx_handle = NULL;
          i2c_master_bus_handle_t i2c_bus = NULL;
          i2c_master_dev_handle_t dev_7210 = NULL;
          i2c_master_dev_handle_t dev_8311 = NULL;
          i2c_master_dev_handle_t dev_9554 = NULL;

          // UI
          lv_obj_t *lbl_clock    = NULL;
          lv_obj_t *lbl_date     = NULL;
          lv_obj_t *lbl_touch_xy = NULL;
          lv_obj_t *lbl_touch_st = NULL;
          lv_obj_t *lbl_boot     = NULL;
          lv_obj_t *lbl_pwr      = NULL;
          lv_obj_t *lbl_wifi     = NULL;
          lv_obj_t *lbl_ping     = NULL;
          lv_obj_t *lbl_tick     = NULL;
          lv_obj_t *lbl_audio    = NULL;
          lv_obj_t *touch_dot    = NULL;

          volatile bool g_boot_pressed = false;
          volatile bool g_pwr_pressed  = false;
          volatile int  g_tick         = 0;
          volatile int  g_audio_peak   = 0;
          volatile bool g_audio_data   = false;
          volatile int  g_rx_ok        = 0;
          volatile int  g_rx_total     = 0;

          char g_clock_str[16] = "--:--:--";
          char g_date_str[32]  = "-- --- ----";
          char g_wifi_str[64]  = "WiFi: conectare...";
          char g_ping_str[48]  = "Internet: --";
          char g_audio_str[64] = "Mic: peak=0 (zeros)";

          bool last_boot_state = HIGH;
          bool last_pwr_state  = HIGH;

          i2c_master_dev_handle_t get_dev(uint8_t addr) {
              i2c_master_dev_handle_t *slot = NULL;
              if (addr == 0x40) slot = &dev_7210;
              else if (addr == 0x18) slot = &dev_8311;
              else if (addr == 0x20) slot = &dev_9554;
              if (!slot) return NULL;
              if (*slot) return *slot;
              i2c_device_config_t cfg = {};
              cfg.dev_addr_length = I2C_ADDR_BIT_LEN_7;
              cfg.device_address = addr;
              cfg.scl_speed_hz = 100000;
              if (i2c_master_bus_add_device(i2c_bus, &cfg, slot) != ESP_OK) return NULL;
              return *slot;
          }

          bool i2c_write_reg(uint8_t addr, uint8_t reg, uint8_t val) {
              i2c_master_dev_handle_t dev = get_dev(addr);
              if (!dev) return false;
              uint8_t buf[2] = { reg, val };
              return i2c_master_transmit(dev, buf, 2, 100) == ESP_OK;
          }

          uint8_t i2c_read_reg(uint8_t addr, uint8_t reg) {
              i2c_master_dev_handle_t dev = get_dev(addr);
              if (!dev) return 0xFF;
              uint8_t val = 0;
              if (i2c_master_transmit_receive(dev, &reg, 1, &val, 1, 100) != ESP_OK) return 0xFF;
              return val;
          }

          bool i2s_init_tdm() {
              i2s_chan_config_t chan_cfg = I2S_CHANNEL_DEFAULT_CONFIG(I2S_NUM_0, I2S_ROLE_MASTER);
              if (i2s_new_channel(&chan_cfg, NULL, &rx_handle) != ESP_OK) return false;
              i2s_tdm_config_t tdm_cfg = {
                  .clk_cfg = I2S_TDM_CLK_DEFAULT_CONFIG(SAMPLE_RATE),
                  .slot_cfg = I2S_TDM_PHILIPS_SLOT_DEFAULT_CONFIG(
                      I2S_DATA_BIT_WIDTH_16BIT, I2S_SLOT_MODE_STEREO,
                      (i2s_tdm_slot_mask_t)(I2S_TDM_SLOT0 | I2S_TDM_SLOT1 | I2S_TDM_SLOT2 | I2S_TDM_SLOT3)
                  ),
                  .gpio_cfg = {
                      .mclk = (gpio_num_t)I2S_MCLK,
                      .bclk = (gpio_num_t)I2S_BCLK,
                      .ws   = (gpio_num_t)I2S_WS,
                      .dout = (gpio_num_t)I2S_DOUT,
                      .din  = (gpio_num_t)I2S_DIN,
                      .invert_flags = { .mclk_inv = false, .bclk_inv = false, .ws_inv = false }
                  }
              };
              tdm_cfg.clk_cfg.mclk_multiple = I2S_MCLK_MULTIPLE_256;
              if (i2s_channel_init_tdm_mode(rx_handle, &tdm_cfg) != ESP_OK) return false;
              if (i2s_channel_enable(rx_handle) != ESP_OK) return false;
              return true;
          }

          void es7210_init_regs() {
              Serial.println("[ES7210] Init");
              i2c_write_reg(0x40, 0x00, 0xFF); delay(20);
              i2c_write_reg(0x40, 0x00, 0x41);
              i2c_write_reg(0x40, 0x01, 0x1F);
              i2c_write_reg(0x40, 0x02, 0x00);
              i2c_write_reg(0x40, 0x08, 0x10);
              i2c_write_reg(0x40, 0x09, 0x30);
              i2c_write_reg(0x40, 0x0A, 0x30);
              i2c_write_reg(0x40, 0x11, 0x60);
              i2c_write_reg(0x40, 0x12, 0x02);
              i2c_write_reg(0x40, 0x13, 0xFF);
              i2c_write_reg(0x40, 0x14, 0xFF);
              i2c_write_reg(0x40, 0x15, 0xFF);
              i2c_write_reg(0x40, 0x16, 0xFF);
              i2c_write_reg(0x40, 0x41, 0x70);
              i2c_write_reg(0x40, 0x42, 0x70);
              Serial.println("[ES7210] Init done");
          }

          void diag_readback() {
              Serial.printf("[READBACK] ES7210 P=0x%02X F=0x%02X TDM=0x%02X G=0x%02X B12=0x%02X B34=0x%02X\n",
                  i2c_read_reg(0x40,0x00), i2c_read_reg(0x40,0x08), i2c_read_reg(0x40,0x12),
                  i2c_read_reg(0x40,0x13), i2c_read_reg(0x40,0x41), i2c_read_reg(0x40,0x42));
          }

          static void touch_event_cb(lv_event_t *e) {
              lv_event_code_t code = lv_event_get_code(e);
              lv_indev_t *indev = lv_indev_get_act();
              if (!indev || !lbl_touch_xy || !lbl_touch_st) return;
              lv_point_t p;
              lv_indev_get_point(indev, &p);
              char buf[40];
              lv_snprintf(buf, sizeof(buf), "X:%d  Y:%d", p.x, p.y);
              lv_label_set_text(lbl_touch_xy, buf);
              if (touch_dot) lv_obj_set_pos(touch_dot, p.x - 10, p.y - 10);
              if (code == LV_EVENT_PRESSED) {
                  lv_label_set_text(lbl_touch_st, "APASAT");
                  lv_obj_set_style_text_color(lbl_touch_st, lv_color_hex(0xFF0000), 0);
                  if (touch_dot) lv_obj_set_style_bg_color(touch_dot, lv_color_hex(0xFF0000), 0);
              } else if (code == LV_EVENT_RELEASED) {
                  lv_label_set_text(lbl_touch_st, "Eliberat");
                  lv_obj_set_style_text_color(lbl_touch_st, lv_color_hex(0x00AA00), 0);
                  if (touch_dot) lv_obj_set_style_bg_color(touch_dot, lv_color_hex(0x00AA00), 0);
              }
          }

          static void ui_update_cb(void *arg) {
              bool b = g_boot_pressed;
              bool p = g_pwr_pressed;
              bool ad = g_audio_data;

              if (lbl_boot) {
                  lv_label_set_text(lbl_boot, b ? "BOOT: APASAT" : "BOOT: liber");
                  lv_obj_set_style_text_color(lbl_boot, b ? lv_color_hex(0xFF0000) : lv_color_hex(0xFFFFFF), 0);
              }
              if (lbl_pwr) {
                  lv_label_set_text(lbl_pwr, p ? "PWR: APASAT" : "PWR: liber");
                  lv_obj_set_style_text_color(lbl_pwr, p ? lv_color_hex(0xFF0000) : lv_color_hex(0xFFFFFF), 0);
              }
              if (lbl_clock) lv_label_set_text(lbl_clock, g_clock_str);
              if (lbl_date)  lv_label_set_text(lbl_date, g_date_str);
              if (lbl_wifi)  lv_label_set_text(lbl_wifi, g_wifi_str);
              if (lbl_ping)  lv_label_set_text(lbl_ping, g_ping_str);
              if (lbl_tick) {
                  char tbuf[32]; snprintf(tbuf, sizeof(tbuf), "UI_CB:%d", g_tick);
                  lv_label_set_text(lbl_tick, tbuf);
              }
              if (lbl_audio) {
                  lv_label_set_text(lbl_audio, g_audio_str);
                  lv_obj_set_style_text_color(lbl_audio,
                      ad ? lv_color_hex(0x22C55E) : lv_color_hex(0xEF4444), 0);
              }
          }

          void build_ui() {
              pinMode(LCD_BL, OUTPUT);
              digitalWrite(LCD_BL, LOW);

              lvgl_port_lock(1000);
              lv_obj_t *scr = lv_screen_active();
              if (!scr) scr = lv_scr_act();
              if (!scr) { lvgl_port_unlock(); return; }

              lv_obj_clean(scr);
              lv_obj_set_style_bg_color(scr, lv_color_hex(0x0F172A), 0);
              lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, 0);

              lv_obj_t *title = lv_label_create(scr);
              lv_label_set_text(title, "Gemini OS v9");
              lv_obj_set_style_text_color(title, lv_color_hex(0x38BDF8), 0);
              lv_obj_set_style_text_font(title, &lv_font_montserrat_18, 0);
              lv_obj_align(title, LV_ALIGN_TOP_MID, 0, 10);

              lbl_clock = lv_label_create(scr);
              lv_label_set_text(lbl_clock, "--:--:--");
              lv_obj_set_style_text_color(lbl_clock, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_font(lbl_clock, &lv_font_montserrat_28, 0);
              lv_obj_align(lbl_clock, LV_ALIGN_TOP_MID, 0, 40);

              lbl_date = lv_label_create(scr);
              lv_label_set_text(lbl_date, "-- --- ----");
              lv_obj_set_style_text_color(lbl_date, lv_color_hex(0x94A3B8), 0);
              lv_obj_set_style_text_font(lbl_date, &lv_font_montserrat_12, 0);
              lv_obj_align(lbl_date, LV_ALIGN_TOP_MID, 0, 78);

              lbl_audio = lv_label_create(scr);
              lv_label_set_text(lbl_audio, "Mic: peak=0 (zeros)");
              lv_obj_set_style_text_color(lbl_audio, lv_color_hex(0xEF4444), 0);
              lv_obj_set_style_text_font(lbl_audio, &lv_font_montserrat_16, 0);
              lv_obj_align(lbl_audio, LV_ALIGN_TOP_MID, 0, 100);

              lbl_touch_xy = lv_label_create(scr);
              lv_label_set_text(lbl_touch_xy, "X:--  Y:--");
              lv_obj_set_style_text_color(lbl_touch_xy, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_font(lbl_touch_xy, &lv_font_montserrat_14, 0);
              lv_obj_align(lbl_touch_xy, LV_ALIGN_CENTER, 0, -40);

              lbl_touch_st = lv_label_create(scr);
              lv_label_set_text(lbl_touch_st, "Eliberat");
              lv_obj_set_style_text_color(lbl_touch_st, lv_color_hex(0x00AA00), 0);
              lv_obj_set_style_text_font(lbl_touch_st, &lv_font_montserrat_12, 0);
              lv_obj_align(lbl_touch_st, LV_ALIGN_CENTER, 0, -20);

              lbl_boot = lv_label_create(scr);
              lv_label_set_text(lbl_boot, "BOOT: liber");
              lv_obj_set_style_text_color(lbl_boot, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_font(lbl_boot, &lv_font_montserrat_14, 0);
              lv_obj_align(lbl_boot, LV_ALIGN_CENTER, 0, 5);

              lbl_pwr = lv_label_create(scr);
              lv_label_set_text(lbl_pwr, "PWR: liber");
              lv_obj_set_style_text_color(lbl_pwr, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_font(lbl_pwr, &lv_font_montserrat_14, 0);
              lv_obj_align(lbl_pwr, LV_ALIGN_CENTER, 0, 30);

              lbl_wifi = lv_label_create(scr);
              lv_label_set_text(lbl_wifi, "WiFi: conectare...");
              lv_obj_set_style_text_color(lbl_wifi, lv_color_hex(0x64748B), 0);
              lv_obj_set_style_text_font(lbl_wifi, &lv_font_montserrat_12, 0);
              lv_obj_align(lbl_wifi, LV_ALIGN_CENTER, 0, 60);

              lbl_ping = lv_label_create(scr);
              lv_label_set_text(lbl_ping, "Internet: --");
              lv_obj_set_style_text_color(lbl_ping, lv_color_hex(0x64748B), 0);
              lv_obj_set_style_text_font(lbl_ping, &lv_font_montserrat_12, 0);
              lv_obj_align(lbl_ping, LV_ALIGN_CENTER, 0, 85);

              lbl_tick = lv_label_create(scr);
              lv_label_set_text(lbl_tick, "UI_CB:0");
              lv_obj_set_style_text_color(lbl_tick, lv_color_hex(0x64748B), 0);
              lv_obj_set_style_text_font(lbl_tick, &lv_font_montserrat_12, 0);
              lv_obj_align(lbl_tick, LV_ALIGN_BOTTOM_MID, 0, -10);

              touch_dot = lv_obj_create(scr);
              lv_obj_set_size(touch_dot, 20, 20);
              lv_obj_set_style_radius(touch_dot, LV_RADIUS_CIRCLE, 0);
              lv_obj_set_style_bg_color(touch_dot, lv_color_hex(0x00AA00), 0);
              lv_obj_set_style_bg_opa(touch_dot, LV_OPA_80, 0);
              lv_obj_set_style_border_width(touch_dot, 0, 0);
              lv_obj_set_pos(touch_dot, 10, 10);

              lv_obj_add_event_cb(scr, touch_event_cb, LV_EVENT_PRESSED,  NULL);
              lv_obj_add_event_cb(scr, touch_event_cb, LV_EVENT_RELEASED, NULL);

              lvgl_port_unlock();
              Serial.println("[UI] Built");
          }

          void setup() {
              Serial.begin(115200);
              delay(500);
              Serial.println("\n[BOOT] BUILD v9-v41-plus-audio");
              Serial.println("=== Gemini OS v9 ===");

              pinMode(BOOT_BTN, INPUT_PULLUP);
              pinMode(PWR_BTN, INPUT_PULLUP);

              I2C_INIT_CALL
              delay(50);
              lvgl_port_init();
              delay(300);
              build_ui();

              if (i2c_master_get_bus_handle(0, &i2c_bus) != ESP_OK) {
                  Serial.println("[FATAL] I2C bus 0");
                  return;
              }

              // I2S first
              if (!i2s_init_tdm()) {
                  Serial.println("[FATAL] I2S");
                  return;
              }
              Serial.println("[I2S] TDM OK");
              delay(200);

              // ES7210 init
              es7210_init_regs();
              delay(100);
              diag_readback();

              Serial.println("[WiFi] Starting...");
              WiFi.mode(WIFI_STA);
              WiFi.setSleep(false);
              WiFi.begin(ssid, password);
          }

          void loop() {
              // Butoane
              bool b_raw = digitalRead(BOOT_BTN);
              bool p_raw = digitalRead(PWR_BTN);
              if (b_raw != last_boot_state) {
                  last_boot_state = b_raw;
                  g_boot_pressed = (b_raw == LOW);
                  Serial.printf("[BTN] BOOT: %s\n", g_boot_pressed ? "APASAT" : "ELIBERAT");
                  lv_async_call(ui_update_cb, NULL);
              }
              if (p_raw != last_pwr_state) {
                  last_pwr_state = p_raw;
                  g_pwr_pressed = (p_raw == LOW);
                  Serial.printf("[BTN] PWR: %s\n", g_pwr_pressed ? "APASAT" : "ELIBERAT");
                  lv_async_call(ui_update_cb, NULL);
              }

              // Audio read
              static unsigned long last_audio = 0;
              if (millis() - last_audio > 500) {
                  last_audio = millis();
                  static int16_t mic_buf[1024];
                  size_t br = 0;
                  esp_err_t err = i2s_channel_read(rx_handle, mic_buf, sizeof(mic_buf), &br, 100);
                  g_rx_total++;
                  if (err == ESP_OK && br > 0) {
                      int32_t peak = 0;
                      for (int i = 0; i < (int)(br/sizeof(int16_t)); i++) {
                          int32_t v = mic_buf[i];
                          if (v < 0) v = -v;
                          if (v > peak) peak = v;
                      }
                      g_audio_peak = (int)peak;
                      g_audio_data = (peak > 0);
                      if (peak > 0) g_rx_ok++;
                      snprintf(g_audio_str, sizeof(g_audio_str), "Mic: peak=%d %s",
                               (int)peak, peak > 0 ? "DATA!" : "(zeros)");
                      Serial.printf("[MIC] peak=%d rx=%d/%d RAW=%02X %02X %02X %02X\n",
                                    (int)peak, g_rx_ok, g_rx_total,
                                    ((uint8_t*)mic_buf)[0], ((uint8_t*)mic_buf)[1],
                                    ((uint8_t*)mic_buf)[2], ((uint8_t*)mic_buf)[3]);
                      lv_async_call(ui_update_cb, NULL);
                  }
              }

              // WiFi
              wl_status_t wstat = WiFi.status();
              if (wstat == WL_CONNECTED) {
                  static bool noted = false;
                  if (!noted) {
                      noted = true;
                      snprintf(g_wifi_str, sizeof(g_wifi_str), "WiFi: %s", WiFi.localIP().toString().c_str());
                      lv_async_call(ui_update_cb, NULL);
                  }
                  static bool ntp = false;
                  if (!ntp) {
                      ntp = true;
                      configTzTime("EET-2EEST,M3.5.0/3,M10.5.0/4", "pool.ntp.org", "time.google.com");
                  }
                  static unsigned long last_clock = 0;
                  if (millis() - last_clock > 1000) {
                      last_clock = millis();
                      struct tm ti;
                      if (getLocalTime(&ti, 50)) {
                          strftime(g_clock_str, sizeof(g_clock_str), "%H:%M:%S", &ti);
                          strftime(g_date_str, sizeof(g_date_str), "%d %b %Y", &ti);
                          lv_async_call(ui_update_cb, NULL);
                      }
                  }
                  static unsigned long last_ping = 0;
                  if (millis() - last_ping > 10000) {
                      last_ping = millis();
                      WiFiClient c;
                      unsigned long t0 = millis();
                      bool ok = c.connect("1.1.1.1", 53, 2000);
                      unsigned long lat = millis() - t0;
                      c.stop();
                      if (ok) {
                          snprintf(g_ping_str, sizeof(g_ping_str), "Internet: OK (%lu ms)", lat);
                          lv_async_call(ui_update_cb, NULL);
                      }
                  }
              } else {
                  snprintf(g_wifi_str, sizeof(g_wifi_str), "WiFi: conectare...");
              }

              // Tick
              static unsigned long last_tick = 0;
              if (millis() - last_tick > 500) {
                  last_tick = millis();
                  g_tick++;
                  lv_async_call(ui_update_cb, NULL);
              }

              delay(20);
          }
          ''').lstrip()

          ino = ino.replace("I2C_INIT_CALL", f"{i2c_init_func}();")

          with open(f"{sketch_dir}/10_LVGL_V9_Test.ino", "w", encoding="utf-8") as f:
              f.write(ino)
          print("[OK] Sketch generat")
          PYEOF

      - name: Compile
        run: |
          SKETCH_PATH="Arduino/examples/10_LVGL_V9_Test/10_LVGL_V9_Test.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-v9-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/gemini-v9-0x0.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gemini-v9
          path: package_bin/gemini-v9-0x0.bin
          if-no-files-found: error
