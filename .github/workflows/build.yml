name: Diagnostic - Repo Structure

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Show structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo ""
          echo "=== Arduino/ ==="
          ls -la Arduino/ 2>/dev/null || echo "(no Arduino dir)"
          echo ""
          echo "=== Arduino/examples/ ==="
          ls -la Arduino/examples/ 2>/dev/null || echo "(no examples)"
          echo ""
          echo "=== Search for .ino files ==="
          find . -name "*.ino" 2>/dev/null | head -50
          echo ""
          echo "=== Search for audio-related files ==="
          find . -iname "*audio*" 2>/dev/null | head -30
          echo ""
          echo "=== Search for esp_codec_dev ==="
          find . -iname "*codec*" 2>/dev/null | head -30
          echo ""
          echo "=== Search for es8311/es7210 ==="
          find . -iname "*8311*" -o -iname "*7210*" 2>/dev/null | head -30
