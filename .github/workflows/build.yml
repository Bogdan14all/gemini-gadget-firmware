name: Build Meta Muse Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Patch Layout and Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32
          
          echo "CONFIG_LV_FONT_MONTSERRAT_10=y" >> sdkconfig.defaults
          echo "CONFIG_LV_FONT_MONTSERRAT_12=y" >> sdkconfig.defaults
          
          OVERLAY=$(find devices/ -type f -name "*349*" | head -n 1)
          DEFAULTS="sdkconfig.defaults"
          [ -f "devices/sdkconfig.muse" ] && DEFAULTS="$DEFAULTS;devices/sdkconfig.muse"
          [ -n "$OVERLAY" ] && DEFAULTS="$DEFAULTS;$OVERLAY"
          
          # Fetch UI components before patching
          idf.py -B build-waveshare -DIDF_
