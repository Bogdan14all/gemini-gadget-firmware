name: Build Minimal Gemini OS (Bogdan Edition)

on:
  workflow_dispatch:

jobs:
  build-minimal:
    name: Build Minimal Gemini OS - Hello Bogdan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Waveshare Official V2 Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Setup Python & esptool
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool & zip
        run: |
          pip install esptool
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          # Instalam cel mai recent core ESP32 pentru a include noile headere I2C (i2c_master.h)
          arduino-cli core install esp32:esp32

      - name: Install Project Libraries
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino/libraries" ]; then
            cp -r Arduino/libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          # Asigurare biblioteci suplimentare necesare
          arduino-cli lib install "lvgl"@9.1.0 2>/dev/null || true

      - name: Configure Display to Show 'Gemini OS by Bogdan'
        shell: bash
        run: |
          # 1. Identificare sketch demo pentru ecran
          SKETCH_PATH=$(find Arduino -type f -name "*.ino" | grep -Ei "10_LVGL|lcd|display|demo" | head -n 1)
          if [ -z "$SKETCH_PATH" ]; then
            SKETCH_PATH=$(find Arduino -type f -name "*.ino" | head -n 1)
          fi
          echo "Sketch identificat: $SKETCH_PATH"
          SKETCH_DIR=$(dirname "$SKETCH_PATH")

          # 2. Asigurare compatibilitate i2c_master.h pe orice versiune de core
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.c" \) -exec sed -i 's/driver\/i2c_master.h/driver\/i2c.h/g' {} + 2>/dev/null || true

          # 3. Patch pe sketch pentru a afisa exact textul dorit: "Gemini OS by Bogdan"
          python3 - << 'PYEOF'
          import os, glob

          sketch_path = os.environ.get("SKETCH_PATH", "")
          if not sketch_path:
              ino_files = glob.glob("Arduino/**/*.ino", recursive=True)
              for f in ino_files:
                  if "10_LVGL" in f or "lcd" in f.lower() or "display" in f.lower():
                      sketch_path = f
                      break
              if not sketch_path and ino_files:
                  sketch_path = ino_files[0]

          print(f"Modificare sketch: {sketch_path}")
          with open(sketch_path, "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          custom_screen_func = """
          // ==========================================
          // ECRAN PERSONALIZAT: GEMINI OS BY BOGDAN
          // ==========================================
          void show_bogdan_screen() {
              pinMode(1, OUTPUT);
              digitalWrite(1, HIGH); // Backlight GPIO 1 pentru Hardware V2

              lv_obj_t *scr = lv_scr_act();
              lv_obj_set_style_bg_color(scr, lv_color_hex(0x0A0E17), 0);

              // 1. Text Principal Mare: "Gemini OS by Bogdan"
              lv_obj_t *lbl_title = lv_label_create(scr);
              lv_label_set_text(lbl_title, "Gemini OS by Bogdan");
              lv_obj_set_style_text_color(lbl_title, lv_color_hex(0x00E5FF), 0);
              lv_obj_center(lbl_title);

              // 2. Subtitlu Stare: "Boot OK | Waveshare 3.49 V2"
              lv_obj_t *lbl_sub = lv_label_create(scr);
              lv_label_set_text(lbl_sub, "Boot OK | Waveshare 3.49 V2");
              lv_obj_set_style_text_color(lbl_sub, lv_color_hex(0x22C55E), 0);
              lv_obj_align(lbl_sub, LV_ALIGN_CENTER, 0, 32);
          }
          """

          # Inseram functia noastra inainte de setup()
          if "show_bogdan_screen" not in content:
              setup_idx = content.find("void setup()")
              if setup_idx != -1:
                  content = content[:setup_idx] + custom_screen_func + "\n" + content[setup_idx:]
              else:
                  content = custom_screen_func + "\n" + content

          # In setup(), apelam show_bogdan_screen() la finalul initializarii
          setup_body_start = content.find("void setup()")
          if setup_body_start != -1:
              brace_start = content.find("{", setup_body_start)
              if brace_start != -1:
                  # Gasim sfarsitul functiei setup()
                  open_braces = 1
                  i = brace_start + 1
                  while i < len(content) and open_braces > 0:
                      if content[i] == '{':
                          open_braces += 1
                      elif content[i] == '}':
                          open_braces -= 1
                      i += 1
                  setup_end = i - 1
                  content = content[:setup_end] + "\n    show_bogdan_screen();\n" + content[setup_end:]

          with open(sketch_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Sketch actualizat cu succes pentru a afisa 'Gemini OS by Bogdan'!")
          PYEOF

      - name: Compile Minimal Firmware
        run: |
          SKETCH_PATH=$(find Arduino -type f -name "*.ino" | grep -Ei "10_LVGL|lcd|display|demo" | head -n 1)
          if [ -z "$SKETCH_PATH" ]; then
            SKETCH_PATH=$(find Arduino -type f -name "*.ino" | head -n 1)
          fi
          echo "Compilare sketch: $SKETCH_PATH"

          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi"
          echo "Utilizare FQBN: $FQBN"

          arduino-cli compile --fqbn "$FQBN" \
            --output-dir build_output \
            "$SKETCH_PATH"

      - name: Merge into Single .bin & Create Clean ZIP
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)

          echo "Bootloader (0x0): $BOOTLOADER"
          echo "Partitions (0x8000): $PARTITIONS"
          echo "App (0x10000): $APP_BIN"

          # Imbinare sigura la offset-urile hardware native ESP32-S3
          esptool.py --chip esp32s3 merge_bin \
            -o package_bin/gemini-os-full-0x0.bin \
            --flash_mode keep \
            --flash_size 16MB \
            --flash_freq 80m \
            0x0 "$BOOTLOADER" \
            0x8000 "$PARTITIONS" \
            0x10000 "$APP_BIN"

          # Arhivare: doar fisierul .bin unic in arhiva zip
          cd package_bin
          zip gemini-os-firmware-0x0.zip gemini-os-full-0x0.bin
          cd ..

      - name: Upload Single-Bin ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-firmware-0x0
          path: package_bin/gemini-os-firmware-0x0.zip
          if-no-files-found: error
