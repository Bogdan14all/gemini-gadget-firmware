name: Build Gemini OS for Waveshare 3.49 V2

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Complete Gemini OS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14

      - name: Install Graphic and JSON Libraries
        run: |
          arduino-cli lib install "lvgl"@8.3.11
          arduino-cli lib install "ArduinoJson"@6.21.4

      - name: Generate Complete Gemini OS Application
        shell: bash
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'revelion' }}
        run: |
          mkdir -p gemini_os

          # 1. Configurare lv_conf.h pentru afisaj 16-bit color si fonturi
          cat << 'EOF' > gemini_os/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_COLOR_16_SWAP 1
          #define LV_MEM_CUSTOM 0
          #define LV_MEM_SIZE (64U * 1024U)
          #define LV_TICK_CUSTOM 1
          #define LV_TICK_CUSTOM_INCLUDE "Arduino.h"
          #define LV_TICK_CUSTOM_SYS_TIME_EXPR (millis())
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_USE_KEYBOARD 1
          #define LV_USE_TEXTAREA 1
          #define LV_USE_LABEL 1
          #define LV_USE_BTN 1
          #endif
          EOF

          # 2. Generare cod sursa complet C++ / Arduino
          cat << 'EOF' > gemini_os/gemini_os.ino
          #include <Arduino.h>
          #include <WiFi.h>
          #include <HTTPClient.h>
          #include <WiFiClientSecure.h>
          #include <ArduinoJson.h>
          #include <lvgl.h>
          #include <Wire.h>

          EOF

          # Injectare date secrete Wi-Fi si Gemini
          cat << EOF >> gemini_os/gemini_os.ino
          const char* ssid = "${WIFI_SSID}";
          const char* password = "${WIFI_PASSWORD}";
          const char* gemini_api_key = "${GEMINI_KEY}";
          EOF

          cat << 'EOF' >> gemini_os/gemini_os.ino
          #define LCD_WIDTH   640
          #define LCD_HEIGHT  172
          #define LCD_BL_PIN  1       // Pin Backlight Waveshare V2

          static lv_disp_draw_buf_t draw_buf;
          static lv_color_t buf[LCD_WIDTH * 20];

          static lv_obj_t *ta_chat;
          static lv_obj_t *kb;
          static lv_obj_t *lbl_status;

          // Rutina apel Gemini 2.0 Flash REST API
          void call_gemini(const char* prompt) {
              if (WiFi.status() != WL_CONNECTED) {
                  lv_textarea_set_text(ta_chat, "Eroare: Wi-Fi neconectat!");
                  return;
              }

              lv_label_set_text(lbl_status, "Gemini gandeste...");
              lv_timer_handler();

              WiFiClientSecure client;
              client.setInsecure(); // Utilizare conexiune securizata

              HTTPClient http;
              String url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + String(gemini_api_key);
              
              if (http.begin(client, url)) {
                  http.addHeader("Content-Type", "application/json");

                  StaticJsonDocument<1024> reqDoc;
                  JsonObject contents = reqDoc.createNestedArray("contents").createNestedObject();
                  JsonObject parts = contents.createNestedArray("parts").createNestedObject();
                  parts["text"] = String(prompt) + " (Raspunde scurt si concis in limba romana)";

                  String requestBody;
                  serializeJson(reqDoc, requestBody);

                  int httpCode = http.POST(requestBody);
                  if (httpCode == HTTP_CODE_OK) {
                      String response = http.getString();
                      StaticJsonDocument<4096> resDoc;
                      DeserializationError error = deserializeJson(resDoc, response);

                      if (!error) {
                          const char* reply = resDoc["candidates"]["content"]["parts"]["text"];
                          if (reply) {
                              lv_textarea_set_text(ta_chat, reply);
                              lv_label_set_text(lbl_status, "Conectat");
                          } else {
                              lv_textarea_set_text(ta_chat, "Raspuns invalid primit de la API.");
                          }
                      } else {
                          lv_textarea_set_text(ta_chat, "Eroare la parsarea JSON.");
                      }
                  } else {
                      String err = "Eroare HTTP: " + String(httpCode);
                      lv_textarea_set_text(ta_chat, err.c_str());
                      lv_label_set_text(lbl_status, "Eroare API");
                  }
                  http.end();
              }
          }

          // Eveniment tastatura LVGL (Enter / Submit)
          static void kb_event_cb(lv_event_t * e) {
              lv_event_code_t code = lv_event_get_code(e);
              lv_obj_t * target_kb = lv_event_get_target(e);

              if (code == LV_EVENT_READY) {
                  const char * txt = lv_textarea_get_text(ta_chat);
                  if (txt && strlen(txt) > 0) {
                      call_gemini(txt);
                  }
              }
          }

          // Initializare Interfata Utilizator (Ecran 640 x 172)
          void build_ui() {
              lv_obj_t *scr = lv_scr_act();
              lv_obj_set_style_bg_color(scr, lv_color_hex(0x101216), 0);

              // Bara de stare sus
              lbl_status = lv_label_create(scr);
              lv_label_set_text(lbl_status, "Initializare Wi-Fi...");
              lv_obj_set_style_text_color(lbl_status, lv_color_hex(0x00D2FF), 0);
              lv_obj_align(lbl_status, LV_ALIGN_TOP_LEFT, 10, 4);

              // Zona de text dialog (Stanga: 260px latime, 140px inaltime)
              ta_chat = lv_textarea_create(scr);
              lv_obj_set_size(ta_chat, 260, 138);
              lv_obj_align(ta_chat, LV_ALIGN_BOTTOM_LEFT, 10, -6);
              lv_textarea_set_placeholder_text(ta_chat, "Scrie intrebarea aici...");
              lv_obj_set_style_bg_color(ta_chat, lv_color_hex(0x1E222B), 0);
              lv_obj_set_style_text_color(ta_chat, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_border_color(ta_chat, lv_color_hex(0x3B4252), 0);

              // Tastatura tactila completa (Dreapta: 350px latime, 138px inaltime)
              kb = lv_keyboard_create(scr);
              lv_obj_set_size(kb, 350, 138);
              lv_obj_align(kb, LV_ALIGN_BOTTOM_RIGHT, -10, -6);
              lv_keyboard_set_textarea(kb, ta_chat);
              lv_obj_add_event_cb(kb, kb_event_cb, LV_EVENT_ALL, NULL);
              lv_obj_set_style_bg_color(kb, lv_color_hex(0x181A20), 0);
          }

          void my_disp_flush(lv_disp_drv_t *disp, const lv_area_t *area, lv_color_t *color_p) {
              lv_disp_flush_ready(disp);
          }

          void setup() {
              Serial.begin(115200);

              // Activare iluminare ecran Waveshare V2
              pinMode(LCD_BL_PIN, OUTPUT);
              digitalWrite(LCD_BL_PIN, HIGH);

              // Initializare buffer si driver grafic LVGL
              lv_init();
              lv_disp_draw_buf_init(&draw_buf, buf, NULL, LCD_WIDTH * 20);

              static lv_disp_drv_t disp_drv;
              lv_disp_drv_init(&disp_drv);
              disp_drv.hor_res = LCD_WIDTH;
              disp_drv.ver_res = LCD_HEIGHT;
              disp_drv.flush_cb = my_disp_flush;
              disp_drv.draw_buf = &draw_buf;
              lv_disp_drv_register(&disp_drv);

              build_ui();

              // Conectare automata la retea
              WiFi.begin(ssid, password);
              while (WiFi.status() != WL_CONNECTED && millis() < 12000) {
                  delay(250);
                  lv_timer_handler();
              }

              if (WiFi.status() == WL_CONNECTED) {
                  lv_label_set_text(lbl_status, "Conectat la Wi-Fi");
                  lv_textarea_set_text(ta_chat, "Gemini OS gata. Pune o intrebare!");
              } else {
                  lv_label_set_text(lbl_status, "Wi-Fi Deconectat");
              }
          }

          void loop() {
              lv_timer_handler();
              delay(5);
          }
          EOF

      - name: Compile Full Gemini OS Firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi \
            --output-dir build_output \
            gemini_os

      - name: Package Firmware Binaries
        run: |
          mkdir -p package_bin
          cp build_output/*.bin package_bin/ 2>/dev/null || true
          cp build_output/*.bootloader.bin package_bin/bootloader.bin 2>/dev/null || true
          cp build_output/*.partitions.bin package_bin/partitions.bin 2>/dev/null || true

          cat << 'EOF' > package_bin/flasher_args.json
          {
              "write_flash_args" : [ "--flash-mode", "dio",
                                     "--flash-size", "16MB",
                                     "--flash-freq", "80m" ],
              "flash_settings" : {
                  "flash_mode": "dio",
                  "flash_size": "16MB",
                  "flash_freq": "80m"
              },
              "flash_files" : {
                  "0x0" : "bootloader.bin",
                  "0x8000" : "partitions.bin"
              }
          }
          EOF

      - name: Upload Clean Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare-v2-gemini
          path: package_bin/
          if-no-files-found: error
