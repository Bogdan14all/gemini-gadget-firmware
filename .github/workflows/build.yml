name: Build Gemini AI Firmware (REST & Auto-WiFi)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 Gemini Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Waveshare 3.49 Port
        uses: actions/checkout@v4
        with:
          repository: Eatin/muse-gadget-waveshare-349
          submodules: recursive

      - name: Integrate Auto-WiFi, Async REST & UI Fixes
        shell: bash
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'revelion' }}
        run: |
          cat << 'EOF' > patch_gemini.py
          import os, re

          gemini_key = os.environ.get("GEMINI_KEY", "").strip()
          wifi_ssid = os.environ.get("WIFI_SSID", "TP-Link_2.4G_9318_Guest").strip()
          wifi_pass = os.environ.get("WIFI_PASSWORD", "revelion").strip()

          print(f"=== Configurare Auto-WiFi ({wifi_ssid}) & Gemini REST Engine ===")

          gemini_c_code = f"""
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include "esp_log.h"
          #include "esp_http_client.h"
          #include "esp_crt_bundle.h"
          #include "cJSON.h"
          #include "mbedtls/base64.h"
          #include "nvs_flash.h"
          #include "nvs.h"
          #include "esp_wifi.h"
          #include "esp_event.h"
          #include "esp_heap_caps.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "lvgl.h"

          static const char *TAG_G = "GEMINI_REST";
          static const char *G_KEY = "{gemini_key}";
          static const char *W_SSID = "{wifi_ssid}";
          static const char *W_PASS = "{wifi_pass}";

          static lv_obj_t *g_status_label = NULL;
          static char g_last_status[64] = "Asteptare Wi-Fi...";

          void gemini_register_status_label(lv_obj_t *label) {{
              g_status_label = label;
              if (g_status_label) lv_label_set_text(g_status_label, g_last_status);
          }}

          static void* safe_alloc(size_t size) {{
              void *ptr = heap_caps_malloc(size, MALLOC_CAP_SPIRAM | MALLOC_CAP_8BIT);
              if (!ptr) ptr = malloc(size);
              return ptr;
          }}

          bool gemini_test_api_key(char *out_msg, size_t out_len) {{
              if (!G_KEY || strlen(G_KEY) < 10) {{
                  snprintf(g_last_status, sizeof(g_last_status), "Cheie API lipsa");
                  if (g_status_label) lv_label_set_text(g_status_label, g_last_status);
                  if (out_msg) strncpy(out_msg, g_last_status, out_len);
                  return false;
              }}
              char url[320];
              snprintf(url, sizeof(url), "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash?key=%s", G_KEY);
              esp_http_client_config_t config = {{
                  .url = url,
                  .method = HTTP_METHOD_GET,
                  .crt_bundle_attach = esp_crt_bundle_attach,
                  .timeout_ms = 8000
              }};
              esp_http_client_handle_t client = esp_http_client_init(&config);
              esp_err_t err = esp_http_client_perform(client);
              int status = esp_http_client_get_status_code(client);
              esp_http_client_cleanup(client);

              if (err == ESP_OK && status == 200) {{
                  snprintf(g_last_status, sizeof(g_last_status), "Gemini OK (Validat)");
                  if (g_status_label) lv_label_set_text(g_status_label, g_last_status);
                  if (out_msg) strncpy(out_msg, g_last_status, out_len);
                  return true;
              }}
              snprintf(g_last_status, sizeof(g_last_status), "Eroare Gemini (HTTP %d)", status);
              if (g_status_label) lv_label_set_text(g_status_label, g_last_status);
              if (out_msg) strncpy(out_msg, g_last_status, out_len);
              return false;
          }}

          static void gemini_auto_test_task(void *pvParameters) {{
              vTaskDelay(pdMS_TO_TICKS(2500));
              gemini_test_api_key(NULL, 0);
              vTaskDelete(NULL);
          }}

          static void ip_event_handler(void* arg, esp_event_base_t event_base, int32_t event_id, void* event_data) {{
              if (event_base == IP_EVENT && event_id == IP_EVENT_STA_GOT_IP) {{
                  snprintf(g_last_status, sizeof(g_last_status), "Testare Gemini...");
                  if (g_status_label) lv_label_set_text(g_status_label, g_last_status);
                  xTaskCreate(gemini_auto_test_task, "gem_test", 4096, NULL, 5, NULL);
              }}
          }}

          void gemini_ui_test_btn_cb(lv_event_t * e) {{
              if (lv_event_get_code(e) == LV_EVENT_CLICKED) {{
                  if (g_status_label) lv_label_set_text(g_status_label, "Testare...");
                  gemini_test_api_key(NULL, 0);
              }}
          }}

          void gemini_auto_init_nvs(void) {{
              nvs_handle_t h;
              if (nvs_open("wifi", NVS_READWRITE, &h) == ESP_OK) {{
                  nvs_set_str(h, "ssid", W_SSID);
                  nvs_set_str(h, "password", W_PASS);
                  nvs_commit(h); nvs_close(h);
              }}
              if (nvs_open("muse", NVS_READWRITE, &h) == ESP_OK) {{
                  nvs_set_str(h, "token", G_KEY);
                  nvs_set_str(h, "device_token", G_KEY);
                  nvs_set_str(h, "api_key", G_KEY);
                  nvs_set_str(h, "server", "generativelanguage.googleapis.com");
                  nvs_set_u8(h, "paired", 1);
                  nvs_set_u8(h, "activated", 1);
                  nvs_commit(h); nvs_close(h);
              }}
              wifi_config_t wcfg;
              memset(&wcfg, 0, sizeof(wcfg));
              strncpy((char*)wcfg.sta.ssid, W_SSID, sizeof(wcfg.sta.ssid));
              strncpy((char*)wcfg.sta.password, W_PASS, sizeof(wcfg.sta.password));
              wcfg.sta.threshold.authmode = WIFI_AUTH_WPA2_PSK;
              esp_wifi_set_config(WIFI_IF_STA, &wcfg);
              esp_event_handler_instance_register(IP_EVENT, IP_EVENT_STA_GOT_IP, &ip_event_handler, NULL, NULL);
              esp_wifi_connect();
          }}

          typedef struct {{
              uint8_t *pcm_data;
              size_t pcm_len;
          }} gemini_audio_task_args_t;

          static void gemini_process_audio_task(void *arg) {{
              gemini_audio_task_args_t *args = (gemini_audio_task_args_t*)arg;
              size_t wav_len = 44 + args->pcm_len;
              uint8_t *wav_buf = (uint8_t*)safe_alloc(wav_len);
              
              if (wav_buf) {{
                  memcpy(wav_buf, "RIFF", 4); uint32_t f_sz = wav_len - 8; memcpy(wav_buf + 4, &f_sz, 4);
                  memcpy(wav_buf + 8, "WAVEfmt ", 8); uint32_t s_sz = 16; uint16_t af = 1, nc = 1; uint32_t sr = 16000, br = 32000;
                  uint16_t ba = 2, bps = 16; memcpy(wav_buf + 16, &s_sz, 4); memcpy(wav_buf + 20, &af, 2); memcpy(wav_buf + 22, &nc, 2);
                  memcpy(wav_buf + 24, &sr, 4); memcpy(wav_buf + 28, &br, 4); memcpy(wav_buf + 32, &ba, 2); memcpy(wav_buf + 34, &bps, 2);
                  memcpy(wav_buf + 36, "data", 4); uint32_t d_sz = args->pcm_len; memcpy(wav_buf + 40, &d_sz, 4);
                  memcpy(wav_buf + 44, args->pcm_data, args->pcm_len);

                  size_t b64_len = ((wav_len + 2) / 3) * 4 + 1;
                  char *b64_str = (char*)safe_alloc(b64_len);
                  if (b64_str) {{
                      size_t olen = 0; mbedtls_base64_encode((unsigned char *)b64_str, b64_len, &olen, wav_buf, wav_len);
                      b64_str[olen] = '\0';
                      free(wav_buf); wav_buf = NULL;

                      cJSON *r = cJSON_CreateObject(); cJSON *c = cJSON_AddArrayToObject(r, "contents");
                      cJSON *ci = cJSON_CreateObject(); cJSON_AddItemToArray(c, ci); cJSON *p = cJSON_AddArrayToObject(ci, "parts");
                      cJSON *ap = cJSON_CreateObject(); cJSON *id = cJSON_AddObjectToObject(ap, "inline_data");
                      cJSON_AddStringToObject(id, "mime_type", "audio/wav"); cJSON_AddStringToObject(id, "data", b64_str);
                      cJSON_AddItemToArray(p, ap);
                      cJSON *tp = cJSON_CreateObject(); cJSON_AddStringToObject(tp, "text", "Raspunde scurt in limba romana.");
                      cJSON_AddItemToArray(p, tp);

                      char *pd = cJSON_PrintUnformatted(r);
                      cJSON_Delete(r); free(b64_str);

                      char url[320]; snprintf(url, sizeof(url), "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=%s", G_KEY);
                      esp_http_client_config_t cfg = {{ .url = url, .method = HTTP_METHOD_POST, .crt_bundle_attach = esp_crt_bundle_attach, .timeout_ms = 20000 }};
                      esp_http_client_handle_t cl = esp_http_client_init(&cfg);
                      esp_http_client_set_header(cl, "Content-Type", "application/json");
                      esp_http_client_set_post_field(cl, pd, strlen(pd));
                      
                      esp_http_client_perform(cl);
                      free(pd); esp_http_client_cleanup(cl);
                  }}
                  if(wav_buf) free(wav_buf);
              }}
              free(args->pcm_data); free(args);
              vTaskDelete(NULL);
          }}

          char* gemini_query_audio(const uint8_t *pcm_data, size_t pcm_len) {{
              if (!pcm_data || pcm_len == 0) return strdup("Fara semnal.");
              if (strlen(G_KEY) < 10) return strdup("Eroare: Cheie lipsa.");
              gemini_audio_task_args_t *args = safe_alloc(sizeof(gemini_audio_task_args_t));
              args->pcm_data = safe_alloc(pcm_len);
              memcpy(args->pcm_data, pcm_data, pcm_len);
              args->pcm_len = pcm_len;
              xTaskCreate(gemini_process_audio_task, "g_audio_req", 8192, args, 5, NULL);
              return strdup("Procesare...");
          }}
          """

          os.makedirs("esp32/components/muse/src", exist_ok=True)
          with open("esp32/components/muse/src/gemini_engine.c", "w", encoding="utf-8") as f:
              f.write(gemini_c_code)

          for root, dirs, files in os.walk("esp32"):
              dirs[:] = [d for d in dirs if d not in ("managed_components", "build-waveshare", "build", ".git")]
              for file in files:
                  if not file.endswith((".c", ".cpp", ".h")): continue
                  p = os.path.join(root, file)
                  try:
                      with open(p, "r", encoding="utf-8", errors="ignore") as f: s = f.read()
                      orig = s
                      
                      # Injectare initializare
                      if "app_main(" in s and "gemini_auto_init_nvs" not in s:
                          s = 'void gemini_auto_init_nvs(void);\n' + s
                          s = re.sub(r'(nvs_flash_init\(\);)', r'\1\n    gemini_auto_init_nvs();', s)
                      
                      # Bypass strict Muse
                      s = re.sub(r'bool\s+muse_is_paired\s*\([^)]*\)\s*\{[^}]*\}', 'bool muse_is_paired(void) { return true; }', s)
                      s = re.sub(r'bool\s+muse_is_activated\s*\([^)]*\)\s*\{[^}]*\}', 'bool muse_is_activated(void) { return true; }', s)
                      s = re.sub(r'bool\s+muse_app_is_paired\s*\([^)]*\)\s*\{[^}]*\}', 'bool muse_app_is_paired(void) { return true; }', s)
                      
                      # Redenumiri curate
                      s = s.replace("hatch.metaaivm.com", "generativelanguage.googleapis.com")
                      s = s.replace("api.sensenova.cn", "generativelanguage.googleapis.com")
                      s = s.replace("iat-api.xfyun.cn", "generativelanguage.googleapis.com")
                      
                      if gemini_key:
                          s = re.sub(r'(lv_textarea_set_text\s*\(\s*[^,;]*(?:token|key)[^,;]*\s*,\s*)[^)]+(\);)', rf'\1"{gemini_key}"\2', s, flags=re.IGNORECASE)
                      s = re.sub(r'(lv_textarea_set_text\s*\(\s*[^,;]*(?:pwd|password)[^,;]*\s*,\s*)[^)]+(\);)', rf'\1"{wifi_pass}"\2', s, flags=re.IGNORECASE)
                      s = re.sub(r'(lv_textarea_set_text\s*\(\s*[^,;]*ssid[^,;]*\s*,\s*)[^)]+(\);)', rf'\1"{wifi_ssid}"\2', s, flags=re.IGNORECASE)

                      s = s.replace('"Test connection"', '"Test Gemini Key"')
                      s = s.replace('"Device token"', '"Gemini Key"')
                      s = s.replace('"Server"', '"Backend"')
                      s = s.replace("Not paired", "Gemini Ready")
                      s = s.replace("not paired", "Gemini Ready")
                      s = s.replace("Ready to pair", "Gemini Ready")
                      s = s.replace("Pair with the Muse app", "Gemini 2.0 Flash Standalone")
                      s = s.replace("SenseNova", "Google Gemini")
                      s = s.replace("iFlytek", "Google Gemini")
                      s = s.replace("Muse app:", "Status:")
                      s = s.replace("Muse App:", "Status:")
                      s = s.replace('"Muse"', '"Gemini AI"')
                      s = s.replace('"MUSE"', '"Gemini AI"')
                      
                      # Conectare callback buton
                      if "Test Gemini Key" in s or "Test connection" in orig:
                          s = 'void gemini_ui_test_btn_cb(lv_event_t * e);\nvoid gemini_register_status_label(lv_obj_t *label);\n' + s
                          s = re.sub(r'lv_obj_add_event_cb\s*\(\s*([a-zA-Z0-9_>.-]*(?:test|btn)[a-zA-Z0-9_>.-]*)\s*,\s*[^,]+\s*,\s*LV_EVENT_CLICKED\s*,\s*([^)]+)\);',
                                     r'gemini_register_status_label((lv_obj_t*)\2); lv_obj_add_event_cb(\1, gemini_ui_test_btn_cb, LV_EVENT_CLICKED, \2);', s)

                      if s != orig:
                          with open(p, "w", encoding="utf-8") as f: f.write(s)
                  except Exception as e: pass
          EOF
          python3 patch_gemini.py

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32
          echo "target_compile_options(\${COMPONENT_LIB} PRIVATE -Wno-error)" >> components/muse/CMakeLists.txt || true
          sed -i 's/SRCS /SRCS "src\/gemini_engine.c" /g' components/muse/CMakeLists.txt || true
          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 build

      - name: Package Firmware Files (.bin)
        shell: bash
        run: |
          mkdir -p package_bin
          cp esp32/build-waveshare/bootloader/bootloader.bin package_bin/ 2>/dev/null || true
          cp esp32/build-waveshare/partition_table/partition-table.bin package_bin/ 2>/dev/null || true
          cp esp32/build-waveshare/ota_data_initial.bin package_bin/ 2>/dev/null || true
          cp esp32/build-waveshare/muse-gadget.bin package_bin/ 2>/dev/null || true
          cat << 'EOF' > package_bin/flasher_args.json
          { "write_flash_args" : [ "--flash-mode", "dio", "--flash-size", "keep", "--flash-freq", "80m" ], "flash_settings" : { "flash_mode": "dio", "flash_size": "keep", "flash_freq": "80m" }, "flash_files" : { "0x0" : "bootloader.bin", "0x10000" : "partition-table.bin", "0x1d000" : "ota_data_initial.bin", "0x20000" : "muse-gadget.bin" } }
          EOF

      - name: Upload Single ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare-349
          path: package_bin/
