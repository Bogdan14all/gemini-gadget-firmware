name: Build Waveshare V2 Gemini OS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Gemini OS
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Official Waveshare V2 Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Configure Clean Gemini OS Application
        shell: bash
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'revelion' }}
        run: |
          pip install esptool

          DEMO_DIR=$(find . -maxdepth 3 -type f -name "CMakeLists.txt" | grep -Ei "demo|lvgl|lcd|touch|display" | head -n 1 | xargs -r dirname)
          if [ -z "$DEMO_DIR" ]; then
            DEMO_DIR=$(find ESP-IDF -maxdepth 2 -type f -name "CMakeLists.txt" | head -n 1 | xargs -r dirname 2>/dev/null || true)
          fi
          if [ -z "$DEMO_DIR" ]; then
            DEMO_DIR="."
          fi
          echo "Director proiect Waveshare: $DEMO_DIR"

          mkdir -p "$DEMO_DIR/main"

          cat << 'EOF' > "$DEMO_DIR/main/gemini_os.c"
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include "esp_log.h"
          #include "esp_http_client.h"
          #include "esp_crt_bundle.h"
          #include "nvs_flash.h"
          #include "nvs.h"
          #include "esp_wifi.h"
          #include "esp_event.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"

          static const char *TAG = "GEMINI_OS";
          EOF

          cat << EOF >> "$DEMO_DIR/main/gemini_os.c"
          static const char *GEMINI_API_KEY = "${GEMINI_KEY}";
          static const char *WIFI_SSID_CFG = "${WIFI_SSID}";
          static const char *WIFI_PASS_CFG = "${WIFI_PASSWORD}";
          EOF

          cat << 'EOF' >> "$DEMO_DIR/main/gemini_os.c"
          static bool s_mic_muted = false;

          void gemini_set_mic_mute(bool mute) {
              s_mic_muted = mute;
              ESP_LOGI(TAG, "Microfon stare: %s", mute ? "MUTED" : "ACTIV");
          }

          bool gemini_get_mic_mute(void) {
              return s_mic_muted;
          }

          void gemini_call_api(const char *prompt) {
              if (!prompt || strlen(prompt) == 0) return;

              char url[256];
              snprintf(url, sizeof(url), "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=%s", GEMINI_API_KEY);

              char post_data[1024];
              snprintf(post_data, sizeof(post_data),
                       "{\"contents\":[{\"parts\":[{\"text\":\"%s (Raspunde scurt in limba romana)\"}]}]}",
                       prompt);

              esp_http_client_config_t config = {
                  .url = url,
                  .method = HTTP_METHOD_POST,
                  .crt_bundle_attach = esp_crt_bundle_attach,
                  .timeout_ms = 18000,
                  .buffer_size = 4096,
                  .buffer_size_tx = 4096,
              };
              esp_http_client_handle_t client = esp_http_client_init(&config);
              esp_http_client_set_header(client, "Content-Type", "application/json");
              esp_http_client_set_post_field(client, post_data, strlen(post_data));

              esp_err_t err = esp_http_client_perform(client);
              int status = esp_http_client_get_status_code(client);
              if (err == ESP_OK && status == 200) {
                  ESP_LOGI(TAG, "Raspuns primit de la Gemini 2.0 Flash.");
              } else {
                  ESP_LOGE(TAG, "Eroare comunicare Gemini: HTTP %d", status);
              }
              esp_http_client_cleanup(client);
          }

          static void wifi_event_handler(void* arg, esp_event_base_t event_base,
                                         int32_t event_id, void* event_data) {
              if (event_base == IP_EVENT && event_id == IP_EVENT_STA_GOT_IP) {
                  ESP_LOGI(TAG, "Wi-Fi Conectat cu succes! Test apel Gemini...");
                  gemini_call_api("Salut! Confirma conexiunea.");
              }
          }

          void gemini_init_system(void) {
              esp_err_t ret = nvs_flash_init();
              if (ret == ESP_ERR_NVS_NO_FREE_PAGES || ret == ESP_ERR_NVS_NEW_VERSION_FOUND) {
                  nvs_flash_erase();
                  nvs_flash_init();
              }

              esp_netif_init();
              esp_event_loop_create_default();
              esp_netif_create_default_wifi_sta();

              wifi_init_config_t cfg = WIFI_INIT_CONFIG_DEFAULT();
              esp_wifi_init(&cfg);

              esp_event_handler_instance_register(IP_EVENT, IP_EVENT_STA_GOT_IP, &wifi_event_handler, NULL, NULL);

              wifi_config_t wifi_config;
              memset(&wifi_config, 0, sizeof(wifi_config));
              strncpy((char*)wifi_config.sta.ssid, WIFI_SSID_CFG, sizeof(wifi_config.sta.ssid));
              strncpy((char*)wifi_config.sta.password, WIFI_PASS_CFG, sizeof(wifi_config.sta.password));
              wifi_config.sta.threshold.authmode = WIFI_AUTH_WPA2_PSK;

              esp_wifi_set_mode(WIFI_MODE_STA);
              esp_wifi_set_config(WIFI_IF_STA, &wifi_config);
              esp_wifi_start();
              esp_wifi_connect();
          }
          EOF

          if [ -f "$DEMO_DIR/main/CMakeLists.txt" ]; then
            sed -i 's/idf_component_register(/idf_component_register( REQUIRES esp_http_client esp_crt_bundle nvs_flash esp_wifi esp_event /g' "$DEMO_DIR/main/CMakeLists.txt"
            sed -i 's/SRCS /SRCS "gemini_os.c" /g' "$DEMO_DIR/main/CMakeLists.txt"
          fi

          echo "DEMO_DIR=$DEMO_DIR" >> $GITHUB_ENV

      - name: Build Native Waveshare V2 Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd "$DEMO_DIR"

          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 build

      - name: Package Monolithic Binary (Single .bin at 0x0)
        shell: bash
        run: |
          mkdir -p package_bin
          cd "$DEMO_DIR"

          BOOTLOADER=$(find build-waveshare/ -name "bootloader.bin" | head -n 1)
          PARTITIONS=$(find build-waveshare/ -name "partition-table.bin" | head -n 1)
          APP_BIN=$(find build-waveshare/ -name "*.bin" | grep -v "bootloader" | grep -v "partition" | head -n 1)

          echo "Bootloader: $BOOTLOADER"
          echo "Partitions: $PARTITIONS"
          echo "App: $APP_BIN"

          esptool.py --chip esp32s3 merge_bin \
            -o "$GITHUB_WORKSPACE/package_bin/gemini-os-full-0x0.bin" \
            --flash_mode keep \
            --flash_size keep \
            --flash_freq keep \
            0x0 "$BOOTLOADER" \
            0x10000 "$PARTITIONS" \
            0x20000 "$APP_BIN"

      - name: Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-waveshare-v2-full-0x0
          path: package_bin/gemini-os-full-0x0.bin
          if-no-files-found: error
