name: Build Gemini OS - Step 2 Audio Loopback

on:
  workflow_dispatch:

jobs:
  build-audio:
    name: Build - Audio Loopback Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare V2 Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install esptool
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip

      - name: Setup Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install LVGL 9.1
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "Arduino/libraries" ]; then
            cp -r Arduino/libraries/* ~/Arduino/libraries/ 2>/dev/null || true
          fi
          arduino-cli lib install "lvgl"@9.1.0 2>/dev/null || true

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_USE_STDLIB_MALLOC LV_STDLIB_BUILTIN
          #define LV_MEM_SIZE_KILOBYTES 128
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_20
          #define LV_USE_LABEL 1
          #define LV_USE_BAR 1
          #define LV_USE_DEMO_WIDGETS 0
          #define LV_USE_DEMO_MUSIC 0
          #define LV_USE_DEMO_BENCHMARK 0
          #define LV_USE_DEMO_STRESS 0
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h
          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/src/lv_conf.h 2>/dev/null || true
          cp ~/Arduino/libraries/lv_conf.h ~/Arduino/libraries/lvgl/lv_conf.h 2>/dev/null || true
          cp ~/Arduino/libraries/lv_conf.h Arduino/examples/10_LVGL_V9_Test/lv_conf.h 2>/dev/null || true
          rm -rf ~/Arduino/libraries/lvgl/src/demos ~/Arduino/libraries/lvgl/demos 2>/dev/null || true

      - name: Patch Drivers & Generate Audio Sketch
        shell: bash
        run: |
          SKETCH_DIR="Arduino/examples/10_LVGL_V9_Test"

          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|#include "demos/lv_demos.h"|// #include "demos/lv_demos.h"|g' {} + 2>/dev/null || true
          find "$SKETCH_DIR" -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) \
            -exec sed -i 's|lv_demo_widgets();|// lv_demo_widgets();|g' {} + 2>/dev/null || true

          python3 - << 'PYEOF'
          import re, os, textwrap, glob

          sketch_dir = "Arduino/examples/10_LVGL_V9_Test"

          # 1. lcd_bl_pwm_bsp.c
          for root, dirs, files in os.walk(sketch_dir):
              for file in files:
                  if file == "lcd_bl_pwm_bsp.c":
                      p = os.path.join(root, file)
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          bl_c = f.read()
                      bl_c = re.sub(r'ledc_stop\s*\([^;]+\);', '// ledc_stop disabled', bl_c)
                      with open(p, "w", encoding="utf-8") as f:
                          f.write(bl_c)

          # 2. I2C init function detection (cautam in toate fisierele .h din sketch_dir)
          i2c_init_func = "i2c_master_init" # fallback comun
          for h_path in glob.glob(f"{sketch_dir}/*.h"):
              with open(h_path, "r", encoding="utf-8", errors="ignore") as f:
                  h = f.read()
              for f_name, f_args in re.findall(
                  r'(?:esp_err_t|void|int|bool)\s+([a-zA-Z0-9_]+)\s*\(([^)]*)\)\s*;', h):
                  if "i2c" in f_name.lower() and "init" in f_name.lower() \
                     and f_args.strip() in ("", "void"):
                      i2c_init_func = f_name
                      break
          print(f"[OK] I2C init = {i2c_init_func}")

          # 3. lvgl_port.c patches
          port_path = f"{sketch_dir}/lvgl_port.c"
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              code = f.read()

          code = code.replace("LV_COLOR_FORMAT_GET_SIZE(LV_COLOR_FORMAT_RGB565)", "2")
          code = code.replace("lv_color_format_get_size(LV_COLOR_FORMAT_RGB565)", "2")
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*i2c_master_get_bus_handle\s*\(\s*0\s*,\s*&tca9554_i2c_bus\s*\)\s*\)\s*;',
              'if (i2c_master_get_bus_handle(0, &tca9554_i2c_bus) != ESP_OK) { puts("[EXIO] bus 0 not ready"); tca9554_i2c_bus = NULL; } else { puts("[EXIO] bus 0 acquired!"); }',
              code)
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_new_i2c_tca9554\s*\([^;]+\)\s*\)\s*;',
              'if (tca9554_i2c_bus != NULL) { if (esp_io_expander_new_i2c_tca9554(tca9554_i2c_bus, ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander) == ESP_OK) { puts("[EXIO] TCA9554 ok"); } else { puts("[EXIO] TCA9554 fail"); io_expander = NULL; } } else { io_expander = NULL; }',
              code)
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_dir\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;',
              r'if (io_expander != NULL) { esp_io_expander_set_dir(io_expander, \g<1>); }',
              code)
          code = re.sub(
              r'ESP_ERROR_CHECK\s*\(\s*esp_io_expander_set_level\s*\(\s*io_expander\s*,([^)]+)\)\s*\)\s*;',
              r'if (io_expander != NULL) { esp_io_expander_set_level(io_expander, \g<1>); }',
              code)

          with open(port_path, "w", encoding="utf-8") as f:
              f.write(code)

          # 4. lvgl_port_lock/unlock injection
          h_path = f"{sketch_dir}/lvgl_port.h"
          with open(h_path, "r", encoding="utf-8", errors="ignore") as f:
              h_content = f.read()
          with open(port_path, "r", encoding="utf-8", errors="ignore") as f:
              c_content = f.read()

          if "lvgl_port_lock" not in h_content:
              mux_var = None
              for pat in [r'SemaphoreHandle_t\s+(\w*[Mm]ux\w*)\s*[;=]',
                          r'SemaphoreHandle_t\s+(\w+)\s*[;=]']:
                  m = re.search(pat, c_content)
                  if m:
                      mux_var = m.group(1)
                      break
              if mux_var is None:
                  mux_var = "lvgl_port_mux"
                  c_content = re.sub(
                      r'(#include[^\n]+\n)(?![^\n]*#include)',
                      r'\1\nstatic SemaphoreHandle_t ' + mux_var + ' = NULL;\n',
                      c_content, count=1, flags=re.DOTALL)
                  c_content = re.sub(
                      r'(esp_err_t\s+lvgl_port_init\s*\([^)]*\)\s*\{)',
                      r'\1\n    ' + mux_var + ' = xSemaphoreCreateMutex();',
                      c_content, count=1)
              c_content += f"""

          bool lvgl_port_lock(uint32_t timeout_ms) {{
              if ({mux_var} == NULL) return false;
              return xSemaphoreTake({mux_var}, pdMS_TO_TICKS(timeout_ms)) == pdTRUE;
          }}
          void lvgl_port_unlock(void) {{
              if ({mux_var} != NULL) xSemaphoreGive({mux_var});
          }}
          """
              h_content += """
          #ifdef __cplusplus
          extern "C" {
          #endif
          bool lvgl_port_lock(uint32_t timeout_ms);
          void lvgl_port_unlock(void);
          #ifdef __cplusplus
          }
          #endif
          """
              with open(h_path, "w", encoding="utf-8") as f:
                  f.write(h_content)
              with open(port_path, "w", encoding="utf-8") as f:
                  f.write(c_content)

          # 5. Generate Audio Loopback .ino
          ino = textwrap.dedent(r'''
          #include <Arduino.h>
          #include <WiFi.h>
          #include <Wire.h>
          #include <driver/i2s_std.h>
          #include <driver/gpio.h>
          #include <esp_heap_caps.h>

          extern "C" {
          #include "i2c_bsp.h"
          #include "lvgl_port.h"
          }
          #include <lvgl.h>

          // ---------- Pini ----------
          #define LCD_BL    42
          #define BOOT_BTN  0
          #define PWR_BTN   16

          #define I2C_SDA   47
          #define I2C_SCL   48

          #define I2S_MCLK  7
          #define I2S_WS    46
          #define I2S_BCLK  15
          #define I2S_DIN   6
          #define I2S_DOUT  45

          // ---------- Config audio ----------
          #define SAMPLE_RATE    16000
          #define BUFFER_SAMPLES 1024   // ~64ms

          i2s_chan_handle_t tx_handle = NULL;
          i2s_chan_handle_t rx_handle = NULL;

          // ---------- UI ----------
          lv_obj_t *lbl_status = NULL;
          lv_obj_t *bar_level  = NULL;
          lv_obj_t *lbl_peak   = NULL;

          const char* ssid = "TP-Link_2.4G_9318_Guest";
          const char* password = "revelion";

          bool audio_ready = false;

          // ---------- Codec helpers ----------
          void es8311_write(uint8_t reg, uint8_t val) {
              Wire.beginTransmission(0x18);
              Wire.write(reg);
              Wire.write(val);
              Wire.endTransmission();
          }

          void es7210_write(uint8_t reg, uint8_t val) {
              Wire.beginTransmission(0x40);
              Wire.write(reg);
              Wire.write(val);
              Wire.endTransmission();
          }

          bool es8311_init() {
              Wire.beginTransmission(0x18);
              if (Wire.endTransmission() != 0) { Serial.println("[ES8311] not found"); return false; }

              es8311_write(0x00, 0x1F); delay(20);
              es8311_write(0x00, 0x00);
              es8311_write(0x01, 0x30);   // MCLK on, slave
              es8311_write(0x02, 0x00);   // pre-div
              es8311_write(0x03, 0x10);   // FS mode
              es8311_write(0x04, 0x10);
              es8311_write(0x05, 0x00);
              es8311_write(0x06, 0x03);   // BCLK div
              es8311_write(0x07, 0x00);
              es8311_write(0x08, 0xFF);
              es8311_write(0x09, 0x0C);   // 16-bit I2S
              es8311_write(0x0A, 0x0C);
              es8311_write(0x0B, 0x00);
              es8311_write(0x0C, 0x00);
              es8311_write(0x0D, 0x01);
              es8311_write(0x0E, 0x02);
              es8311_write(0x0F, 0x00);
              es8311_write(0x10, 0x1F);
              es8311_write(0x11, 0x7F);
              es8311_write(0x12, 0x00);
              es8311_write(0x13, 0x10);
              es8311_write(0x14, 0x1A);
              es8311_write(0x15, 0x40);
              es8311_write(0x16, 0x24);
              es8311_write(0x17, 0xBF);
              es8311_write(0x32, 0xBF);   // DAC volume ~-15dB
              es8311_write(0x37, 0x08);

              Serial.println("[ES8311] init OK");
              return true;
          }

          bool es7210_init() {
              Wire.beginTransmission(0x40);
              if (Wire.endTransmission() != 0) { Serial.println("[ES7210] not found"); return false; }

              es7210_write(0x00, 0xFF); delay(20);
              es7210_write(0x00, 0x41);   // reset + power up
              es7210_write(0x01, 0x1F);   // clock on
              es7210_write(0x02, 0x00);
              es7210_write(0x03, 0x00);
              es7210_write(0x04, 0x00);
              es7210_write(0x05, 0x00);
              es7210_write(0x06, 0x00);
              es7210_write(0x07, 0x00);
              es7210_write(0x08, 0x10);   // 16-bit I2S
              es7210_write(0x09, 0x30);
              es7210_write(0x0A, 0x30);
              es7210_write(0x0B, 0x00);
              es7210_write(0x0C, 0x00);
              es7210_write(0x0D, 0x00);
              es7210_write(0x0E, 0x00);
              es7210_write(0x0F, 0x00);
              es7210_write(0x10, 0x00);
              es7210_write(0x11, 0x60);   // mic bias
              es7210_write(0x12, 0x3F);   // ADC1 gain
              es7210_write(0x13, 0x3F);   // ADC2 gain
              es7210_write(0x14, 0x3F);   // ADC3 gain
              es7210_write(0x15, 0x3F);   // ADC4 gain

              Serial.println("[ES7210] init OK");
              return true;
          }

          bool i2s_init() {
              i2s_chan_config_t chan_cfg = I2S_CHANNEL_DEFAULT_CONFIG(I2S_NUM_0, I2S_ROLE_MASTER);
              chan_cfg.auto_clear = true;

              if (i2s_new_channel(&chan_cfg, &tx_handle, &rx_handle) != ESP_OK) {
                  Serial.println("[I2S] new_channel failed");
                  return false;
              }

              i2s_std_config_t std_cfg = {
                  .clk_cfg  = I2S_STD_CLK_DEFAULT_CONFIG(SAMPLE_RATE),
                  .slot_cfg = I2S_STD_PHILIPS_SLOT_DEFAULT_CONFIG(I2S_DATA_BIT_WIDTH_16BIT, I2S_SLOT_MODE_STEREO),
                  .gpio_cfg = {
                      .mclk = (gpio_num_t)I2S_MCLK,
                      .bclk = (gpio_num_t)I2S_BCLK,
                      .ws   = (gpio_num_t)I2S_WS,
                      .dout = (gpio_num_t)I2S_DOUT,
                      .din  = (gpio_num_t)I2S_DIN,
                      .invert_flags = { .mclk_inv = false, .bclk_inv = false, .ws_inv = false }
                  }
              };
              std_cfg.clk_cfg.mclk_multiple = I2S_MCLK_MULTIPLE_256;

              if (i2s_channel_init_std_mode(tx_handle, &std_cfg) != ESP_OK) { Serial.println("[I2S] tx init fail"); return false; }
              if (i2s_channel_init_std_mode(rx_handle, &std_cfg) != ESP_OK) { Serial.println("[I2S] rx init fail"); return false; }
              if (i2s_channel_enable(tx_handle) != ESP_OK) { Serial.println("[I2S] tx enable fail"); return false; }
              if (i2s_channel_enable(rx_handle) != ESP_OK) { Serial.println("[I2S] rx enable fail"); return false; }

              Serial.println("[I2S] init OK (16kHz stereo full-duplex)");
              return true;
          }

          void build_ui() {
              pinMode(LCD_BL, OUTPUT);
              digitalWrite(LCD_BL, LOW);

              lvgl_port_lock(1000);
              lv_obj_t *scr = lv_screen_active();
              if (!scr) scr = lv_scr_act();
              if (!scr) { lvgl_port_unlock(); return; }

              lv_obj_clean(scr);
              lv_obj_set_style_bg_color(scr, lv_color_hex(0x0F172A), 0);
              lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, 0);

              lv_obj_t *t = lv_label_create(scr);
              lv_label_set_text(t, "Audio Loopback");
              lv_obj_set_style_text_color(t, lv_color_hex(0x38BDF8), 0);
              lv_obj_set_style_text_font(t, &lv_font_montserrat_18, 0);
              lv_obj_align(t, LV_ALIGN_TOP_MID, 0, 20);

              lbl_status = lv_label_create(scr);
              lv_label_set_text(lbl_status, "Initializing...");
              lv_obj_set_style_text_color(lbl_status, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_font(lbl_status, &lv_font_montserrat_14, 0);
              lv_obj_align(lbl_status, LV_ALIGN_TOP_MID, 0, 55);

              bar_level = lv_bar_create(scr);
              lv_obj_set_size(bar_level, 140, 20);
              lv_obj_align(bar_level, LV_ALIGN_CENTER, 0, 0);
              lv_bar_set_range(bar_level, 0, 100);
              lv_obj_set_style_bg_color(bar_level, lv_color_hex(0x1E293B), LV_PART_MAIN);
              lv_obj_set_style_bg_color(bar_level, lv_color_hex(0x22C55E), LV_PART_INDICATOR);

              lbl_peak = lv_label_create(scr);
              lv_label_set_text(lbl_peak, "Peak: 0");
              lv_obj_set_style_text_color(lbl_peak, lv_color_hex(0x94A3B8), 0);
              lv_obj_set_style_text_font(lbl_peak, &lv_font_montserrat_14, 0);
              lv_obj_align(lbl_peak, LV_ALIGN_CENTER, 0, 40);

              lvgl_port_unlock();
          }

          void update_level(int level) {
              if (!lvgl_port_lock(50)) return;
              if (bar_level) lv_bar_set_value(bar_level, level, LV_ANIM_OFF);
              if (lbl_peak) {
                  char b[32];
                  lv_snprintf(b, sizeof(b), "Peak: %d", level);
                  lv_label_set_text(lbl_peak, b);
              }
              lvgl_port_unlock();
          }

          void set_status(const char* s) {
              if (!lvgl_port_lock(200)) return;
              if (lbl_status) lv_label_set_text(lbl_status, s);
              lvgl_port_unlock();
          }

          int16_t *audio_buf = NULL;
          size_t buf_bytes = 0;

          void setup() {
              Serial.begin(115200);
              delay(500);
              Serial.println("\n=== Gemini OS Audio Loopback ===");

              pinMode(BOOT_BTN, INPUT_PULLUP);
              pinMode(PWR_BTN, INPUT_PULLUP);

              I2C_INIT_CALL
              delay(50);

              lvgl_port_init();
              delay(300);
              build_ui();

              Wire.begin(I2C_SDA, I2C_SCL, 400000);
              delay(50);

              // Pornim I2S mai intai ca sa generam MCLK pentru codecuri
              if (!i2s_init()) {
                  set_status("I2S init failed");
                  return;
              }

              bool ok8311 = es8311_init();
              bool ok7210 = es7210_init();

              if (!ok8311 || !ok7210) {
                  set_status("Codec lipsa! Verifica Serial");
                  Serial.println("[ERR] Un codec nu a raspuns");
                  return;
              }

              buf_bytes = BUFFER_SAMPLES * 2 * sizeof(int16_t);
              audio_buf = (int16_t*) heap_caps_malloc(buf_bytes, MALLOC_CAP_SPIRAM | MALLOC_CAP_8BIT);
              if (!audio_buf) {
                  Serial.println("[ERR] Cannot alloc audio buffer in PSRAM");
                  set_status("PSRAM alloc fail");
                  return;
              }
              Serial.printf("[I2S] Buffer alocat: %u bytes in PSRAM\n", (unsigned)buf_bytes);

              set_status("Loopback activ - vorbeste!");
              audio_ready = true;

              WiFi.mode(WIFI_STA);
              WiFi.setSleep(false);
              WiFi.begin(ssid, password);
          }

          void loop() {
              if (!audio_ready) {
                  delay(1000);
                  return;
              }

              size_t bytes_read = 0;
              esp_err_t err = i2s_channel_read(rx_handle, audio_buf, buf_bytes, &bytes_read, 1000);
              if (err != ESP_OK || bytes_read == 0) {
                  delay(10);
                  return;
              }

              int samples = bytes_read / sizeof(int16_t);
              int32_t peak = 0;
              for (int i = 0; i < samples; i++) {
                  int32_t v = audio_buf[i];
                  if (v < 0) v = -v;
                  if (v > peak) peak = v;
              }

              int level = (peak * 100) / 32768;
              update_level(level);

              size_t bytes_written = 0;
              i2s_channel_write(tx_handle, audio_buf, bytes_read, &bytes_written, 1000);

              static unsigned long last_log = 0;
              if (millis() - last_log > 2000) {
                  last_log = millis();
                  if (WiFi.status() == WL_CONNECTED) {
                      Serial.printf("[LOOP] peak=%d level=%d%% ip=%s\n",
                          (int)peak, level, WiFi.localIP().toString().c_str());
                  } else {
                      Serial.printf("[LOOP] peak=%d level=%d%% wifi=...\n", (int)peak, level);
                  }
              }
          }
          ''').lstrip()

          # Inlocuim apelul I2C detectat dinamic
          ino = ino.replace("I2C_INIT_CALL", f"{i2c_init_func}();")

          with open(f"{sketch_dir}/10_LVGL_V9_Test.ino", "w", encoding="utf-8") as f:
              f.write(ino)
          print("[OK] Audio loopback .ino generat cu succes")
          PYEOF

      - name: Compile Firmware
        run: |
          SKETCH_PATH="Arduino/examples/10_LVGL_V9_Test/10_LVGL_V9_Test.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge into Single .bin
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-os-full-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/gemini-os-full-0x0.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-audio-loopback
          path: package_bin/gemini-os-full-0x0.bin
          if-no-files-found: error
