name: Build Waveshare V2 Gemini Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Gemini Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Official Waveshare V2 Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Configure Gemini Assistant & Dependencies
        shell: bash
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'revelion' }}
        run: |
          # Identificare director de proiect ESP-IDF din repo-ul Waveshare
          IDF_DIR=$(find . -maxdepth 3 -type f -name "CMakeLists.txt" | grep -i "esp-idf" | head -n 1 | xargs -r dirname)
          if [ -z "$IDF_DIR" ]; then
            IDF_DIR=$(find . -maxdepth 3 -type f -name "CMakeLists.txt" | grep -v "^\./CMakeLists.txt$" | head -n 1 | xargs -r dirname)
          fi
          echo "Proiect detectat in: $IDF_DIR"

          mkdir -p "$IDF_DIR/main"

          # Adaugare dependenta cJSON prin ESP Component Manager
          cat << 'EOF' > "$IDF_DIR/main/idf_component.yml"
          dependencies:
            espressif/cjson: "^1.7.18"
          EOF

          # Inregistrare componente si sursa noua in CMakeLists.txt
          if [ -f "$IDF_DIR/main/CMakeLists.txt" ]; then
            sed -i 's/idf_component_register(/idf_component_register( REQUIRES esp_http_client esp_crt_bundle nvs_flash esp_wifi esp_event /g' "$IDF_DIR/main/CMakeLists.txt"
            sed -i 's/SRCS /SRCS "gemini_assistant.c" /g' "$IDF_DIR/main/CMakeLists.txt"
          fi

          # Creare modul Gemini REST Client
          cat << 'EOF' > "$IDF_DIR/main/gemini_assistant.c"
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include "esp_log.h"
          #include "esp_http_client.h"
          #include "esp_crt_bundle.h"
          #include "cJSON.h"
          #include "nvs_flash.h"
          #include "esp_wifi.h"
          #include "esp_event.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"

          static const char *TAG = "GEMINI_ASSISTANT";
          EOF

          cat << EOF >> "$IDF_DIR/main/gemini_assistant.c"
          static const char *G_KEY = "${GEMINI_KEY}";
          static const char *W_SSID = "${WIFI_SSID}";
          static const char *W_PASS = "${WIFI_PASSWORD}";
          EOF

          cat << 'EOF' >> "$IDF_DIR/main/gemini_assistant.c"
          void gemini_query(const char *prompt) {
              if (!prompt || strlen(prompt) == 0) return;

              char url;
              snprintf(url, sizeof(url), "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=%s", G_KEY);

              cJSON *root = cJSON_CreateObject();
              cJSON *contents = cJSON_AddArrayToObject(root, "contents");
              cJSON *item = cJSON_CreateObject();
              cJSON_AddItemToArray(contents, item);
              cJSON *parts = cJSON_AddArrayToObject(item, "parts");
              cJSON *part = cJSON_CreateObject();
              cJSON_AddStringToObject(part, "text", prompt);
              cJSON_AddItemToArray(parts, part);

              char *post_data = cJSON_PrintUnformatted(root);
              cJSON_Delete(root);

              if (post_data) {
                  esp_http_client_config_t config = {
                      .url = url,
                      .method = HTTP_METHOD_POST,
                      .crt_bundle_attach = esp_crt_bundle_attach,
                      .timeout_ms = 18000,
                      .buffer_size = 4096,
                      .buffer_size_tx = 4096,
                  };
                  esp_http_client_handle_t client = esp_http_client_init(&config);
                  esp_http_client_set_header(client, "Content-Type", "application/json");
                  esp_http_client_set_post_field(client, post_data, strlen(post_data));

                  esp_err_t err = esp_http_client_perform(client);
                  int status = esp_http_client_get_status_code(client);

                  if (err == ESP_OK && status == 200) {
                      ESP_LOGI(TAG, "Raspuns primit cu succes de la Gemini 2.0 Flash.");
                  } else {
                      ESP_LOGE(TAG, "Eroare comunicare Gemini: HTTP %d", status);
                  }
                  free(post_data);
                  esp_http_client_cleanup(client);
              }
          }

          static void wifi_event_handler(void* arg, esp_event_base_t event_base,
                                         int32_t event_id, void* event_data) {
              if (event_base == IP_EVENT && event_id == IP_EVENT_STA_GOT_IP) {
                  ESP_LOGI(TAG, "Wi-Fi Conectat! Validare automata Gemini...");
                  gemini_query("Salut! Confirma conexiunea in limba romana.");
              }
          }

          void gemini_app_start(void) {
              nvs_flash_init();
              esp_netif_init();
              esp_event_loop_create_default();
              esp_netif_create_default_wifi_sta();

              wifi_init_config_t cfg = WIFI_INIT_CONFIG_DEFAULT();
              esp_wifi_init(&cfg);

              esp_event_handler_instance_register(IP_EVENT, IP_EVENT_STA_GOT_IP, &wifi_event_handler, NULL, NULL);

              wifi_config_t wifi_config;
              memset(&wifi_config, 0, sizeof(wifi_config));
              strncpy((char*)wifi_config.sta.ssid, W_SSID, sizeof(wifi_config.sta.ssid));
              strncpy((char*)wifi_config.sta.password, W_PASS, sizeof(wifi_config.sta.password));
              wifi_config.sta.threshold.authmode = WIFI_AUTH_WPA2_PSK;

              esp_wifi_set_mode(WIFI_MODE_STA);
              esp_wifi_set_config(WIFI_IF_STA, &wifi_config);
              esp_wifi_start();
              esp_wifi_connect();
          }
          EOF

      - name: Build Native Waveshare V2 Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          
          IDF_DIR=$(find . -maxdepth 3 -type f -name "CMakeLists.txt" | grep -i "esp-idf" | head -n 1 | xargs -r dirname)
          if [ -z "$IDF_DIR" ]; then
            IDF_DIR=$(find . -maxdepth 3 -type f -name "CMakeLists.txt" | grep -v "^\./CMakeLists.txt$" | head -n 1 | xargs -r dirname)
          fi
          cd "$IDF_DIR"
          
          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 build

      - name: Package Standard Firmware Files (.bin)
        shell: bash
        run: |
          mkdir -p package_bin
          cp $(find . -name "bootloader.bin" | head -n 1) package_bin/ 2>/dev/null || true
          cp $(find . -name "partition-table.bin" | head -n 1) package_bin/ 2>/dev/null || true
          cp $(find . -name "ota_data_initial.bin" | head -n 1) package_bin/ 2>/dev/null || true
          cp $(find . -name "*.bin" | grep -v "bootloader" | grep -v "partition" | grep -v "ota" | head -n 1) package_bin/gemini-gadget.bin 2>/dev/null || true

          cat << 'EOF' > package_bin/flasher_args.json
          {
              "write_flash_args" : [ "--flash-mode", "dio",
                                     "--flash-size", "keep",
                                     "--flash-freq", "80m" ],
              "flash_settings" : {
                  "flash_mode": "dio",
                  "flash_size": "keep",
                  "flash_freq": "80m"
              },
              "flash_files" : {
                  "0x0" : "bootloader.bin",
                  "0x10000" : "partition-table.bin",
                  "0x1d000" : "ota_data_initial.bin",
                  "0x20000" : "gemini-gadget.bin"
              },
              "bootloader" : { "offset" : "0x0", "file" : "bootloader.bin", "encrypted" : "false" },
              "partition-table" : { "offset" : "0x10000", "file" : "partition-table.bin", "encrypted" : "false" },
              "otadata" : { "offset" : "0x1d000", "file" : "ota_data_initial.bin", "encrypted" : "false" },
              "app" : { "offset" : "0x20000", "file" : "gemini-gadget.bin", "encrypted" : "false" },
              "extra_esptool_args" : {
                  "after"  : "hard-reset",
                  "before" : "default-reset",
                  "stub"   : true,
                  "chip"   : "esp32s3"
              }
          }
          EOF

      - name: Upload Clean Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare-v2-gemini
          path: package_bin/
          if-no-files-found: error
