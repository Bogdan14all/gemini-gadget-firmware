name: Build Gemini OS - The Complete AI Assistant Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Ultimate Gemini OS (Full Features)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Waveshare Official Base
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Tools
        run: |
          pip install "esptool<5"
          sudo apt-get update && sudo apt-get install -y zip
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Required Libraries
        shell: bash
        run: |
          mkdir -p ~/Arduino/libraries
          arduino-cli lib install "lvgl"@8.3.11
          arduino-cli lib install "WebSockets"@2.5.2
          arduino-cli lib install "ArduinoJson"@7.0.4

          cat << 'EOF' > ~/Arduino/libraries/lv_conf.h
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 16
          #define LV_COLOR_16_SWAP 1
          #define LV_MEM_CUSTOM 0
          #define LV_MEM_SIZE (256U * 1024U) // Expanded LVGL RAM for Tabview
          #define LV_TICK_CUSTOM 0
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_24 1
          #define LV_FONT_DEFAULT &lv_font_montserrat_14
          #define LV_USE_KEYBOARD 1
          #define LV_USE_TEXTAREA 1
          #define LV_USE_TABVIEW 1
          #define LV_USE_SLIDER 1
          #define LV_USE_BAR 1
          #define LV_USE_LIST 1
          #endif
          EOF
          sed -i 's/^[ \t]*//' ~/Arduino/libraries/lv_conf.h

      - name: Prepare Workspace & Extract Init
        shell: bash
        run: |
          rm -rf sketch
          cp -r Examples/Arduino/08_Audio_Test sketch
          cd sketch
          rm -f 08_Audio_Test.ino
          
          # Remove demo widgets that break custom UI
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include "demos/lv_demos.h"|//|g' {} + || true
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|lv_demo_widgets();|//|g' {} + || true

          grep -hoE '(bsp_i2c_init|i2c_master_init|i2c_master_Init)\s*\(' *.h *.c | head -n 1 | sed 's/(//' | tr -d ' ' > i2c_func.txt || echo "bsp_i2c_init" > i2c_func.txt

      - name: Create Secrets File
        shell: bash
        run: |
          echo "#pragma once" > sketch/secrets.h
          echo "#define SECRET_GEMINI_API_KEY \"${{ secrets.GEMINI_API_KEY }}\"" >> sketch/secrets.h
          echo "#define SECRET_WIFI_SSID \"${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}\"" >> sketch/secrets.h
          echo "#define SECRET_WIFI_PASS \"${{ secrets.WIFI_PASSWORD || 'revelion' }}\"" >> sketch/secrets.h

      - name: Write Complete Gemini OS Sketch
        shell: bash
        run: |
          I2C_FUNC=$(cat sketch/i2c_func.txt)
          cat << 'PYEOF' > generator.py
          import sys
          i2c_init = sys.argv[1]
          code = f"""
          #include <Arduino.h>
          #include <WiFi.h>
          #include <time.h>
          #include <WebSocketsClient.h>
          #include <ArduinoJson.h>
          #include <base64.h>
          #include "secrets.h"

          extern "C" {{
          #include "lvgl_port.h"
          #include "i2c_bsp.h"
          #include "src/codec_board/codec_board.h"
          #include "src/codec_board/codec_init.h"
          #include "src/tca9554/esp_io_expander_tca9554.h"
          }}
          #include <lvgl.h>

          #define BOOT_BTN 0

          // --- HW Globals ---
          esp_codec_dev_handle_t playback = NULL;
          esp_codec_dev_handle_t record = NULL;
          esp_io_expander_handle_t io_expander = NULL;
          WebSocketsClient ws;

          // --- State Globals ---
          volatile bool is_recording = false;
          bool ws_ready = false;
          int g_mic_peak = 0;
          static int16_t buf_in_stereo[1024];
          static int16_t buf_mono_16k[341];

          // Timer Globals
          unsigned long timer_target = 0;
          bool timer_running = false;

          // --- UI Pointers ---
          lv_obj_t *tv_main;
          lv_obj_t *lbl_clock_main;
          lv_obj_t *lbl_weather;
          lv_obj_t *ta_chat_out;
          lv_obj_t *ta_chat_in;
          lv_obj_t *kb_main;
          lv_obj_t *lbl_sys_info;
          lv_obj_t *lbl_timer_val;
          lv_obj_t *btn_ptt;
          lv_obj_t *lbl_ptt_state;

          // ==========================================
          // 1. HARDWARE INIT MODULE
          // ==========================================
          void hw_init() {{
              {i2c_init}();
              delay(50);
              
              i2c_master_bus_handle_t bus;
              i2c_master_get_bus_handle(0, &bus);
              esp_io_expander_new_i2c_tca9554(bus, ESP_IO_EXPANDER_I2C_TCA9554_ADDRESS_000, &io_expander);
              esp_io_expander_set_dir(io_expander, IO_EXPANDER_PIN_NUM_7, IO_EXPANDER_OUTPUT);
              esp_io_expander_set_level(io_expander, IO_EXPANDER_PIN_NUM_7, 1);

              set_codec_board_type((char*)"S3_LCD_3_49");
              codec_init_cfg_t cfg = {{
                  .in_mode = CODEC_I2S_MODE_TDM,
                  .out_mode = CODEC_I2S_MODE_TDM,
                  .in_use_tdm = false,
                  .reuse_dev = false,
              }};
              init_codec(&cfg);
              playback = get_playback_handle();
              record   = get_record_handle();
              
              esp_codec_dev_set_out_vol(playback, 80.0);
              esp_codec_dev_set_in_gain(record, 40.0);
              esp_codec_dev_sample_info_t fs = {{ .bits_per_sample = 16, .channel = 2, .sample_rate = 24000 }};
              esp_codec_dev_open(playback, &fs);
              esp_codec_dev_open(record, &fs);

              lvgl_port_init();
          }}

          // ==========================================
          // 2. UI EVENT HANDLERS
          // ==========================================
          static void kb_event_cb(lv_event_t * e) {{
              if(lv_event_get_code(e) == LV_EVENT_READY) {{
                  const char* txt = lv_textarea_get_text(ta_chat_in);
                  if (strlen(txt) > 0) {{
                      if (ws_ready) {{
                          JsonDocument doc;
                          doc["clientContent"]["turns"][0]["role"] = "user";
                          doc["clientContent"]["turns"][0]["parts"][0]["text"] = txt;
                          doc["clientContent"]["turnComplete"] = true;
                          String out; serializeJson(doc, out);
                          ws.sendTXT(out);
                      }}
                      lv_textarea_add_text(ta_chat_out, "Eu: ");
                      lv_textarea_add_text(ta_chat_out, txt);
                      lv_textarea_add_text(ta_chat_out, "\\n");
                      lv_textarea_set_text(ta_chat_in, "");
                  }}
              }}
          }}

          static void timer_btn_cb(lv_event_t * e) {{
              lv_event_code_t code = lv_event_get_code(e);
              lv_obj_t * btn = lv_event_get_target(e);
              lv_obj_t * label = lv_obj_get_child(btn, 0);
              if(code == LV_EVENT_CLICKED) {{
                  if(!timer_running) {{
                      timer_target = millis() + (5 * 60 * 1000); // 5 minutes timer
                      timer_running = true;
                      lv_label_set_text(label, "Stop Timer");
                  }} else {{
                      timer_running = false;
                      lv_label_set_text(lbl_timer_val, "05:00");
                      lv_label_set_text(label, "Start 5 Min");
                  }}
              }}
          }}

          static void ptt_btn_cb(lv_event_t * e) {{
              lv_event_code_t code = lv_event_get_code(e);
              if(code == LV_EVENT_PRESSED) {{
                  is_recording = true;
                  lv_obj_set_style_bg_color(btn_ptt, lv_color_hex(0xEF4444), 0);
                  lv_label_set_text(lbl_ptt_state, "ASCULT...");
              }} else if(code == LV_EVENT_RELEASED || code == LV_EVENT_PRESS_LOST) {{
                  is_recording = false;
                  lv_obj_set_style_bg_color(btn_ptt, lv_color_hex(0x3B82F6), 0);
                  lv_label_set_text(lbl_ptt_state, "APASĂ & VORBEȘTE");
                  if (ws_ready) ws.sendTXT("{{\\"clientContent\\": {{\\"turnComplete\\": true}}}}");
              }}
          }}

          // ==========================================
          // 3. FULL OS UI BUILDER
          // ==========================================
          void os_ui_build() {{
              example_lvgl_lock(1000);
              
              // Base Tabview: 110px width for the left side menu, leaves exactly 530x172 for content
              tv_main = lv_tabview_create(lv_scr_act(), LV_DIR_LEFT, 110);
              lv_obj_set_style_bg_color(tv_main, lv_color_hex(0x0F172A), 0);
              
              lv_obj_t * tab_home  = lv_tabview_add_tab(tv_main, "Acasă");
              lv_obj_t * tab_chat  = lv_tabview_add_tab(tv_main, "AI Text");
              lv_obj_t * tab_voice = lv_tabview_add_tab(tv_main, "AI Voce");
              lv_obj_t * tab_media = lv_tabview_add_tab(tv_main, "Media");
              lv_obj_t * tab_tools = lv_tabview_add_tab(tv_main, "Unelte");
              lv_obj_t * tab_sys   = lv_tabview_add_tab(tv_main, "Sistem");

              // --- TAB 1: Acasă (Home & Weather) ---
              lbl_clock_main = lv_label_create(tab_home);
              lv_obj_set_style_text_font(lbl_clock_main, &lv_font_montserrat_24, 0);
              lv_obj_align(lbl_clock_main, LV_ALIGN_CENTER, 0, -20);
              lv_label_set_text(lbl_clock_main, "00:00");

              lbl_weather = lv_label_create(tab_home);
              lv_obj_align(lbl_weather, LV_ALIGN_CENTER, 0, 20);
              lv_label_set_text(lbl_weather, "București: 22°C (Simulat)");
              lv_obj_set_style_text_color(lbl_weather, lv_color_hex(0x38BDF8), 0);

              // --- TAB 2: AI Chat (Strict geometry 530x172) ---
              ta_chat_out = lv_textarea_create(tab_chat);
              lv_obj_set_size(ta_chat_out, 200, 100);
              lv_obj_set_pos(ta_chat_out, 0, 0);
              lv_textarea_set_text(ta_chat_out, "Gemini OS Conectat.\\n");
              
              ta_chat_in = lv_textarea_create(tab_chat);
              lv_obj_set_size(ta_chat_in, 200, 55);
              lv_obj_set_pos(ta_chat_in, 0, 105);
              lv_textarea_set_placeholder_text(ta_chat_in, "Tastați aici...");
              
              kb_main = lv_keyboard_create(tab_chat);
              lv_obj_set_size(kb_main, 320, 160);
              lv_obj_set_pos(kb_main, 205, 0);
              lv_keyboard_set_textarea(kb_main, ta_chat_in);
              lv_obj_add_event_cb(kb_main, kb_event_cb, LV_EVENT_ALL, NULL);

              // --- TAB 3: AI Voce (Voice Assistant / PTT) ---
              btn_ptt = lv_btn_create(tab_voice);
              lv_obj_set_size(btn_ptt, 200, 80);
              lv_obj_align(btn_ptt, LV_ALIGN_CENTER, 0, 0);
              lv_obj_add_event_cb(btn_ptt, ptt_btn_cb, LV_EVENT_ALL, NULL);
              
              lbl_ptt_state = lv_label_create(btn_ptt);
              lv_label_set_text(lbl_ptt_state, "APASĂ & VORBEȘTE");
              lv_obj_center(lbl_ptt_state);

              // --- TAB 4: Media (MP3/Radio Interface Placeholder) ---
              lv_obj_t * lbl_media = lv_label_create(tab_media);
              lv_label_set_text(lbl_media, "Media Player (MicroSD / Radio)\\nInterfață pregătită pentru integrarea I2S.");
              lv_obj_align(lbl_media, LV_ALIGN_CENTER, 0, -20);
              
              lv_obj_t * btn_play = lv_btn_create(tab_media);
              lv_obj_set_size(btn_play, 100, 40);
              lv_obj_align(btn_play, LV_ALIGN_CENTER, 0, 20);
              lv_obj_t * lbl_play = lv_label_create(btn_play);
              lv_label_set_text(lbl_play, "PLAY MOCK");
              lv_obj_center(lbl_play);

              // --- TAB 5: Unelte (Timer) ---
              lbl_timer_val = lv_label_create(tab_tools);
              lv_obj_set_style_text_font(lbl_timer_val, &lv_font_montserrat_24, 0);
              lv_label_set_text(lbl_timer_val, "05:00");
              lv_obj_align(lbl_timer_val, LV_ALIGN_CENTER, 0, -20);

              lv_obj_t * btn_timer = lv_btn_create(tab_tools);
              lv_obj_set_size(btn_timer, 140, 40);
              lv_obj_align(btn_timer, LV_ALIGN_CENTER, 0, 20);
              lv_obj_add_event_cb(btn_timer, timer_btn_cb, LV_EVENT_ALL, NULL);
              lv_obj_t * lbl_timer_btn = lv_label_create(btn_timer);
              lv_label_set_text(lbl_timer_btn, "Start 5 Min");
              lv_obj_center(lbl_timer_btn);

              // --- TAB 6: Sistem (Diagnostics) ---
              lbl_sys_info = lv_label_create(tab_sys);
              lv_obj_set_pos(lbl_sys_info, 10, 10);
              lv_label_set_text(lbl_sys_info, "Se încarcă diagnostice...");

              example_lvgl_unlock();
          }}

          // ==========================================
          // 4. WEBSOCKETS & NETWORK
          // ==========================================
          void wsEvent(WStype_t type, uint8_t* payload, size_t len) {{
              if (type == WStype_CONNECTED) {{
                  JsonDocument doc;
                  doc["setup"]["model"] = "models/gemini-2.0-flash-exp";
                  String out; serializeJson(doc, out);
                  ws.sendTXT(out);
              }} else if (type == WStype_TEXT) {{
                  JsonDocument doc;
                  if (!deserializeJson(doc, payload, len)) {{
                      if (doc["setupComplete"].is<JsonObject>()) ws_ready = true;
                      
                      const char* txt = doc["serverContent"]["modelTurn"]["parts"][0]["text"];
                      if(txt) {{
                          example_lvgl_lock(100);
                          lv_textarea_add_text(ta_chat_out, "AI: ");
                          lv_textarea_add_text(ta_chat_out, txt);
                          lv_textarea_add_text(ta_chat_out, "\\n");
                          example_lvgl_unlock();
                      }}
                  }}
              }}
          }}

          void setup() {{
              Serial.begin(115200);
              pinMode(BOOT_BTN, INPUT_PULLUP);
              
              hw_init();
              os_ui_build();

              WiFi.mode(WIFI_STA);
              WiFi.begin(SECRET_WIFI_SSID, SECRET_WIFI_PASS);
              configTzTime("EET-2EEST,M3.5.0/3,M10.5.0/4", "pool.ntp.org", "time.google.com");
              
              String path = "/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + String(SECRET_GEMINI_API_KEY);
              ws.beginSSL("generativelanguage.googleapis.com", 443, path.c_str());
              ws.onEvent(wsEvent);
          }}

          // ==========================================
          // 5. MAIN SUPERLOOP (Non-Blocking)
          // ==========================================
          void loop() {{
              ws.loop(); // Handle WS traffic in background

              // 5.1 System Task (1 HZ updater)
              static unsigned long last_ui = 0;
              if (millis() - last_ui > 1000) {{
                  last_ui = millis();
                  example_lvgl_lock(100);
                  
                  // Clock Update
                  struct tm ti;
                  char time_str[16] = "--:--";
                  if (getLocalTime(&ti, 10)) strftime(time_str, sizeof(time_str), "%H:%M", &ti);
                  if(lbl_clock_main) lv_label_set_text(lbl_clock_main, time_str);
                  
                  // Diagnostics Update
                  char info[256];
                  snprintf(info, sizeof(info), "Ceas: %s\\nWiFi: %s\\nIP: %s\\nRAM Liber: %d KB\\nStare WS: %s",
                           time_str,
                           (WiFi.status() == WL_CONNECTED) ? "Conectat" : "Deconectat",
                           WiFi.localIP().toString().c_str(),
                           esp_get_free_heap_size() / 1024,
                           ws_ready ? "ONLINE" : "Așteptare");
                  if(lbl_sys_info) lv_label_set_text(lbl_sys_info, info);
                  example_lvgl_unlock();
              }}

              // 5.2 Timer Task (10 HZ)
              if (timer_running) {{
                  long remain = timer_target - millis();
                  if (remain <= 0) {{
                      timer_running = false;
                      example_lvgl_lock(100);
                      lv_label_set_text(lbl_timer_val, "TIMP EXPIRAT!");
                      example_lvgl_unlock();
                  }} else {{
                      int min = (remain / 1000) / 60;
                      int sec = (remain / 1000) % 60;
                      char tbuf[16];
                      snprintf(tbuf, sizeof(tbuf), "%02d:%02d", min, sec);
                      example_lvgl_lock(100);
                      lv_label_set_text(lbl_timer_val, tbuf);
                      example_lvgl_unlock();
                  }}
              }}

              // 5.3 Hardware PTT Button Override (GPIO 0)
              bool hw_boot = (digitalRead(BOOT_BTN) == LOW);
              if (hw_boot && !is_recording) {{
                  is_recording = true;
                  example_lvgl_lock(100);
                  if(btn_ptt) lv_obj_set_style_bg_color(btn_ptt, lv_color_hex(0xEF4444), 0);
                  if(lbl_ptt_state) lv_label_set_text(lbl_ptt_state, "MIC ON (HARDWARE)");
                  example_lvgl_unlock();
              }} else if (!hw_boot && is_recording && lv_obj_get_state(btn_ptt) != LV_STATE_PRESSED) {{
                  is_recording = false;
                  if (ws_ready) ws.sendTXT("{{\\"clientContent\\": {{\\"turnComplete\\": true}}}}");
                  example_lvgl_lock(100);
                  if(btn_ptt) lv_obj_set_style_bg_color(btn_ptt, lv_color_hex(0x3B82F6), 0);
                  if(lbl_ptt_state) lv_label_set_text(lbl_ptt_state, "APASĂ & VORBEȘTE");
                  example_lvgl_unlock();
              }}

              // 5.4 Audio ADC Read & Stream Task
              if (is_recording && ws_ready) {{
                  if (esp_codec_dev_read(record, buf_in_stereo, sizeof(buf_in_stereo)) == ESP_OK) {{
                      int frames = (sizeof(buf_in_stereo)/sizeof(int16_t)) / 2;
                      // Downsample 24k -> 16k mono
                      int out_count = frames * 2 / 3;
                      for (int i = 0; i < out_count; i++) buf_mono_16k[i] = buf_in_stereo[((i * 3) / 2) * 2];

                      String b64_str = base64::encode((uint8_t*)buf_mono_16k, out_count * sizeof(int16_t));
                      if (b64_str.length() > 0) {{
                          JsonDocument doc;
                          doc["realtimeInput"]["mediaChunks"][0]["mimeType"] = "audio/pcm;rate=16000";
                          doc["realtimeInput"]["mediaChunks"][0]["data"] = b64_str;
                          String out; serializeJson(doc, out);
                          ws.sendTXT(out);
                      }}
                  }}
              }}

              delay(10); // Prevent watchdog trigger
          }}
          """
          with open("sketch/sketch.ino", "w", encoding="utf-8") as f:
              f.write(code.lstrip())
          PYEOF
          python3 generator.py "$I2C_FUNC"

      - name: Compile OS Firmware
        run: |
          SKETCH_PATH="sketch/sketch.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge Partitions
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-os-complete-v2.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-complete-v2
          path: package_bin/gemini-os-complete-v2.bin
          if-no-files-found: error
