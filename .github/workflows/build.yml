name: Setup Clean Gemini Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    name: Import Eatin, Purge iFlytek and Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout User Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Patch UI Layout, Gemini Credentials & Clean Chinese Stack
        shell: bash
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'revelion' }}
        run: |
          # 1. Clonare structura completa daca nu exista local
          if [ ! -d "esp32" ]; then
            echo "Clonare cod sursa original Waveshare..."
            git clone --recursive https://github.com/Eatin/muse-gadget-waveshare-349.git temp_upstream
            cp -a temp_upstream/. .
            rm -rf temp_upstream
          fi

          mkdir -p esp32/components/muse/src

          # 2. Neutralizare eroare pin flash SPI din led_status.c
          find esp32/ -name "led_status.c" -exec sed -i 's/#error.*SPI flash pin.*/\/\/ bypassed SPI flash pin/' {} + 2>/dev/null || true

          # 3. Creare motor REST nativ C pentru Gemini 2.0 Flash
          cat << 'EOF' > esp32/components/muse/src/gemini_engine.c
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include "esp_log.h"
          #include "esp_http_client.h"
          #include "esp_crt_bundle.h"
          #include "cJSON.h"
          #include "mbedtls/base64.h"
          #include "nvs_flash.h"
          #include "nvs.h"
          #include "esp_heap_caps.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"

          static const char *TAG_G = "GEMINI_CORE";
          EOF

          cat << EOF >> esp32/components/muse/src/gemini_engine.c
          static const char *G_KEY = "${GEMINI_KEY}";
          static const char *W_SSID = "${WIFI_SSID}";
          static const char *W_PASS = "${WIFI_PASSWORD}";
          EOF

          cat << 'EOF' >> esp32/components/muse/src/gemini_engine.c
          static void* safe_alloc(size_t size) {
              void *ptr = heap_caps_malloc(size, MALLOC_CAP_SPIRAM | MALLOC_CAP_8BIT);
              if (!ptr) ptr = malloc(size);
              return ptr;
          }

          void gemini_auto_init_nvs(void) {
              nvs_handle_t h;
              if (nvs_open("wifi", NVS_READWRITE, &h) == ESP_OK) {
                  nvs_set_str(h, "ssid", W_SSID);
                  nvs_set_str(h, "password", W_PASS);
                  nvs_commit(h);
                  nvs_close(h);
              }
              if (nvs_open("muse", NVS_READWRITE, &h) == ESP_OK) {
                  nvs_set_str(h, "token", G_KEY);
                  nvs_set_str(h, "device_token", G_KEY);
                  nvs_set_str(h, "api_key", G_KEY);
                  nvs_set_str(h, "vm_id", "gemini-2.0-flash");
                  nvs_set_str(h, "server", "generativelanguage.googleapis.com");
                  nvs_set_u8(h, "paired", 1);
                  nvs_set_u8(h, "activated", 1);
                  nvs_commit(h);
                  nvs_close(h);
              }
          }

          typedef struct {
              uint8_t *pcm_data;
              size_t pcm_len;
          } audio_task_args_t;

          static void gemini_process_audio_task(void *arg) {
              audio_task_args_t *args = (audio_task_args_t*)arg;
              if (!args) { vTaskDelete(NULL); return; }

              size_t wav_len = 44 + args->pcm_len;
              uint8_t *wav_buf = (uint8_t*)safe_alloc(wav_len);
              if (wav_buf) {
                  memcpy(wav_buf, "RIFF", 4);
                  uint32_t file_size = wav_len - 8;
                  memcpy(wav_buf + 4, &file_size, 4);
                  memcpy(wav_buf + 8, "WAVEfmt ", 8);
                  uint32_t subchunk1_size = 16;
                  uint16_t audio_format = 1, num_channels = 1;
                  uint32_t sample_rate = 16000, byte_rate = 32000;
                  uint16_t block_align = 2, bits_per_sample = 16;
                  memcpy(wav_buf + 16, &subchunk1_size, 4);
                  memcpy(wav_buf + 20, &audio_format, 2);
                  memcpy(wav_buf + 22, &num_channels, 2);
                  memcpy(wav_buf + 24, &sample_rate, 4);
                  memcpy(wav_buf + 28, &byte_rate, 4);
                  memcpy(wav_buf + 32, &block_align, 2);
                  memcpy(wav_buf + 34, &bits_per_sample, 2);
                  memcpy(wav_buf + 36, "data", 4);
                  uint32_t data_size = args->pcm_len;
                  memcpy(wav_buf + 40, &data_size, 4);
                  memcpy(wav_buf + 44, args->pcm_data, args->pcm_len);

                  free(args->pcm_data);
                  args->pcm_data = NULL;

                  size_t b64_len = ((wav_len + 2) / 3) * 4 + 1;
                  char *b64_str = (char*)safe_alloc(b64_len);
                  if (b64_str) {
                      size_t out_len = 0;
                      mbedtls_base64_encode((unsigned char *)b64_str, b64_len, &out_len, wav_buf, wav_len);
                      b64_str[out_len] = '\0';
                      free(wav_buf); wav_buf = NULL;

                      cJSON *root = cJSON_CreateObject();
                      cJSON *contents = cJSON_AddArrayToObject(root, "contents");
                      cJSON *content = cJSON_CreateObject();
                      cJSON_AddItemToArray(contents, content);
                      cJSON *parts = cJSON_AddArrayToObject(content, "parts");

                      cJSON *audio_part = cJSON_CreateObject();
                      cJSON *inline_data = cJSON_AddObjectToObject(audio_part, "inline_data");
                      cJSON_AddStringToObject(inline_data, "mime_type", "audio/wav");
                      cJSON_AddStringToObject(inline_data, "data", b64_str);
                      cJSON_AddItemToArray(parts, audio_part);

                      cJSON *text_part = cJSON_CreateObject();
                      cJSON_AddStringToObject(text_part, "text", "Raspunde scurt in limba romana.");
                      cJSON_AddItemToArray(parts, text_part);

                      char *post_data = cJSON_PrintUnformatted(root);
                      cJSON_Delete(root);
                      free(b64_str);

                      char url[320];
                      snprintf(url, sizeof(url), "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=%s", G_KEY);

                      esp_http_client_config_t config = {
                          .url = url,
                          .method = HTTP_METHOD_POST,
                          .crt_bundle_attach = esp_crt_bundle_attach,
                          .timeout_ms = 18000,
                          .buffer_size = 4096,
                          .buffer_size_tx = 4096,
                      };
                      esp_http_client_handle_t client = esp_http_client_init(&config);
                      esp_http_client_set_header(client, "Content-Type", "application/json");
                      esp_http_client_set_post_field(client, post_data, strlen(post_data));

                      esp_http_client_perform(client);
                      free(post_data);
                      esp_http_client_cleanup(client);
                  }
                  if (wav_buf) free(wav_buf);
              }
              if (args->pcm_data) free(args->pcm_data);
              free(args);
              vTaskDelete(NULL);
          }

          void gemini_dispatch_audio(const uint8_t *pcm_data, size_t pcm_len) {
              if (!pcm_data || pcm_len == 0) return;
              audio_task_args_t *args = safe_alloc(sizeof(audio_task_args_t));
              if (!args) return;
              args->pcm_data = safe_alloc(pcm_len);
              if (!args->pcm_data) { free(args); return; }
              memcpy(args->pcm_data, pcm_data, pcm_len);
              args->pcm_len = pcm_len;
              xTaskCreate(gemini_process_audio_task, "gem_audio", 8192, args, 5, NULL);
          }
          EOF

          # 4. Modificare tastatura: Casuta text sus (620x36) + Tastatura lata jos (640x130)
          python3 - << 'PYEOF'
          import os, re

          for root, dirs, files in os.walk("esp32/components/muse"):
              for file in files:
                  if not file.endswith((".c", ".cpp", ".h")):
                      continue
                  p = os.path.join(root, file)
                  with open(p, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  orig = content

                  # Redenumire etichete si eliminare referinte chinezesti / Muse
                  content = content.replace('"MUSE"', '"GEMINI AI"')
                  content = content.replace('"Muse"', '"Gemini AI"')
                  content = content.replace('"VM ID"', '"Model"')
                  content = content.replace('"Device token"', '"Gemini Key"')
                  content = content.replace("iFlytek • SenseNova", "Google Gemini 2.0")
                  content = content.replace("iFlytek + SenseNova", "Google Gemini 2.0")
                  content = content.replace("iFlytek", "Google Gemini")
                  content = content.replace("SenseNova", "Google Gemini")
                  content = content.replace("讯飞拒绝连接", "Eroare Gemini")
                  content = content.replace("讯飞", "Gemini")
                  content = content.replace("Pair with the Muse app", "Gemini 2.0 Flash Standalone")
                  content = content.replace("Reset pairing", "Gemini Ready")

                  if "muse_settings" in file:
                      content = content.replace('"iat-api.xfyun.cn"', '"generativelanguage.googleapis.com"')
                      content = content.replace('"api.sensenova.cn"', '"generativelanguage.googleapis.com"')
                      content = content.replace('"hatch.metaaivm.com"', '"generativelanguage.googleapis.com"')

                  # Layout vertical: Casuta text deasupra, tastatura lata dedesubt (fara suprapunere pe 640x172)
                  def fix_kb_call(m):
                      kb = m.group(1).strip()
                      ta = m.group(2).strip()
                      return (
                          f"lv_keyboard_set_textarea({kb}, {ta});\n"
                          f"    if ({kb} && {ta}) {{\n"
                          f"        lv_obj_t *__cont = lv_obj_get_parent({kb});\n"
                          f"        if (__cont && __cont != lv_scr_act()) {{\n"
                          f"            lv_obj_set_size(__cont, 640, 172);\n"
                          f"            lv_obj_set_pos(__cont, 0, 0);\n"
                          f"            lv_obj_set_style_pad_all(__cont, 0, 0);\n"
                          f"            lv_obj_set_layout(__cont, 0);\n"
                          f"        }}\n"
                          f"        lv_obj_set_size({ta}, 620, 36);\n"
                          f"        lv_obj_align({ta}, LV_ALIGN_TOP_MID, 0, 2);\n"
                          f"        lv_textarea_set_one_line({ta}, true);\n"
                          f"        lv_textarea_set_password_mode({ta}, false);\n"
                          f"        lv_obj_set_style_pad_all({ta}, 4, 0);\n"
                          f"        lv_obj_clear_flag({ta}, LV_OBJ_FLAG_HIDDEN);\n"
                          f"        lv_obj_move_foreground({ta});\n"
                          f"        lv_obj_set_size({kb}, 640, 130);\n"
                          f"        lv_obj_align({kb}, LV_ALIGN_BOTTOM_MID, 0, 0);\n"
                          f"        lv_obj_set_style_pad_all({kb}, 1, LV_PART_MAIN);\n"
                          f"        lv_obj_set_style_pad_row({kb}, 1, LV_PART_MAIN);\n"
                          f"        lv_obj_set_style_pad_all({kb}, 1, LV_PART_ITEMS);\n"
                          f"        lv_obj_set_style_pad_row({kb}, 1, LV_PART_ITEMS);\n"
                          f"        lv_obj_clear_flag({kb}, LV_OBJ_FLAG_HIDDEN);\n"
                          f"        lv_obj_move_foreground({kb});\n"
                          f"    }}"
                      )

                  content = re.sub(r'lv_keyboard_set_textarea\s*\(\s*([a-zA-Z0-9_>.-]+)\s*,\s*([a-zA-Z0-9_>.-]+)\s*\);', fix_kb_call, content)

                  # Bypass pairing
                  content = re.sub(r'bool\s+muse_is_paired\s*\([^)]*\)\s*\{[^}]*\}', 'bool muse_is_paired(void) { return true; }', content)
                  content = re.sub(r'bool\s+muse_is_activated\s*\([^)]*\)\s*\{[^}]*\}', 'bool muse_is_activated(void) { return true; }', content)
                  content = re.sub(r'bool\s+muse_app_is_paired\s*\([^)]*\)\s*\{[^}]*\}', 'bool muse_app_is_paired(void) { return true; }', content)

                  if content != orig:
                      with open(p, "w", encoding="utf-8") as f:
                          f.write(content)
          PYEOF

          # 5. Conectare precisa in app_main
          APP_MAIN_FILE=$(grep -rnwl "esp32" -e "app_main" | head -n 1)
          if [ -n "$APP_MAIN_FILE" ] && ! grep -q "gemini_auto_init_nvs" "$APP_MAIN_FILE"; then
            sed -i '1s/^/void gemini_auto_init_nvs(void);\n/' "$APP_MAIN_FILE"
            sed -i '/nvs_flash_init();/a \    gemini_auto_init_nvs();' "$APP_MAIN_FILE"
          fi

          # 6. Salvare permanenta pe branch-ul main
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git checkout -B main || true
          git add esp32/
          git commit -m "Layout: Wide keyboard bottom + single-line text input top" || true
          git push origin main || true

      - name: Build Native Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd esp32

          find . -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} + 2>/dev/null || true
          echo "target_compile_options(\${COMPONENT_LIB} PRIVATE -Wno-error -Wno-unused-variable)" >> components/muse/CMakeLists.txt 2>/dev/null || true
          sed -i 's/SRCS /SRCS "src\/gemini_engine.c" /g' components/muse/CMakeLists.txt 2>/dev/null || true

          OVERLAY=$(find devices/ -type f -name "*349*" | head -n 1)
          DEFAULTS="sdkconfig.defaults"
          [ -f "devices/sdkconfig.muse" ] && DEFAULTS="$DEFAULTS;devices/sdkconfig.muse"
          [ -n "$OVERLAY" ] && DEFAULTS="$DEFAULTS;$OVERLAY"

          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS="$DEFAULTS" build

      - name: Package Standard Firmware Files (.bin)
        shell: bash
        run: |
          mkdir -p package_bin
          cp esp32/build-waveshare/bootloader/bootloader.bin package_bin/ 2>/dev/null || true
          cp esp32/build-waveshare/partition_table/partition-table.bin package_bin/ 2>/dev/null || true
          cp esp32/build-waveshare/ota_data_initial.bin package_bin/ 2>/dev/null || true
          cp esp32/build-waveshare/muse-gadget.bin package_bin/ 2>/dev/null || true

          cat << 'EOF' > package_bin/flasher_args.json
          {
              "write_flash_args" : [ "--flash-mode", "dio",
                                     "--flash-size", "keep",
                                     "--flash-freq", "80m" ],
              "flash_settings" : {
                  "flash_mode": "dio",
                  "flash_size": "keep",
                  "flash_freq": "80m"
              },
              "flash_files" : {
                  "0x0" : "bootloader.bin",
                  "0x10000" : "partition-table.bin",
                  "0x1d000" : "ota_data_initial.bin",
                  "0x20000" : "muse-gadget.bin"
              },
              "bootloader" : { "offset" : "0x0", "file" : "bootloader.bin", "encrypted" : "false" },
              "partition-table" : { "offset" : "0x10000", "file" : "partition-table.bin", "encrypted" : "false" },
              "otadata" : { "offset" : "0x1d000", "file" : "ota_data_initial.bin", "encrypted" : "false" },
              "app" : { "offset" : "0x20000", "file" : "muse-gadget.bin", "encrypted" : "false" },
              "extra_esptool_args" : {
                  "after"  : "hard-reset",
                  "before" : "default-reset",
                  "stub"   : true,
                  "chip"   : "esp32s3"
              }
          }
          EOF

      - name: Upload Clean Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare-349-bin
          path: package_bin/
          if-no-files-found: error
