          void setup() {
              Serial.begin(115200);
              delay(500);
              Serial.println("\n[BOOT] BUILD v5.4-mic-and-wdt-fix");
              Serial.println("=== Gemini OS v5.5 ===");

              pinMode(BOOT_BTN, INPUT_PULLUP);
              pinMode(PWR_BTN, INPUT_PULLUP);

              I2C_INIT_CALL
              delay(50);
              lvgl_port_init();
              delay(300);
              build_ui();

              if (i2c_master_get_bus_handle(0, &i2c_bus) != ESP_OK) {
                  Serial.println("[FATAL] I2C bus 0 unavailable");
                  return;
              }

              // Reset TCA9554
              i2c_write_reg(0x20, 0x03, 0x00); delay(100);
              i2c_write_reg(0x20, 0x01, 0x00); delay(500);
              i2c_write_reg(0x20, 0x01, 0xFF); delay(500);

              // I2S init FIRST
              if (!i2s_init_std()) {
                  Serial.println("[FATAL] I2S TDM init failed");
                  return;
              }
              delay(500); // MCLK stabilize

              es7210_init_official();
              delay(200);

              diag_readback();

              Serial.println("[MIC] AUTO-STARTED - speak now!");
              Serial.println("[WiFi] Starting...");
              WiFi.mode(WIFI_STA);
              WiFi.setSleep(false);
              WiFi.begin(ssid, password);
          }

          void loop() {
              // ---------- BUTOANE cu debounce ----------
              bool b_raw = digitalRead(BOOT_BTN);
              bool p_raw = digitalRead(PWR_BTN);

              if (b_raw != last_boot_state) {
                  unsigned long now = millis();
                  if (now - last_boot_change > DEBOUNCE_MS) {
                      last_boot_change = now;
                      last_boot_state = b_raw;
                      g_boot_pressed = (b_raw == LOW);
                      Serial.printf("[BTN] BOOT: %s\n", g_boot_pressed ? "APASAT" : "ELIBERAT");
                      lv_async_call(ui_update_cb, NULL);
                  }
              } else {
                  last_boot_change = millis();
              }

              if (p_raw != last_pwr_state) {
                  unsigned long now = millis();
                  if (now - last_pwr_change > DEBOUNCE_MS) {
                      last_pwr_change = now;
                      last_pwr_state = p_raw;
                      g_pwr_pressed = (p_raw == LOW);
                      Serial.printf("[BTN] PWR: %s\n", g_pwr_pressed ? "APASAT" : "ELIBERAT");
                      lv_async_call(ui_update_cb, NULL);
                  }
              } else {
                  last_pwr_change = millis();
              }

              // ---------- MIC READ (every 100ms) ----------
              static unsigned long last_mic = 0;
              if (millis() - last_mic > 100) {
                  last_mic = millis();
                  static int16_t mic_buf[512];
                  size_t bytes_read = 0;
                  esp_err_t err = i2s_channel_read(rx_handle, mic_buf, sizeof(mic_buf), &bytes_read, 50);

                  g_mic_total++;
                  if (err == ESP_OK && bytes_read > 0) {
                      int samples = bytes_read / sizeof(int16_t);
                      int32_t peak = 0;
                      for (int i = 0; i < samples; i++) {
                          int32_t v = mic_buf[i];
                          if (v < 0) v = -v;
                          if (v > peak) peak = v;
                      }
                      g_mic_peak = (int)peak;
                      g_mic_level = (int)((peak * 100) / 32768);
                      if (g_mic_level > 100) g_mic_level = 100;

                      if (peak > 5) { // Small noise floor threshold
                          g_mic_ok++;
                          g_mic_active = true;
                      } else {
                          g_mic_active = false;
                      }

                      static int32_t last_logged_peak = -1;
                      if (peak != last_logged_peak) {
                          last_logged_peak = peak;
                          uint8_t* bp = (uint8_t*)mic_buf;
                          Serial.printf("[MIC] peak=%5d lvl=%3d%% bytes=%d RAW=", (int)peak, g_mic_level, (int)bytes_read);
                          for (int i = 0; i < 8 && i < bytes_read; i++) Serial.printf("%02X ", bp[i]);
                          Serial.printf(" | ok=%d/%d\n", g_mic_ok, g_mic_total);
                      }
                  } else {
                      Serial.printf("[MIC] READ FAIL err=%d total=%d\n", (int)err, g_mic_total);
                  }
                  lv_async_call(ui_update_cb, NULL);
              }

              // ---------- WIFI ----------
              wl_status_t wstat = WiFi.status();
              static bool ntp_done = false;
              if (wstat == WL_CONNECTED) {
                  static bool was_connected = false;
                  if (!was_connected) {
                      was_connected = true;
                      snprintf(g_wifi_str, sizeof(g_wifi_str), "WiFi: %s", WiFi.localIP().toString().c_str());
                      lv_async_call(ui_update_cb, NULL);
                  }
                  if (!ntp_done) {
                      ntp_done = true;
                      configTzTime("EET-2EEST,M3.5.0/3,M10.5.0/4", "pool.ntp.org", "time.google.com");
                  }
                  static unsigned long last_clock = 0;
                  if (millis() - last_clock > 1000) {
                      last_clock = millis();
                      struct tm ti;
                      if (getLocalTime(&ti, 50)) {
                          strftime(g_clock_str, sizeof(g_clock_str), "%H:%M:%S", &ti);
                          strftime(g_date_str, sizeof(g_date_str), "%d %b %Y", &ti);
                          lv_async_call(ui_update_cb, NULL);
                      }
                  }
                  static unsigned long last_ping = 0;
                  if (millis() - last_ping > 10000) {
                      last_ping = millis();
                      WiFiClient c;
                      unsigned long t0 = millis();
                      bool ok = c.connect("1.1.1.1", 53, 2000);
                      unsigned long lat = millis() - t0;
                      c.stop();
                      if (ok) {
                          snprintf(g_ping_str, sizeof(g_ping_str), "Internet: OK (%lu ms)", lat);
                          lv_async_call(ui_update_cb, NULL);
                      }
                  }
              } else {
                  snprintf(g_wifi_str, sizeof(g_wifi_str), "WiFi: conectare...");
              }

              // ---------- TICK ----------
              static unsigned long last_tick = 0;
              if (millis() - last_tick > 500) {
                  last_tick = millis();
                  g_tick++;
                  lv_async_call(ui_update_cb, NULL);
              }

              delay(20);
          }
          ''').lstrip()

          ino = ino.replace("I2C_INIT_CALL", f"{i2c_init_func}();")

          with open(f"{sketch_dir}/10_LVGL_V9_Test.ino", "w", encoding="utf-8") as f:
              f.write(ino)
          print("[OK] v5.4 mic and WDT fix .ino generat")
          PYEOF

      - name: Compile Firmware
        run: |
          SKETCH_PATH="Arduino/examples/10_LVGL_V9_Test/10_LVGL_V9_Test.ino"
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          arduino-cli compile --fqbn "$FQBN" --output-dir build_output "$SKETCH_PATH"

      - name: Merge into Single .bin
        shell: bash
        run: |
          mkdir -p package_bin
          BOOTLOADER=$(ls build_output/*.bootloader.bin | head -n 1)
          PARTITIONS=$(ls build_output/*.partitions.bin | head -n 1)
          APP_BIN=$(ls build_output/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o package_bin/gemini-v5.7-codec-fix-0x0.bin \
            --flash_mode keep --flash_size 16MB --flash_freq 80m \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0x10000 "$APP_BIN"
          ls -lh package_bin/gemini-v5.7-codec-fix-0x0.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-v5.7-codec-fix
          path: package_bin/gemini-v5.7-codec-fix-0x0.bin
          if-no-files-found: error
