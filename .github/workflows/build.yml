name: Build Clean Waveshare V2 Gemini Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Waveshare 3.49 V2 Gemini Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Official Waveshare V2 Repository
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-3.49-V2
          submodules: recursive

      - name: Configure Clean Gemini Assistant on Official Drivers
        shell: bash
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'TP-Link_2.4G_9318_Guest' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'revelion' }}
        run: |
          # Identificare director proiect oficial ESP-IDF
          IDF_DIR=$(find . -maxdepth 3 -type f -name "CMakeLists.txt" | grep -i "esp-idf" | head -n 1 | xargs -r dirname)
          if [ -z "$IDF_DIR" ]; then
            IDF_DIR=$(find . -maxdepth 3 -type f -name "CMakeLists.txt" | grep -v "\./CMakeLists.txt" | head -n 1 | xargs -r dirname)
          fi
          echo "Director proiect detectat: $IDF_DIR"

          # Creare modul nativ Gemini REST & Wi-Fi
          mkdir -p "$IDF_DIR/main"

          cat << 'EOF' > "$IDF_DIR/main/gemini_assistant.c"
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include "esp_log.h"
          #include "esp_http_client.h"
          #include "esp_crt_bundle.h"
          #include "cJSON.h"
          #include "nvs_flash.h"
          #include "nvs.h"
          #include "esp_wifi.h"
          #include "esp_event.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "lvgl.h"

          static const char *TAG = "GEMINI_ASSISTANT";
          EOF

          cat << EOF >> "$IDF_DIR/main/gemini_assistant.c"
          static const char *G_KEY = "${GEMINI_KEY}";
          static const char *W_SSID = "${WIFI_SSID}";
          static const char *W_PASS = "${WIFI_PASSWORD}";
          EOF

          cat << 'EOF' >> "$IDF_DIR/main/gemini_assistant.c"
          static lv_obj_t *s_status_label = NULL;
          static lv_obj_t *s_dialog_label = NULL;

          void gemini_ui_set_status(const char *status) {
              if (s_status_label && status) {
                  lv_label_set_text(s_status_label, status);
              }
          }

          void gemini_ui_set_response(const char *resp) {
              if (s_dialog_label && resp) {
                  lv_label_set_text(s_dialog_label, resp);
              }
          }

          void gemini_ui_create(lv_obj_t *scr) {
              if (!scr) scr = lv_scr_act();
              lv_obj_clear_flag(scr, LV_OBJ_FLAG_SCROLLABLE);
              lv_obj_set_style_bg_color(scr, lv_color_hex(0x0A0F1D), 0);

              // 1. Bara de stare sus: 640 x 22 px
              lv_obj_t *bar = lv_obj_create(scr);
              lv_obj_set_size(bar, 640, 24);
              lv_obj_set_pos(bar, 0, 0);
              lv_obj_set_style_bg_color(bar, lv_color_hex(0x131B2E), 0);
              lv_obj_set_style_border_width(bar, 0, 0);
              lv_obj_set_style_pad_all(bar, 2, 0);
              lv_obj_clear_flag(bar, LV_OBJ_FLAG_SCROLLABLE);

              s_status_label = lv_label_create(bar);
              lv_obj_align(s_status_label, LV_ALIGN_LEFT_MID, 10, 0);
              lv_obj_set_style_text_color(s_status_label, lv_color_hex(0x3B82F6), 0);
              lv_obj_set_style_text_font(s_status_label, &lv_font_montserrat_12, 0);
              lv_label_set_text(s_status_label, "Conectare Wi-Fi...");

              // 2. Zona centrala de dialog: 620 x 140 px
              s_dialog_label = lv_label_create(scr);
              lv_obj_set_size(s_dialog_label, 620, 140);
              lv_obj_set_pos(s_dialog_label, 10, 28);
              lv_obj_set_style_bg_color(s_dialog_label, lv_color_hex(0x111827), 0);
              lv_obj_set_style_bg_opa(s_dialog_label, LV_OPA_COVER, 0);
              lv_obj_set_style_border_color(s_dialog_label, lv_color_hex(0x2563EB), 0);
              lv_obj_set_style_border_width(s_dialog_label, 1, 0);
              lv_obj_set_style_radius(s_dialog_label, 6, 0);
              lv_obj_set_style_pad_all(s_dialog_label, 8, 0);
              lv_obj_set_style_text_color(s_dialog_label, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_font(s_dialog_label, &lv_font_montserrat_12, 0);
              lv_label_set_long_mode(s_dialog_label, LV_LABEL_LONG_WRAP);
              lv_label_set_text(s_dialog_label, "Gemini 2.0 Flash este gata de utilizare.\nApasati butonul BOOT pentru a adresa o intrebare.");
          }

          static void gemini_query_task(void *pvParam) {
              const char *prompt = (const char*)pvParam;
              if (!prompt) { vTaskDelete(NULL); return; }

              gemini_ui_set_status("Gemini gandeste...");

              char url[320];
              snprintf(url, sizeof(url), "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=%s", G_KEY);

              cJSON *root = cJSON_CreateObject();
              cJSON *contents = cJSON_AddArrayToObject(root, "contents");
              cJSON *item = cJSON_CreateObject();
              cJSON_AddItemToArray(contents, item);
              cJSON *parts = cJSON_AddArrayToObject(item, "parts");
              cJSON *part = cJSON_CreateObject();
              cJSON_AddStringToObject(part, "text", prompt);
              cJSON_AddItemToArray(parts, part);

              char *post_data = cJSON_PrintUnformatted(root);
              cJSON_Delete(root);

              if (post_data) {
                  esp_http_client_config_t config = {
                      .url = url,
                      .method = HTTP_METHOD_POST,
                      .crt_bundle_attach = esp_crt_bundle_attach,
                      .timeout_ms = 18000,
                      .buffer_size = 4096,
                      .buffer_size_tx = 4096,
                  };
                  esp_http_client_handle_t client = esp_http_client_init(&config);
                  esp_http_client_set_header(client, "Content-Type", "application/json");
                  esp_http_client_set_post_field(client, post_data, strlen(post_data));

                  esp_err_t err = esp_http_client_perform(client);
                  int status = esp_http_client_get_status_code(client);

                  if (err == ESP_OK && status == 200) {
                      int len = esp_http_client_get_content_length(client);
                      if (len <= 0) len = 8192;
                      char *buf = malloc(len + 1);
                      if (buf) {
                          int read_bytes = esp_http_client_read(client, buf, len);
                          buf[read_bytes > 0 ? read_bytes : 0] = '\0';
                          cJSON *res_root = cJSON_Parse(buf);
                          if (res_root) {
                              cJSON *cands = cJSON_GetObjectItem(res_root, "candidates");
                              if (cands && cJSON_GetArraySize(cands) > 0) {
                                  cJSON *c0 = cJSON_GetArrayItem(cands, 0);
                                  cJSON *cnt = cJSON_GetObjectItem(c0, "content");
                                  if (cnt) {
                                      cJSON *pts = cJSON_GetObjectItem(cnt, "parts");
                                      if (pts && cJSON_GetArraySize(pts) > 0) {
                                          cJSON *p0 = cJSON_GetArrayItem(pts, 0);
                                          cJSON *txt = cJSON_GetObjectItem(p0, "text");
                                          if (txt && txt->valuestring) {
                                              gemini_ui_set_response(txt->valuestring);
                                          }
                                      }
                                  }
                              }
                              cJSON_Delete(res_root);
                          }
                          free(buf);
                      }
                      gemini_ui_set_status("Gemini: Gata");
                  } else {
                      char err_buf[64];
                      snprintf(err_buf, sizeof(err_buf), "Eroare Gemini (HTTP %d)", status);
                      gemini_ui_set_response(err_buf);
                      gemini_ui_set_status("Eroare Conexiune");
                  }
                  free(post_data);
                  esp_http_client_cleanup(client);
              }
              vTaskDelete(NULL);
          }

          static void wifi_event_handler(void* arg, esp_event_base_t event_base,
                                         int32_t event_id, void* event_data) {
              if (event_base == IP_EVENT && event_id == IP_EVENT_STA_GOT_IP) {
                  ESP_LOGI(TAG, "Wi-Fi Conectat!");
                  gemini_ui_set_status("Wi-Fi Conectat | Gemini Online");
              }
          }

          void gemini_app_start(void) {
              nvs_flash_init();
              esp_netif_init();
              esp_event_loop_create_default();
              esp_netif_create_default_wifi_sta();

              wifi_init_config_t cfg = WIFI_INIT_CONFIG_DEFAULT();
              esp_wifi_init(&cfg);

              esp_event_handler_instance_register(IP_EVENT, IP_EVENT_STA_GOT_IP, &wifi_event_handler, NULL, NULL);

              wifi_config_t wifi_config;
              memset(&wifi_config, 0, sizeof(wifi_config));
              strncpy((char*)wifi_config.sta.ssid, W_SSID, sizeof(wifi_config.sta.ssid));
              strncpy((char*)wifi_config.sta.password, W_PASS, sizeof(wifi_config.sta.password));
              wifi_config.sta.threshold.authmode = WIFI_AUTH_WPA2_PSK;

              esp_wifi_set_mode(WIFI_MODE_STA);
              esp_wifi_set_config(WIFI_IF_STA, &wifi_config);
              esp_wifi_start();
              esp_wifi_connect();
          }
          EOF

          # Integrare sursa in CMakeLists.txt al aplicatiei principale
          if [ -f "$IDF_DIR/main/CMakeLists.txt" ]; then
            sed -i 's/SRCS /SRCS "gemini_assistant.c" /g' "$IDF_DIR/main/CMakeLists.txt"
          fi

      - name: Build Native Waveshare V2 Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          
          IDF_DIR=$(find . -maxdepth 3 -type f -name "CMakeLists.txt" | grep -i "esp-idf" | head -n 1 | xargs -r dirname)
          if [ -z "$IDF_DIR" ]; then
            IDF_DIR=$(find . -maxdepth 3 -type f -name "CMakeLists.txt" | grep -v "\./CMakeLists.txt" | head -n 1 | xargs -r dirname)
          fi
          cd "$IDF_DIR"
          
          idf.py -B build-waveshare -DIDF_TARGET=esp32s3 build

      - name: Package Standard Firmware Files (.bin)
        shell: bash
        run: |
          mkdir -p package_bin
          cp $(find . -name "bootloader.bin" | head -n 1) package_bin/ 2>/dev/null || true
          cp $(find . -name "partition-table.bin" | head -n 1) package_bin/ 2>/dev/null || true
          cp $(find . -name "ota_data_initial.bin" | head -n 1) package_bin/ 2>/dev/null || true
          cp $(find . -name "*.bin" | grep -v "bootloader" | grep -v "partition" | grep -v "ota" | head -n 1) package_bin/gemini-gadget.bin 2>/dev/null || true

          cat << 'EOF' > package_bin/flasher_args.json
          {
              "write_flash_args" : [ "--flash-mode", "dio",
                                     "--flash-size", "keep",
                                     "--flash-freq", "80m" ],
              "flash_settings" : {
                  "flash_mode": "dio",
                  "flash_size": "keep",
                  "flash_freq": "80m"
              },
              "flash_files" : {
                  "0x0" : "bootloader.bin",
                  "0x10000" : "partition-table.bin",
                  "0x1d000" : "ota_data_initial.bin",
                  "0x20000" : "gemini-gadget.bin"
              },
              "bootloader" : { "offset" : "0x0", "file" : "bootloader.bin", "encrypted" : "false" },
              "partition-table" : { "offset" : "0x10000", "file" : "partition-table.bin", "encrypted" : "false" },
              "otadata" : { "offset" : "0x1d000", "file" : "ota_data_initial.bin", "encrypted" : "false" },
              "app" : { "offset" : "0x20000", "file" : "gemini-gadget.bin", "encrypted" : "false" },
              "extra_esptool_args" : {
                  "after"  : "hard-reset",
                  "before" : "default-reset",
                  "stub"   : true,
                  "chip"   : "esp32s3"
              }
          }
          EOF

      - name: Upload Clean Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare-v2-gemini
          path: package_bin/
          if-no-files-found: error
